<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ligninger – Trin for trin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #0d0d0d;
  --card:   #141414;
  --border: #222;
  --yellow: #f5d000;
  --red:    #e03030;
  --white:  #ffffff;
  --muted:  rgba(255,255,255,0.35);
  --fdisp:  'Oswald', sans-serif;
  --fbody:  'Nunito Sans', sans-serif;
}
html, body {
  width: 100%; min-height: 100%;
  background: var(--bg);
  color: var(--white);
  font-family: var(--fbody);
  -webkit-tap-highlight-color: transparent;
}

/* ── LAYOUT ── */
.wrap {
  max-width: 620px;
  margin: 0 auto;
  padding: 24px 16px 80px;
}

/* ── HEADER ── */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.top-title {
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: clamp(18px, 5vw, 24px);
  color: var(--yellow);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.top-counter {
  font-family: var(--fdisp);
  font-size: 13px;
  color: var(--muted);
  letter-spacing: .06em;
}

/* ── PROGRESS BAR ── */
.progress-track {
  height: 4px;
  background: #1e1e1e;
  border-radius: 2px;
  margin-bottom: 28px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--yellow);
  border-radius: 2px;
  transition: width .5s ease;
}

/* ── LEVEL BADGE ── */
.level-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--fdisp);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--yellow);
  background: rgba(245,208,0,0.08);
  border: 1px solid rgba(245,208,0,0.2);
  border-radius: 3px;
  padding: 4px 10px;
  margin-bottom: 14px;
}

/* ── EQUATION DISPLAY ── */
.eq-display {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 28px 20px 22px;
  margin-bottom: 20px;
  text-align: center;
  position: relative;
}
.eq-label {
  font-family: var(--fbody);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.eq-main {
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: clamp(32px, 8vw, 52px);
  color: var(--yellow);
  letter-spacing: .02em;
  line-height: 1.1;
}
.eq-desc {
  font-size: 13px;
  color: var(--muted);
  margin-top: 10px;
  line-height: 1.5;
}

/* ── STEPS AREA ── */
.steps-section {
  margin-bottom: 20px;
}
.steps-title {
  font-family: var(--fdisp);
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  padding-left: 2px;
}
.step-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ── SINGLE STEP ── */
.step {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.step-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.step-num {
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: 11px;
  color: var(--muted);
  min-width: 18px;
}
.step-instruction {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  flex: 1;
  line-height: 1.4;
}
.step-body {
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.step-eq {
  font-family: var(--fdisp);
  font-weight: 600;
  font-size: clamp(16px, 4vw, 22px);
  color: var(--white);
  flex: 1;
}
.step-eq .op {
  color: var(--red);
  font-size: .9em;
}
.step-eq .hl {
  color: var(--yellow);
}

/* ── INPUT AREA ── */
.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.input-eq-prefix {
  font-family: var(--fdisp);
  font-weight: 600;
  font-size: clamp(18px, 4vw, 24px);
  color: var(--white);
  white-space: nowrap;
}
.ans-input {
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: clamp(22px, 5vw, 30px);
  width: 110px;
  background: #1a1a1a;
  border: 2px solid #333;
  border-radius: 6px;
  color: var(--yellow);
  text-align: center;
  padding: 10px 8px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .2s;
}
.ans-input:focus { border-color: var(--yellow); }
.ans-input.wrong { border-color: var(--red); animation: shake .35s ease; }
.ans-input.right { border-color: #22dd88; color: #22dd88; }

@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

.check-btn {
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .06em;
  text-transform: uppercase;
  background: var(--yellow);
  color: #000;
  border: none;
  border-radius: 6px;
  padding: 12px 22px;
  cursor: pointer;
  min-height: 52px;
  transition: background .15s, transform .1s;
  white-space: nowrap;
}
.check-btn:hover { background: #ffe030; }
.check-btn:active { transform: scale(.97); }
.check-btn:disabled { opacity: .4; cursor: default; }

/* ── FEEDBACK ── */
.feedback {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.5;
  display: none;
}
.feedback.ok  { background: rgba(34,221,136,.1); color: #7affcc; border: 1px solid rgba(34,221,136,.25); display: block; }
.feedback.no  { background: rgba(224,48,48,.1);  color: #ffaaaa; border: 1px solid rgba(224,48,48,.25);  display: block; }
.feedback .fb-hint { color: rgba(255,255,255,.5); font-size: 12px; margin-top: 4px; }

/* ── INTERMEDIATE STEPS (shown after correct) ── */
.worked-steps {
  display: none;
  flex-direction: column;
  gap: 6px;
  margin-top: 14px;
}
.worked-steps.show { display: flex; }
.ws-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: rgba(245,208,0,.05);
  border-left: 3px solid var(--yellow);
  border-radius: 0 4px 4px 0;
}
.ws-op {
  font-size: 11px;
  font-family: var(--fdisp);
  color: var(--red);
  min-width: 70px;
  letter-spacing: .04em;
}
.ws-eq {
  font-family: var(--fdisp);
  font-weight: 600;
  font-size: clamp(14px, 3.5vw, 18px);
  color: var(--white);
}
.ws-eq .ans { color: var(--yellow); }

/* ── NEXT BTN ── */
.next-btn {
  display: none;
  width: 100%;
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .08em;
  text-transform: uppercase;
  background: transparent;
  color: var(--yellow);
  border: 2px solid var(--yellow);
  border-radius: 6px;
  padding: 16px;
  cursor: pointer;
  margin-top: 16px;
  transition: background .15s, color .15s;
}
.next-btn.show { display: block; }
.next-btn:hover { background: var(--yellow); color: #000; }

/* ── WRONG COUNTER ── */
.wrong-msg {
  font-size: 12px;
  color: var(--red);
  margin-top: 6px;
  display: none;
  font-family: var(--fdisp);
  letter-spacing: .04em;
}
.wrong-msg.show { display: block; }

/* ── SECTION TRANSITION ── */
.section-banner {
  display: none;
  background: var(--yellow);
  color: #000;
  border-radius: 8px;
  padding: 18px 20px;
  text-align: center;
  margin-bottom: 20px;
}
.section-banner.show { display: block; }
.section-banner h2 {
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: clamp(18px,5vw,26px);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.section-banner p { font-size: 13px; margin-top: 4px; opacity: .7; }

/* ── END SCREEN ── */
#endscreen {
  display: none;
  text-align: center;
  padding: 40px 20px;
}
#endscreen.show { display: block; }
.end-trophy { font-size: 64px; margin-bottom: 16px; }
.end-title {
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: clamp(24px,7vw,36px);
  color: var(--yellow);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 8px;
}
.end-sub { font-size: 16px; color: var(--muted); margin-bottom: 24px; }
.end-score {
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: clamp(48px,12vw,72px);
  color: var(--yellow);
  line-height: 1;
}
.end-score-label { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.restart-btn {
  font-family: var(--fdisp);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .08em;
  text-transform: uppercase;
  background: var(--yellow);
  color: #000;
  border: none;
  border-radius: 6px;
  padding: 16px 40px;
  cursor: pointer;
  transition: background .15s;
}
.restart-btn:hover { background: #ffe030; }

/* ── FRACTION DISPLAY ── */
.frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  line-height: 1.1;
  font-size: .85em;
}
.frac-top { border-bottom: 2px solid currentColor; padding: 0 3px; }
.frac-bot { padding: 0 3px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div class="top-title">⚖ Ligninger</div>
    <div class="top-counter" id="top-counter">1 / 55</div>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div id="game-area"></div>
  <div id="endscreen">
    <div class="end-trophy">🏆</div>
    <div class="end-title">Alle opgaver løst!</div>
    <div class="end-sub">Du har gennemført alle 55 ligningsopgaver.</div>
    <div class="end-score" id="end-score">55</div>
    <div class="end-score-label">opgaver klaret</div>
    <button class="restart-btn" onclick="restart()">Start forfra</button>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   OPGAVEDATA
   Hvert objekt har:
   - title:    ligningens viste tekst (HTML ok)
   - level:    niveautekst
   - steps:    array af mellemregningsskridt (vises EFTER korrekt svar)
   - inputs:   array af { prefix, answer, tolerance, placeholder }
                 → én input per svar (nogle opgaver har 2 trin)
   - hint:     tekst der vises ved forkert svar
   ═══════════════════════════════════════════════════════════════ */

const LEVELS = [
  { name:'Niveau 1 – Én operation', desc:'Isolér x med én enkel operation' },
  { name:'Niveau 2 – To operationer', desc:'Brug to trin til at isolere x' },
  { name:'Niveau 3 – Parentes', desc:'Løs op for parentes først' },
  { name:'Niveau 4 – x på begge sider', desc:'Saml x-led på én side' },
  { name:'Niveau 5 – Brøker', desc:'Multiplicér med nævner for at fjerne brøken' },
  { name:'Niveau 6 – Avanceret', desc:'Kombinerede teknikker' },
];

const problems = [

  // ═══════════════ NIVEAU 1: x + a = b ═══════════════
  {
    level:0, title:'x + 3 = 7',
    steps:[
      {op:'−3 på begge sider', eq:'x + 3 <span class="op">− 3</span> = 7 <span class="op">− 3</span>'},
      {op:'Forenkl', eq:'x = <span class="ans">4</span>'},
    ],
    inputs:[{prefix:'x =', answer:4, tol:0, ph:'?'}],
    hint:'Træk 3 fra på begge sider: 7 − 3 = ?',
  },
  {
    level:0, title:'x + 5 = 12',
    steps:[
      {op:'−5 på begge sider', eq:'x + 5 <span class="op">− 5</span> = 12 <span class="op">− 5</span>'},
      {op:'Svar', eq:'x = <span class="ans">7</span>'},
    ],
    inputs:[{prefix:'x =', answer:7, tol:0, ph:'?'}],
    hint:'12 − 5 = ?',
  },
  {
    level:0, title:'x − 4 = 9',
    steps:[
      {op:'+4 på begge sider', eq:'x − 4 <span class="op">+ 4</span> = 9 <span class="op">+ 4</span>'},
      {op:'Svar', eq:'x = <span class="ans">13</span>'},
    ],
    inputs:[{prefix:'x =', answer:13, tol:0, ph:'?'}],
    hint:'9 + 4 = ?',
  },
  {
    level:0, title:'x − 8 = 3',
    steps:[
      {op:'+8 på begge sider', eq:'x − 8 <span class="op">+ 8</span> = 3 <span class="op">+ 8</span>'},
      {op:'Svar', eq:'x = <span class="ans">11</span>'},
    ],
    inputs:[{prefix:'x =', answer:11, tol:0, ph:'?'}],
    hint:'3 + 8 = ?',
  },
  {
    level:0, title:'2x = 10',
    steps:[
      {op:'÷2 på begge sider', eq:'<span class="op">2x/2</span> = <span class="op">10/2</span>'},
      {op:'Svar', eq:'x = <span class="ans">5</span>'},
    ],
    inputs:[{prefix:'x =', answer:5, tol:0, ph:'?'}],
    hint:'10 ÷ 2 = ?',
  },
  {
    level:0, title:'3x = 18',
    steps:[
      {op:'÷3 på begge sider', eq:'x = 18 <span class="op">÷ 3</span>'},
      {op:'Svar', eq:'x = <span class="ans">6</span>'},
    ],
    inputs:[{prefix:'x =', answer:6, tol:0, ph:'?'}],
    hint:'18 ÷ 3 = ?',
  },
  {
    level:0, title:'5x = 35',
    steps:[
      {op:'÷5 på begge sider', eq:'x = 35 <span class="op">÷ 5</span>'},
      {op:'Svar', eq:'x = <span class="ans">7</span>'},
    ],
    inputs:[{prefix:'x =', answer:7, tol:0, ph:'?'}],
    hint:'35 ÷ 5 = ?',
  },
  {
    level:0, title:'x + 11 = 20',
    steps:[
      {op:'−11 på begge sider', eq:'x = 20 <span class="op">− 11</span>'},
      {op:'Svar', eq:'x = <span class="ans">9</span>'},
    ],
    inputs:[{prefix:'x =', answer:9, tol:0, ph:'?'}],
    hint:'20 − 11 = ?',
  },
  {
    level:0, title:'4x = 24',
    steps:[
      {op:'÷4 på begge sider', eq:'x = 24 <span class="op">÷ 4</span>'},
      {op:'Svar', eq:'x = <span class="ans">6</span>'},
    ],
    inputs:[{prefix:'x =', answer:6, tol:0, ph:'?'}],
    hint:'24 ÷ 4 = ?',
  },
  {
    level:0, title:'x − 7 = 14',
    steps:[
      {op:'+7 på begge sider', eq:'x = 14 <span class="op">+ 7</span>'},
      {op:'Svar', eq:'x = <span class="ans">21</span>'},
    ],
    inputs:[{prefix:'x =', answer:21, tol:0, ph:'?'}],
    hint:'14 + 7 = ?',
  },

  // ═══════════════ NIVEAU 2: ax + b = c ═══════════════
  {
    level:1, title:'2x + 4 = 10',
    steps:[
      {op:'−4 på begge sider', eq:'2x = 10 <span class="op">− 4</span> = 6'},
      {op:'÷2 på begge sider', eq:'x = 6 <span class="op">÷ 2</span>'},
      {op:'Svar', eq:'x = <span class="ans">3</span>'},
    ],
    inputs:[
      {prefix:'2x =', answer:6, tol:0, ph:'?', label:'Trin 1: træk 4 fra'},
      {prefix:'x =',  answer:3, tol:0, ph:'?', label:'Trin 2: divider med 2'},
    ],
    hint:'Trin 1: 10 − 4. Trin 2: del med 2.',
  },
  {
    level:1, title:'3x + 6 = 21',
    steps:[
      {op:'−6 på begge sider', eq:'3x = 21 <span class="op">− 6</span> = 15'},
      {op:'÷3 på begge sider', eq:'x = 15 <span class="op">÷ 3</span>'},
      {op:'Svar', eq:'x = <span class="ans">5</span>'},
    ],
    inputs:[
      {prefix:'3x =', answer:15, tol:0, ph:'?', label:'Trin 1: træk 6 fra'},
      {prefix:'x =',  answer:5,  tol:0, ph:'?', label:'Trin 2: divider med 3'},
    ],
    hint:'3x = 21 − 6 = 15, så x = 15 ÷ 3',
  },
  {
    level:1, title:'4x + 4 = 24',
    steps:[
      {op:'−4 på begge sider', eq:'4x = 24 <span class="op">− 4</span> = 20'},
      {op:'÷4 på begge sider', eq:'x = 20 <span class="op">÷ 4</span>'},
      {op:'Svar', eq:'x = <span class="ans">5</span>'},
    ],
    inputs:[
      {prefix:'4x =', answer:20, tol:0, ph:'?', label:'Trin 1: træk 4 fra'},
      {prefix:'x =',  answer:5,  tol:0, ph:'?', label:'Trin 2: divider med 4'},
    ],
    hint:'Som på billedet: 4x + 4 = 24 → 4x = 20 → x = 5',
  },
  {
    level:1, title:'5x − 3 = 17',
    steps:[
      {op:'+3 på begge sider', eq:'5x = 17 <span class="op">+ 3</span> = 20'},
      {op:'÷5 på begge sider', eq:'x = 20 <span class="op">÷ 5</span>'},
      {op:'Svar', eq:'x = <span class="ans">4</span>'},
    ],
    inputs:[
      {prefix:'5x =', answer:20, tol:0, ph:'?', label:'Trin 1: læg 3 til'},
      {prefix:'x =',  answer:4,  tol:0, ph:'?', label:'Trin 2: divider med 5'},
    ],
    hint:'5x = 17 + 3 = 20',
  },
  {
    level:1, title:'2x − 7 = 11',
    steps:[
      {op:'+7 på begge sider', eq:'2x = 11 <span class="op">+ 7</span> = 18'},
      {op:'÷2 på begge sider', eq:'x = 18 <span class="op">÷ 2</span>'},
      {op:'Svar', eq:'x = <span class="ans">9</span>'},
    ],
    inputs:[
      {prefix:'2x =', answer:18, tol:0, ph:'?', label:'Trin 1: læg 7 til'},
      {prefix:'x =',  answer:9,  tol:0, ph:'?', label:'Trin 2: divider med 2'},
    ],
    hint:'2x = 11 + 7 = 18',
  },
  {
    level:1, title:'6x + 2 = 38',
    steps:[
      {op:'−2 på begge sider', eq:'6x = 38 <span class="op">− 2</span> = 36'},
      {op:'÷6 på begge sider', eq:'x = 36 <span class="op">÷ 6</span>'},
      {op:'Svar', eq:'x = <span class="ans">6</span>'},
    ],
    inputs:[
      {prefix:'6x =', answer:36, tol:0, ph:'?', label:'Trin 1: træk 2 fra'},
      {prefix:'x =',  answer:6,  tol:0, ph:'?', label:'Trin 2: divider med 6'},
    ],
    hint:'6x = 36',
  },
  {
    level:1, title:'3x − 9 = 0',
    steps:[
      {op:'+9 på begge sider', eq:'3x = 0 <span class="op">+ 9</span> = 9'},
      {op:'÷3 på begge sider', eq:'x = 9 <span class="op">÷ 3</span>'},
      {op:'Svar', eq:'x = <span class="ans">3</span>'},
    ],
    inputs:[
      {prefix:'3x =', answer:9, tol:0, ph:'?', label:'Trin 1: læg 9 til'},
      {prefix:'x =',  answer:3, tol:0, ph:'?', label:'Trin 2: divider med 3'},
    ],
    hint:'3x = 9',
  },
  {
    level:1, title:'7x + 1 = 50',
    steps:[
      {op:'−1 på begge sider', eq:'7x = 49'},
      {op:'÷7 på begge sider', eq:'x = <span class="ans">7</span>'},
    ],
    inputs:[
      {prefix:'7x =', answer:49, tol:0, ph:'?', label:'Trin 1: træk 1 fra'},
      {prefix:'x =',  answer:7,  tol:0, ph:'?', label:'Trin 2: divider med 7'},
    ],
    hint:'7x = 49',
  },
  {
    level:1, title:'10x − 5 = 45',
    steps:[
      {op:'+5 på begge sider', eq:'10x = 50'},
      {op:'÷10 på begge sider', eq:'x = <span class="ans">5</span>'},
    ],
    inputs:[
      {prefix:'10x =', answer:50, tol:0, ph:'?', label:'Trin 1: læg 5 til'},
      {prefix:'x =',   answer:5,  tol:0, ph:'?', label:'Trin 2: divider med 10'},
    ],
    hint:'10x = 50',
  },
  {
    level:1, title:'4x + 8 = 40',
    steps:[
      {op:'−8 på begge sider', eq:'4x = 32'},
      {op:'÷4 på begge sider', eq:'x = <span class="ans">8</span>'},
    ],
    inputs:[
      {prefix:'4x =', answer:32, tol:0, ph:'?', label:'Trin 1: træk 8 fra'},
      {prefix:'x =',  answer:8,  tol:0, ph:'?', label:'Trin 2: divider med 4'},
    ],
    hint:'4x = 32',
  },

      {op:'Saml x-led venstre', eq:'5x − 8 = 4x + 1'},
      {op:'−4x på begge sider', eq:'x − 8 = 1'},
      {op:'+8 på begge sider', eq:'x = <span class="ans">9</span>'},
    ],
    inputs:[
      {prefix:'5x − 8 =', answer:4, tol:0, ph:'?(x+1)', label:'Trin 1: saml 3x+2x og udvid (hvad er faktoren foran x på højre side?)'},
      {prefix:'x − 8 =',  answer:1, tol:0, ph:'?',      label:'Trin 2: træk 4x fra begge sider'},
      {prefix:'x =',      answer:9, tol:0, ph:'?',       label:'Trin 3: læg 8 til'},
    ],
    hint:'3x + 2(x−4) = 3x + 2x − 8 = 5x − 8',
  },
];

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let current = 0;        // problem index
let stepPhase = 0;      // which input we're on (for multi-step)
let wrongCount = 0;
let prevLevel = -1;

/* ═══════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════ */
function render() {
  if (current >= problems.length) {
    document.getElementById('game-area').style.display = 'none';
    document.getElementById('endscreen').classList.add('show');
    document.getElementById('end-score').textContent = problems.length;
    return;
  }

  const p = problems[current];
  document.getElementById('top-counter').textContent = `${current + 1} / ${problems.length}`;
  document.getElementById('progress-fill').style.width = `${(current / problems.length) * 100}%`;

  const area = document.getElementById('game-area');
  const showLevelBanner = p.level !== prevLevel;
  prevLevel = p.level;

  // Build inputs HTML
  let inputsHTML = '';
  p.inputs.forEach((inp, i) => {
    const active = i === stepPhase;
    inputsHTML += `
      <div class="step" id="input-step-${i}" style="${i < stepPhase ? '' : i > stepPhase ? 'opacity:.35;pointer-events:none' : ''}">
        <div class="step-header">
          <div class="step-num">${i + 1}</div>
          <div class="step-instruction">${inp.label || 'Hvad er svaret?'}</div>
        </div>
        <div class="step-body">
          <div class="input-row">
            <div class="input-eq-prefix">${inp.prefix}</div>
            <input
              class="ans-input"
              id="input-${i}"
              type="number"
              step="any"
              placeholder="${inp.ph || '?'}"
              inputmode="decimal"
              ${active ? '' : 'disabled'}
              onkeydown="if(event.key==='Enter')checkStep(${i})"
              autocomplete="off"
            >
            <button class="check-btn" id="btn-${i}" onclick="checkStep(${i})" ${active ? '' : 'disabled'}>Tjek</button>
          </div>
          <div class="feedback" id="fb-${i}"></div>
          <div class="wrong-msg" id="wm-${i}"></div>
        </div>
      </div>`;
  });

  area.innerHTML = `
    ${showLevelBanner ? `
      <div class="section-banner show">
        <h2>${LEVELS[p.level].name}</h2>
        <p>${LEVELS[p.level].desc}</p>
      </div>` : ''}
    <div class="level-badge">
      ${LEVELS[p.level].name}
    </div>
    <div class="eq-display">
      <div class="eq-label">Løs ligningen – find x</div>
      <div class="eq-main">${p.title}</div>
    </div>

    <div class="steps-section">
      <div class="steps-title">Din udregning – trin for trin</div>
      <div class="step-list">${inputsHTML}</div>
    </div>

    <div class="worked-steps" id="worked-steps">
      ${p.steps.map(s => `
        <div class="ws-row">
          <div class="ws-op">${s.op}</div>
          <div class="ws-eq">${s.eq}</div>
        </div>`).join('')}
    </div>

    <button class="next-btn" id="next-btn" onclick="nextProblem()">
      Næste opgave →
    </button>
  `;

  stepPhase = 0;
  wrongCount = 0;

  // focus first input
  setTimeout(() => {
    const el = document.getElementById('input-0');
    if (el) el.focus();
  }, 100);
}

/* ═══════════════════════════════════════════
   CHECK STEP
   ═══════════════════════════════════════════ */
function checkStep(idx) {
  const p = problems[current];
  const inp = p.inputs[idx];
  const el = document.getElementById(`input-${idx}`);
  if (!el || el.disabled) return;

  const raw = el.value.replace(',', '.');
  const val = parseFloat(raw);
  const fb = document.getElementById(`fb-${idx}`);
  const wm = document.getElementById(`wm-${idx}`);

  if (isNaN(val)) {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
    return;
  }

  const diff = Math.abs(val - inp.answer);
  const tol  = inp.tol !== undefined ? inp.tol : 0.05;
  const correct = diff <= Math.max(tol, Math.abs(inp.answer) * 0.01 + 0.001);

  if (correct) {
    el.classList.remove('wrong');
    el.classList.add('right');
    el.disabled = true;
    document.getElementById(`btn-${idx}`).disabled = true;

    fb.className = 'feedback ok';
    fb.textContent = '✓ Rigtigt!';

    stepPhase = idx + 1;

    if (stepPhase < p.inputs.length) {
      // unlock next input
      const nextEl = document.getElementById(`input-${idx + 1}`);
      const nextStep = document.getElementById(`input-step-${idx + 1}`);
      const nextBtn = document.getElementById(`btn-${idx + 1}`);
      if (nextStep) nextStep.style.cssText = '';
      if (nextEl) { nextEl.disabled = false; setTimeout(() => nextEl.focus(), 100); }
      if (nextBtn) nextBtn.disabled = false;
    } else {
      // all steps correct — show full solution
      const ws = document.getElementById('worked-steps');
      if (ws) ws.classList.add('show');
      const nb = document.getElementById('next-btn');
      if (nb) nb.classList.add('show');
    }
  } else {
    wrongCount++;
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);

    fb.className = 'feedback no';
    fb.textContent = wrongCount >= 2
      ? `✗ Forkert. Hint: ${p.hint}`
      : '✗ Prøv igen — check dit regnestykke.';

    if (wrongCount >= 3) {
      wm.textContent = `Facit for dette trin: ${inp.answer}`;
      wm.classList.add('show');
    }
  }
}

function nextProblem() {
  current++;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  current = 0;
  stepPhase = 0;
  wrongCount = 0;
  prevLevel = -1;
  document.getElementById('game-area').style.display = '';
  document.getElementById('endscreen').classList.remove('show');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// INIT
render();
</script>
</body>
</html>
