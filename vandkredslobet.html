<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vandkredsløbet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #4cde80;
    --panel-bg: rgba(6, 20, 50, 0.95);
    --fh: 'Nunito', sans-serif;
    --fb: 'Nunito Sans', sans-serif;
    --f-xs:  clamp(10px, 2.2vw, 12px);
    --f-sm:  clamp(12px, 2.8vw, 14px);
    --f-md:  clamp(13px, 3.2vw, 16px);
    --f-lg:  clamp(16px, 4.5vw, 22px);
    --f-xl:  clamp(20px, 6vw,   32px);
  }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #061232;
    font-family: var(--fb);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #wc {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
  }
  #mapsvg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #hint {
    position: absolute;
    top: max(10px, env(safe-area-inset-top, 10px));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(6,20,50,0.82);
    color: #fff;
    font-family: var(--fh);
    font-weight: 700;
    font-size: var(--f-xs);
    padding: 5px 14px;
    border-radius: 30px;
    pointer-events: none;
    transition: opacity 0.8s;
    white-space: nowrap;
    z-index: 20;
    max-width: 90vw;
    text-align: center;
  }
  #progress-bar {
    position: absolute;
    top: max(10px, env(safe-area-inset-top, 10px));
    right: max(12px, env(safe-area-inset-right, 12px));
    display: flex;
    gap: 5px;
    align-items: center;
    z-index: 20;
  }
  .prog-dot {
    width: clamp(8px,2vw,11px);
    height: clamp(8px,2vw,11px);
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    border: 1.5px solid rgba(255,255,255,0.45);
    transition: background 0.3s, border-color 0.3s;
  }
  .prog-dot.done { background: var(--accent); border-color: var(--accent); }
  #panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--panel-bg);
    border-top: 1px solid rgba(255,255,255,0.13);
    border-radius: 18px 18px 0 0;
    padding: 14px 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
    transform: translateY(110%);
    transition: transform 0.38s cubic-bezier(.22,1,.36,1);
    z-index: 30;
    max-height: 65dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #panel.open { transform: translateY(0); }
  #panel::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    margin: 0 auto 12px;
  }
  .p-badge {
    display: inline-block;
    font-family: var(--fh); font-weight: 700;
    font-size: var(--f-xs); letter-spacing: .07em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    padding: 2px 9px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    margin-bottom: 5px;
  }
  .p-title {
    font-family: var(--fh); font-weight: 900;
    font-size: var(--f-lg); color: #fff;
    margin-bottom: 5px; line-height: 1.2;
  }
  .p-desc {
    font-size: var(--f-sm); color: rgba(255,255,255,0.8);
    line-height: 1.5; margin-bottom: 8px;
  }
  .p-fact {
    font-size: var(--f-xs); color: rgba(255,255,255,0.52);
    line-height: 1.5;
    padding: 7px 0;
    border-top: 1px solid rgba(255,255,255,0.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 10px;
  }
  .p-fact b { color: rgba(255,255,255,0.82); font-weight: 600; }
  .quiz-box {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 11px 12px;
    margin-bottom: 10px;
  }
  .quiz-q {
    font-family: var(--fh); font-weight: 700;
    font-size: var(--f-sm); color: #fff;
    margin-bottom: 9px; line-height: 1.4;
  }
  .quiz-opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .qbtn {
    font-family: var(--fh); font-weight: 700;
    font-size: var(--f-xs);
    background: rgba(255,255,255,0.09); color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 9px 6px;
    cursor: pointer; text-align: center;
    line-height: 1.3;
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.14s, transform 0.1s;
  }
  .qbtn:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
  .qbtn:active:not(:disabled) { transform: scale(0.95); }
  .qbtn.correct { background: rgba(50,200,100,0.28); border-color: rgba(50,200,100,0.65); }
  .qbtn.wrong   { background: rgba(220,60,60,0.28);  border-color: rgba(220,60,60,0.6); }
  .qbtn:disabled { cursor: default; }
  .quiz-fb {
    font-size: var(--f-xs);
    margin-top: 8px; padding: 8px 10px;
    border-radius: 8px; line-height: 1.45;
    display: none;
  }
  .quiz-fb.ok { background: rgba(50,200,100,0.16); color: #8affc0; }
  .quiz-fb.no { background: rgba(220,60,60,0.16);  color: #ffbebe; }
  .choices { display: none; flex-wrap: wrap; gap: 7px; }
  .choices.show { display: flex; }
  .cbtn {
    font-family: var(--fh); font-weight: 700;
    font-size: var(--f-sm);
    background: rgba(255,255,255,0.11); color: #fff;
    border: 1px solid rgba(255,255,255,0.26);
    border-radius: 9px; padding: 11px 12px;
    cursor: pointer; flex: 1; min-width: 120px;
    min-height: 44px; text-align: center;
    transition: background 0.14s, transform 0.1s;
  }
  .cbtn:hover { background: rgba(255,255,255,0.22); }
  .cbtn:active { transform: scale(0.96); }
  .stamp {
    position: absolute;
    width: clamp(16px,4vw,22px); height: clamp(16px,4vw,22px);
    border-radius: 50%;
    background: var(--accent); border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(9px,2.2vw,12px); font-weight: 700; color: #fff;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0);
    animation: stampIn 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
    z-index: 25;
  }
  @keyframes stampIn { to { transform: translate(-50%,-50%) scale(1); } }
  #endscreen {
    display: none; position: absolute; inset: 0;
    background: rgba(6,18,45,0.97);
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 28px 20px;
    padding-bottom: max(28px, env(safe-area-inset-bottom, 28px));
    z-index: 50; overflow-y: auto;
  }
  #endscreen.show { display: flex; }
  .end-emoji  { font-size: clamp(40px,10vw,64px); margin-bottom: 10px; }
  .end-title  { font-family: var(--fh); font-weight: 900; font-size: var(--f-xl); color: #fff; margin-bottom: 8px; }
  .end-sub    { font-size: var(--f-md); color: rgba(255,255,255,0.68); line-height: 1.55; margin-bottom: 16px; max-width: 380px; }
  .end-score  { font-family: var(--fh); font-weight: 900; font-size: clamp(48px,13vw,72px); color: var(--accent); line-height: 1; }
  .end-score-label { font-size: var(--f-xs); color: rgba(255,255,255,0.4); margin-bottom: 6px; }
  .end-stars  { font-size: clamp(26px,7vw,40px); margin: 4px 0 8px; }
  .end-msg    { font-size: var(--f-sm); color: rgba(255,255,255,0.58); max-width: 340px; line-height: 1.6; margin-bottom: 22px; }
  .restart-btn {
    font-family: var(--fh); font-weight: 900;
    font-size: var(--f-md);
    background: var(--accent); color: #061232;
    border: none; border-radius: 12px;
    padding: 14px 36px; cursor: pointer;
    min-height: 52px;
    transition: background 0.14s, transform 0.1s;
  }
  .restart-btn:hover  { background: #6fffa0; }
  .restart-btn:active { transform: scale(0.97); }
  @keyframes pulse { 0%,100%{opacity:.48} 50%{opacity:1} }
  .hs { animation: pulse 2.2s ease-in-out infinite; }
</style>
</head>

    desc:'Du lander på et blad og suges ned i jorden. Træets rødder drikker dig op! Du rejser op gennem stammen til bladene og slipper fri i luften igen.',
    fact:'<b>Transpiration:</b> planter suger vand op fra jorden og frigiver det som damp gennem porer i bladene. En stor bøg kan transpirere 400 liter om dagen!',
    quiz:{q:'Hvad hedder det når planter frigiver vanddamp gennem bladene?',opts:['Fordampning','Nedbør','Transpiration','Kondensation'],correct:2,fb:'Rigtigt! Transpiration er planternes måde at "svede" på. De suger vand op fra rødderne og frigiver det som damp.'},
    choices:[{label:'Stig fra bladene som damp',next:'cloud1'},{label:'Siv ned i undergrunden',next:'underground'}]},
  mountain:{x:120,y:247,hsId:'hs-mountain',badge:'Snesmelting',title:'Bjerget',
    desc:'Du falder som et snefnug og bliver en del af snemassen på bjergtoppen. Når foråret kommer, smelter solen dig, og du strømmer ned ad bjerget.',
    fact:'<b>Snesmelting:</b> bjerge opbevarer vand som sne hele vinteren. Smeltevandet om foråret forsyner floder og søer i måneder af gangen.',
    quiz:{q:'Hvad sker der med snemassen på bjerget om foråret?',opts:['Den fordamper direkte','Den smelter og løber ned i floder','Den bliver til grundvand','Den forbliver som is'],correct:1,fb:'Korrekt! Snesmeltning om foråret er afgørende for at fylde floder og søer op igen efter vinteren.'},
    choices:[{label:'Smelt og løb ned ad bjerget →',next:'river'}]},
  river:{x:400,y:342,hsId:'hs-river',badge:'Afstrømning',title:'Floden',
    desc:'Du strømmer hurtigt afsted i floden, tumler over sten og bliver hurtigere for hvert meter. Floden fører dig mod havet.',
    fact:'<b>Afstrømning:</b> floder samler vand fra regn, smeltevand og kilder og fører det ned ad bakke tilbage til havet.',
    quiz:{q:'Hvad driver vandets bevægelse ned ad floden mod havet?',opts:['Vinden','Tyngdekraften','Solen','Planterne'],correct:1,fb:'Rigtigt! Tyngdekraften trækker vandet nedad mod havet. Derfor løber floder altid fra høje steder til lave.'},
    choices:[{label:'Strøm ud til havet',next:'ocean'},{label:'Siv ned i undergrunden',next:'underground'}]},
  underground:{x:285,y:462,hsId:'hs-underground',badge:'Grundvand',title:'Undergrunden',
    desc:'Du er sivet ned gennem lag af jord og sten til en underjordisk vandreservoir. Det er mørkt, køligt og meget gammelt herinde.',
    fact:'<b>Grundvand:</b> vand fylder hulrum mellem sten og jord under overfladen. Dette vand kan være tusindvis af år gammelt og forsyner brønde og naturlige kilder.',
    quiz:{q:'Hvad kalder man vand der er gemt under jordens overflade i sten og jord?',opts:['Overfladevand','Grundvand','Regnvand','Havvand'],correct:1,fb:'Korrekt! Grundvand er vand der har sivet ned og samlet sig i hulrum i undergrunden — det pumper vi op fra brønde.'},
    choices:[{label:'Bobl op gennem en kilde →',next:'river'}]}
};

const ORDER=['ocean','cloud2','cloud1','forest','mountain','river','underground'];
let visited=new Set(),quizDone=new Set(),correctCount=0,animating=false;

const wc=document.getElementById('wc'),mapSvg=document.getElementById('mapsvg'),
      dropEl=document.getElementById('droplet'),panel=document.getElementById('panel'),
      hint=document.getElementById('hint'),endSc=document.getElementById('endscreen'),
      progBar=document.getElementById('progress-bar');

ORDER.forEach(k=>{const d=document.createElement('div');d.className='prog-dot';d.id='dot-'+k;progBar.appendChild(d);});

function setDroplet(x,y){dropEl.setAttribute('transform',`translate(${x},${y})`);}

function animateTo(x,y,cb){
  if(animating)return;animating=true;
  const cur=dropEl.getAttribute('transform')||'';
  const m=cur.match(/translate\(([^,]+),([^)]+)\)/);
  let sx=m?parseFloat(m[1]):x,sy=m?parseFloat(m[2]):y;
  const dx=x-sx,dy=y-sy,dist=Math.sqrt(dx*dx+dy*dy);
  const dur=Math.min(1900,Math.max(500,dist*3)),t0=performance.now();
  function step(now){
    const t=Math.min(1,(now-t0)/dur),ease=t<0.5?2*t*t:-1+(4-2*t)*t;
    setDroplet(sx+dx*ease,sy+dy*ease+Math.sin(t*Math.PI*4)*7*(1-t));
    if(t<1)requestAnimationFrame(step);
    else{setDroplet(x,y);animating=false;if(cb)cb();}
  }
  requestAnimationFrame(step);
}

function svgPct(svgX,svgY){
  const rect=mapSvg.getBoundingClientRect(),vbW=800,vbH=500;
  const scale=Math.max(rect.width/vbW,rect.height/vbH);
  const rendW=vbW*scale,rendH=vbH*scale;
  const offX=(rect.width-rendW)/2,offY=(rect.height-rendH)/2;
  return{left:(offX+svgX*scale)+'px',top:(offY+svgY*scale)+'px'};
}

function addStamp(key){
  const s=stages[key],pos=svgPct(s.x,s.y);
  const el=document.createElement('div');
  el.className='stamp';el.id='stamp-'+key;el.textContent='✓';
  el.style.left=pos.left;el.style.top=pos.top;
  wc.appendChild(el);
}
function markDot(key){const d=document.getElementById('dot-'+key);if(d)d.classList.add('done');}

function checkAllDone(){
  if(visited.size<ORDER.length)return;
  setTimeout(()=>{
    panel.classList.remove('open');
    const pct=Math.round((correctCount/ORDER.length)*100);
    document.getElementById('end-score').textContent=correctCount+'/'+ORDER.length;
    let stars,msg;
    if(pct===100){stars='⭐⭐⭐';msg='Perfekt resultat! Du svarede rigtigt på alle spørgsmål. Du er en sand vandekspert!';}
    else if(pct>=70){stars='⭐⭐';msg='Godt klaret! Du har lært meget om vandkredsløbet. Prøv igen for at slå din rekord!';}
    else{stars='⭐';msg='Godt forsøgt! Spil igen for at lære endnu mere om vandkredsløbet.';}
    document.getElementById('end-stars').textContent=stars;
    document.getElementById('end-msg').textContent=msg;
    endSc.classList.add('show');
  },700);
}

function showStage(key){
  const s=stages[key],isNew=!visited.has(key);
  if(isNew){visited.add(key);addStamp(key);markDot(key);}
  hint.style.opacity='0';
  const qDone=quizDone.has(key),q=s.quiz;
  const optsHTML=q.opts.map((o,i)=>`<button class="qbtn" id="qo${i}" onclick="answerQuiz('${key}',${i},${q.correct})">${o}</button>`).join('');
  const quizSection=qDone
    ?`<div class="quiz-box" style="opacity:.4"><div class="quiz-q" style="font-size:var(--f-xs)">✓ Quiz allerede besvaret ved dette stop</div></div>`
    :`<div class="quiz-box"><div class="quiz-q">🧠 ${q.q}</div><div class="quiz-opts">${optsHTML}</div><div class="quiz-fb" id="qfb"></div></div>`;
  const choicesHTML=s.choices.map(c=>`<button class="cbtn" onclick="goTo('${c.next}')">${c.label}</button>`).join('');
  panel.innerHTML=`<div class="p-badge">${s.badge}</div><div class="p-title">${s.title}</div><div class="p-desc">${s.desc}</div><div class="p-fact">${s.fact}</div>${quizSection}<div class="choices${qDone?' show':''}" id="choices-wrap">${choicesHTML}</div>`;
  panel.classList.add('open');
  panel.scrollTop=0;
}

function answerQuiz(key,chosen,correct){
  document.querySelectorAll('.qbtn').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');else if(i===chosen&&chosen!==correct)b.classList.add('wrong');});
  const fb=document.getElementById('qfb');
  if(chosen===correct){correctCount++;fb.className='quiz-fb ok';fb.textContent='✅ '+stages[key].quiz.fb;}
  else{fb.className='quiz-fb no';fb.textContent='❌ Ikke helt. '+stages[key].quiz.fb;}
  fb.style.display='block';quizDone.add(key);
  setTimeout(()=>{const cw=document.getElementById('choices-wrap');if(cw)cw.classList.add('show');checkAllDone();},900);
}

function goTo(key){
  panel.classList.remove('open');
  setTimeout(()=>animateTo(stages[key].x,stages[key].y,()=>showStage(key)),220);
}

function restartGame(){
  visited.clear();quizDone.clear();correctCount=0;
  document.querySelectorAll('.stamp').forEach(e=>e.remove());
  ORDER.forEach(k=>{const d=document.getElementById('dot-'+k);if(d)d.classList.remove('done');});
  endSc.classList.remove('show');panel.classList.remove('open');panel.innerHTML='';
  hint.style.opacity='1';setDroplet(660,376);
  setTimeout(()=>{animateTo(660,376,()=>showStage('ocean'));setTimeout(()=>{hint.style.opacity='0';},3500);},350);
}

Object.entries(stages).forEach(([key,s])=>{
  const el=document.getElementById(s.hsId);if(!el)return;
  const h=()=>{if(animating)return;panel.classList.remove('open');setTimeout(()=>animateTo(s.x,s.y,()=>showStage(key)),120);};
  el.addEventListener('click',h);
  el.addEventListener('touchend',e=>{e.preventDefault();h();},{passive:false});
});

window.addEventListener('resize',()=>{
  ORDER.forEach(k=>{
    const el=document.getElementById('stamp-'+k);
    if(!el||!visited.has(k))return;
    const pos=svgPct(stages[k].x,stages[k].y);
    el.style.left=pos.left;el.style.top=pos.top;
  });
});

setDroplet(660,376);
setTimeout(()=>{animateTo(660,376,()=>showStage('ocean'));setTimeout(()=>{hint.style.opacity='0';},3500);},700);
</script>
