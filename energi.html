<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Energiomregning – Fysiklaboratoriet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@700;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --kin:  #f59e0b;   /* amber  – kinetisk  */
  --pot:  #22d3ee;   /* cyan   – potentiel */
  --el:   #a78bfa;   /* violet – elektrisk */
  --fos:  #fb7185;   /* rose   – fossil    */
  --neu:  #34d399;   /* emerald – formler  */
  --bg:   #0a0f1e;
  --panel:rgba(6,10,24,0.97);
  --fmono:'Space Mono',monospace;
  --fhead:'Nunito',sans-serif;
  --fbody:'Nunito Sans',sans-serif;
  --f-xs:clamp(10px,2.2vw,12px);
  --f-sm:clamp(12px,2.8vw,14px);
  --f-md:clamp(13px,3.2vw,15px);
  --f-lg:clamp(15px,4vw,20px);
  --f-xl:clamp(20px,5.5vw,30px);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--fbody);-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#wc{position:relative;width:100dvw;height:100dvh;overflow:hidden;}
#mapsvg{position:absolute;inset:0;width:100%;height:100%;}

@keyframes pulse  {0%,100%{opacity:.4}50%{opacity:1}}
@keyframes float  {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spark  {0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
@keyframes stampIn{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes bolt   {0%,100%{opacity:.3}50%{opacity:1}}
.hs{animation:pulse 2.3s ease-in-out infinite;}
.fl{animation:float 3s ease-in-out infinite;}
.blt{animation:bolt 1.4s ease-in-out infinite;}

/* ── CHAR TOGGLE ── */
#char-toggle{position:absolute;top:max(10px,env(safe-area-inset-top,10px));left:max(10px,env(safe-area-inset-left,10px));z-index:25;display:flex;gap:5px;}
.ctbtn{font-family:var(--fmono);font-weight:700;font-size:clamp(9px,2vw,11px);background:rgba(6,10,24,0.88);color:rgba(255,255,255,0.5);border:1px solid rgba(167,139,250,0.25);border-radius:4px;padding:4px 10px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.ctbtn.active{background:rgba(167,139,250,0.15);color:var(--el);border-color:var(--el);}

/* ── HINT ── */
#hint{position:absolute;top:max(10px,env(safe-area-inset-top,10px));left:50%;transform:translateX(-50%);background:rgba(6,10,24,0.9);color:#fff;font-family:var(--fmono);font-size:var(--f-xs);padding:5px 14px;border-radius:3px;pointer-events:none;transition:opacity .8s;white-space:nowrap;z-index:20;max-width:90vw;text-align:center;border:1px solid rgba(167,139,250,0.2);}

/* ── PROGRESS ── */
#progress-bar{position:absolute;top:max(10px,env(safe-area-inset-top,10px));right:max(10px,env(safe-area-inset-right,10px));display:flex;gap:4px;align-items:center;z-index:20;}
.prog-dot{width:clamp(7px,1.8vw,10px);height:clamp(7px,1.8vw,10px);border-radius:50%;background:rgba(167,139,250,0.15);border:1.5px solid rgba(167,139,250,0.3);transition:background .3s,border-color .3s;}
.prog-dot.done{background:var(--el);border-color:var(--el);}

/* ── PANEL ── */
#panel{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid rgba(167,139,250,0.15);border-radius:14px 14px 0 0;padding:14px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom,16px));transform:translateY(110%);transition:transform .38s cubic-bezier(.22,1,.36,1);z-index:30;max-height:72dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#panel.open{transform:translateY(0);}
#panel::before{content:'';display:block;width:36px;height:3px;background:rgba(167,139,250,0.25);border-radius:2px;margin:0 auto 12px;}

.p-badge{display:inline-block;font-family:var(--fmono);font-weight:700;font-size:var(--f-xs);letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:3px;border-width:1px;border-style:solid;margin-bottom:5px;}
.p-title{font-family:var(--fmono);font-weight:700;font-size:var(--f-lg);color:#fff;margin-bottom:4px;line-height:1.2;}
.p-desc{font-size:var(--f-sm);color:rgba(255,255,255,0.75);line-height:1.55;margin-bottom:8px;}

/* FORMULA DISPLAY BOX */
.formula-card{border-radius:8px;padding:10px 14px;margin-bottom:10px;border-width:1px;border-style:solid;}
.formula-card .f-label{font-family:var(--fmono);font-size:var(--f-xs);letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-bottom:5px;}
.formula-main{font-family:var(--fmono);font-weight:700;font-size:clamp(13px,3.5vw,18px);color:#fff;line-height:1.5;}
.formula-vars{font-size:var(--f-xs);color:rgba(255,255,255,0.5);line-height:1.6;margin-top:5px;font-family:var(--fbody);}
.formula-vars span{color:rgba(255,255,255,0.75);}

/* QUESTION TYPES */
.q-progress{font-family:var(--fmono);font-size:var(--f-xs);color:rgba(167,139,250,0.45);margin-bottom:6px;letter-spacing:.04em;}
.quiz-box{background:rgba(255,255,255,0.04);border:1px solid rgba(167,139,250,0.12);border-radius:10px;padding:11px 12px;margin-bottom:10px;}
.quiz-q{font-family:var(--fbody);font-weight:700;font-size:var(--f-sm);color:#fff;margin-bottom:9px;line-height:1.45;}
.quiz-type-label{font-family:var(--fmono);font-size:var(--f-xs);color:rgba(167,139,250,0.55);margin-bottom:7px;letter-spacing:.04em;}

/* Multiple choice */
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.qbtn{font-family:var(--fmono);font-weight:700;font-size:var(--f-xs);background:rgba(167,139,250,0.07);color:rgba(255,255,255,0.85);border:1px solid rgba(167,139,250,0.18);border-radius:6px;padding:9px 6px;cursor:pointer;text-align:center;line-height:1.4;min-height:44px;display:flex;align-items:center;justify-content:center;transition:background .14s,transform .1s;}
.qbtn:hover:not(:disabled){background:rgba(167,139,250,0.18);}
.qbtn:active:not(:disabled){transform:scale(0.95);}
.qbtn.correct{background:rgba(52,211,153,0.22);border-color:rgba(52,211,153,0.65);}
.qbtn.wrong  {background:rgba(220,60,60,0.2); border-color:rgba(220,60,60,0.6);}
.qbtn:disabled{cursor:default;}

/* Open numeric answer */
.open-answer-wrap{display:flex;gap:8px;align-items:stretch;margin-top:2px;}
.open-input{font-family:var(--fmono);font-weight:700;font-size:var(--f-md);background:rgba(167,139,250,0.07);color:#fff;border:1px solid rgba(167,139,250,0.3);border-radius:6px;padding:10px 12px;flex:1;min-height:44px;outline:none;-webkit-appearance:none;appearance:none;}
.open-input:focus{border-color:rgba(167,139,250,0.7);background:rgba(167,139,250,0.12);}
.open-input::placeholder{color:rgba(255,255,255,0.25);}
.open-unit{font-family:var(--fmono);font-size:var(--f-sm);color:rgba(167,139,250,0.8);background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.2);border-radius:6px;padding:10px 10px;display:flex;align-items:center;white-space:nowrap;}
.submit-btn{font-family:var(--fmono);font-weight:700;font-size:var(--f-sm);background:rgba(167,139,250,0.18);color:#fff;border:1px solid rgba(167,139,250,0.35);border-radius:6px;padding:10px 14px;cursor:pointer;min-height:44px;transition:background .14s,transform .1s;white-space:nowrap;}
.submit-btn:hover{background:rgba(167,139,250,0.3);}
.submit-btn:active{transform:scale(0.96);}

/* Formula rearrange (single MC) */
.rearrange-opts{display:flex;flex-direction:column;gap:6px;}
.rearrange-opts .qbtn{font-size:clamp(10px,2.5vw,13px);text-align:left;justify-content:flex-start;padding:9px 12px;}

/* Feedback */
.quiz-fb{font-size:var(--f-xs);margin-top:8px;padding:8px 10px;border-radius:6px;line-height:1.5;display:none;font-family:var(--fbody);}
.quiz-fb.ok{background:rgba(52,211,153,0.13);color:#7affcc;}
.quiz-fb.no{background:rgba(220,60,60,0.12);color:#ffbebe;}
.quiz-fb.close{background:rgba(245,158,11,0.12);color:#ffd580;}

/* Step-by-step hint */
.step-hint{font-family:var(--fmono);font-size:var(--f-xs);color:rgba(255,255,255,0.38);margin-top:6px;line-height:1.6;padding:6px 8px;border-left:2px solid rgba(167,139,250,0.3);}

.choices{display:none;flex-wrap:wrap;gap:7px;}
.choices.show{display:flex;}
.cbtn{font-family:var(--fmono);font-weight:700;font-size:var(--f-sm);background:rgba(167,139,250,0.09);color:#fff;border:1px solid rgba(167,139,250,0.25);border-radius:7px;padding:11px 12px;cursor:pointer;flex:1;min-width:120px;min-height:44px;text-align:center;transition:background .14s,transform .1s;}
.cbtn:hover{background:rgba(167,139,250,0.2);}
.cbtn:active{transform:scale(0.96);}

.stamp{position:absolute;width:clamp(14px,3.5vw,20px);height:clamp(14px,3.5vw,20px);border-radius:50%;background:var(--el);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,2vw,11px);font-weight:700;color:#0a0f1e;pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:stampIn .4s cubic-bezier(.34,1.56,.64,1) forwards;z-index:25;}

/* SCORE BAR */
#score-bar{position:absolute;bottom:max(8px,env(safe-area-inset-bottom,8px));left:50%;transform:translateX(-50%);font-family:var(--fmono);font-size:var(--f-xs);color:rgba(167,139,250,0.6);z-index:20;pointer-events:none;white-space:nowrap;}
#score-bar.hidden{display:none;}

/* END */
#endscreen{display:none;position:absolute;inset:0;background:rgba(6,10,24,0.97);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;padding-bottom:max(28px,env(safe-area-inset-bottom,28px));z-index:50;overflow-y:auto;}
#endscreen.show{display:flex;}
.end-emoji{font-size:clamp(36px,9vw,56px);margin-bottom:10px;}
.end-title{font-family:var(--fmono);font-weight:700;font-size:var(--f-xl);color:var(--el);margin-bottom:8px;}
.end-sub{font-size:var(--f-md);color:rgba(255,255,255,0.6);line-height:1.55;margin-bottom:14px;max-width:380px;}
.end-score{font-family:var(--fmono);font-weight:700;font-size:clamp(44px,12vw,68px);color:var(--el);line-height:1;}
.end-score-label{font-size:var(--f-xs);color:rgba(167,139,250,0.4);margin-bottom:6px;font-family:var(--fmono);}
.end-stars{font-size:clamp(24px,6vw,36px);margin:4px 0 8px;}
.end-msg{font-size:var(--f-sm);color:rgba(255,255,255,0.5);max-width:340px;line-height:1.6;margin-bottom:22px;}
.restart-btn{font-family:var(--fmono);font-weight:700;font-size:var(--f-md);background:var(--el);color:#0a0f1e;border:none;border-radius:6px;padding:14px 36px;cursor:pointer;min-height:52px;transition:background .14s,transform .1s;}
.restart-btn:hover{background:#c4b5fd;}
.restart-btn:active{transform:scale(0.97);}
</style>
</head>
<body>
<div id="wc">

<!-- ══════════════════════════════════════
     PHYSICS LAB MAP SVG
     ══════════════════════════════════════ -->
<svg id="mapsvg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="kinGlow"  cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="potGlow"  cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="elGlow"   cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="fosGlow"  cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fb7185" stop-opacity=".2"/><stop offset="100%" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <radialGradient id="wattGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#34d399" stop-opacity=".2"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- ROOM -->
  <rect x="0" y="0" width="800" height="500" fill="#0a0f1e"/>
  <!-- ceiling grid -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="#0f1428" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="60" fill="#0c1020"/>
  <!-- fluorescent lights -->
  <rect x="60"  y="2"  width="120" height="6" rx="2" fill="#c4b5fd" opacity=".14"/>
  <rect x="280" y="2"  width="130" height="6" rx="2" fill="#c4b5fd" opacity=".14"/>
  <rect x="520" y="2"  width="130" height="6" rx="2" fill="#c4b5fd" opacity=".14"/>
  <!-- light cone falloff -->
  <ellipse cx="120" cy="280" rx="160" ry="60" fill="#a78bfa" opacity=".025"/>
  <ellipse cx="345" cy="280" rx="160" ry="60" fill="#a78bfa" opacity=".025"/>
  <ellipse cx="585" cy="280" rx="160" ry="60" fill="#a78bfa" opacity=".025"/>

  <!-- BACK WALL -->
  <rect x="0" y="60" width="800" height="230" fill="#0d1222"/>
  <!-- wall grid -->
  <line x1="0"   y1="130" x2="800" y2="130" stroke="#111828" stroke-width="1"/>
  <line x1="0"   y1="200" x2="800" y2="200" stroke="#111828" stroke-width="1"/>
  <line x1="0"   y1="270" x2="800" y2="270" stroke="#111828" stroke-width="1"/>
  <line x1="160" y1="60"  x2="160" y2="290" stroke="#111828" stroke-width="1"/>
  <line x1="320" y1="60"  x2="320" y2="290" stroke="#111828" stroke-width="1"/>
  <line x1="480" y1="60"  x2="480" y2="290" stroke="#111828" stroke-width="1"/>
  <line x1="640" y1="60"  x2="640" y2="290" stroke="#111828" stroke-width="1"/>

  <!-- ENERGY FORMULA BLACKBOARD on back wall -->
  <rect x="230" y="68" width="340" height="155" rx="4" fill="#0a1a12" stroke="#1a3a22" stroke-width="1.5"/>
  <text x="400" y="87" text-anchor="middle" font-family="Space Mono,monospace" font-size="9" fill="rgba(52,211,153,0.5)" letter-spacing=".08em">ENERGI FORMLER</text>
  <text x="248" y="106" font-family="Space Mono,monospace" font-size="10" fill="rgba(245,158,11,0.8)">Eₖ = ½mv²</text>
  <text x="248" y="122" font-family="Space Mono,monospace" font-size="10" fill="rgba(34,211,238,0.8)">Eₚ = mgh</text>
  <text x="248" y="138" font-family="Space Mono,monospace" font-size="10" fill="rgba(167,139,250,0.8)">P = U·I</text>
  <text x="248" y="154" font-family="Space Mono,monospace" font-size="10" fill="rgba(167,139,250,0.8)">E = P·t</text>
  <text x="248" y="170" font-family="Space Mono,monospace" font-size="10" fill="rgba(251,113,133,0.8)">η = E_nyttig/E_total</text>
  <text x="248" y="186" font-family="Space Mono,monospace" font-size="10" fill="rgba(167,139,250,0.8)">U = R·I   (ohm)</text>
  <text x="248" y="202" font-family="Space Mono,monospace" font-size="10" fill="rgba(52,211,153,0.8)">1 kWh = 3 600 000 J</text>

  <!-- SHELVES / equipment top left -->
  <rect x="10" y="78" width="190" height="6" rx="1" fill="#1a2030"/>
  <rect x="10" y="148" width="190" height="6" rx="1" fill="#1a2030"/>
  <!-- oscilloscope -->
  <rect x="18" y="62" width="52" height="38" rx="2" fill="#0f1428" stroke="#2a3050" stroke-width="1"/>
  <rect x="22" y="66" width="44" height="28" rx="1" fill="#050d18"/>
  <!-- sine wave on oscilloscope -->
  <path d="M24 82 Q30 72 36 82 Q42 92 48 82 Q54 72 60 82" fill="none" stroke="#a78bfa" stroke-width="1.2" opacity=".7"/>
  <text x="44" y="99" text-anchor="middle" font-family="Space Mono,monospace" font-size="7" fill="rgba(167,139,250,0.5)">OSC</text>
  <!-- multimeter -->
  <rect x="78" y="65" width="38" height="34" rx="2" fill="#12180a" stroke="#283018" stroke-width="1"/>
  <rect x="82" y="69" width="30" height="14" rx="1" fill="#081008"/>
  <text x="97" y="79" text-anchor="middle" font-family="Space Mono,monospace" font-size="8" fill="#34d399" opacity=".8">3.7V</text>
  <text x="97" y="97" text-anchor="middle" font-family="Space Mono,monospace" font-size="7" fill="rgba(52,211,153,0.4)">METER</text>
  <!-- wires -->
  <path d="M28 100 Q28 118 50 118" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity=".5"/>
  <path d="M150 100 Q150 118 130 118" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity=".5"/>

  <!-- EQUIPMENT far right shelf -->
  <rect x="600" y="78"  width="185" height="6" rx="1" fill="#1a2030"/>
  <rect x="600" y="148" width="185" height="6" rx="1" fill="#1a2030"/>
  <!-- power supply -->
  <rect x="608" y="62" width="60" height="40" rx="2" fill="#12100a" stroke="#302818" stroke-width="1"/>
  <rect x="612" y="66" width="52" height="20" rx="1" fill="#060402"/>
  <text x="638" y="79" text-anchor="middle" font-family="Space Mono,monospace" font-size="9" fill="#f59e0b" opacity=".85">12.0 V</text>
  <circle cx="618" cy="96" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity=".6"/>
  <circle cx="658" cy="96" r="4" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".6"/>
  <text x="638" y="102" text-anchor="middle" font-family="Space Mono,monospace" font-size="7" fill="rgba(245,158,11,0.4)">SUPPLY</text>

  <!-- BENCH -->
  <rect x="0"   y="288" width="800" height="20" fill="#141c28"/>
  <rect x="0"   y="306" width="800" height="5"  fill="#0f1520"/>
  <rect x="0"   y="288" width="800" height="3"  fill="#1e2a3c" opacity=".8"/>

  <!-- FLOOR -->
  <rect x="0" y="311" width="800" height="189" fill="#0d111e"/>
  <line x1="0"   y1="380" x2="800" y2="380" stroke="#111520" stroke-width="1.5"/>
  <line x1="0"   y1="450" x2="800" y2="450" stroke="#111520" stroke-width="1.5"/>
  <line x1="100" y1="311" x2="100" y2="500" stroke="#111520" stroke-width="1.5"/>
  <line x1="200" y1="311" x2="200" y2="500" stroke="#111520" stroke-width="1.5"/>
  <line x1="300" y1="311" x2="300" y2="500" stroke="#111520" stroke-width="1.5"/>
  <line x1="400" y1="311" x2="400" y2="500" stroke="#111520" stroke-width="1.5"/>
  <line x1="500" y1="311" x2="500" y2="500" stroke="#111520" stroke-width="1.5"/>
  <line x1="600" y1="311" x2="600" y2="500" stroke="#111520" stroke-width="1.5"/>
  <line x1="700" y1="311" x2="700" y2="500" stroke="#111520" stroke-width="1.5"/>

  <!-- TRAIL -->
  <g id="trail"></g>

  <!-- ══ STATION APPARATUS ══ -->

  <!-- STATION 1: Kinetisk energi (bil/bold på bane) -->
  <circle cx="80" cy="248" r="50" fill="url(#kinGlow)"/>
  <!-- track -->
  <line x1="30" y1="272" x2="135" y2="272" stroke="#f59e0b" stroke-width="1.5" opacity=".3"/>
  <!-- car body -->
  <rect x="50" y="255" width="50" height="20" rx="4" fill="#1a1400" stroke="#f59e0b" stroke-width="1.5" opacity=".8"/>
  <rect x="58" y="251" width="30" height="10" rx="3" fill="#f59e0b" opacity=".25"/>
  <!-- wheels -->
  <circle cx="62" cy="275" r="6" fill="#0a0f1e" stroke="#f59e0b" stroke-width="1.5" opacity=".8"/>
  <circle cx="88" cy="275" r="6" fill="#0a0f1e" stroke="#f59e0b" stroke-width="1.5" opacity=".8"/>
  <!-- speed arrow -->
  <path d="M100 260 L116 260" fill="none" stroke="#f59e0b" stroke-width="2" opacity=".7" marker-end="url(#arrowAmb)"/>
  <!-- Ek label -->
  <text x="80" y="238" text-anchor="middle" font-family="Space Mono,monospace" font-size="11" font-weight="700" fill="#f59e0b" opacity=".9">Eₖ = ½mv²</text>

  <!-- STATION 2: Potentiel energi (bold på rampe) -->

const ORDER = ['kin','pot','el','fos','watt'];
const TOTAL_Q = ORDER.length * 10; // 50

/* ══ STATE ══ */
let visited=new Set(), qIndex={}, qCorrect={}, correctTotal=0, totalAnswered=0, animating=false;
let charMode='el', posX=80, posY=248, trailPoints=[];
ORDER.forEach(k=>{qIndex[k]=0; qCorrect[k]=0;});

/* ══ ELEMENTS ══ */
const wc=document.getElementById('wc'), mapSvg=document.getElementById('mapsvg');
const elEl=document.getElementById('char-el'), robEl=document.getElementById('char-robot');
const elFlame=document.getElementById('el-flame'), robFlame=document.getElementById('rob-flame');
const panel=document.getElementById('panel'), hint=document.getElementById('hint');
const endSc=document.getElementById('endscreen'), progBar=document.getElementById('progress-bar');
const trailG=document.getElementById('trail'), scoreBar=document.getElementById('score-bar');

ORDER.forEach(k=>{
  const d=document.createElement('div'); d.className='prog-dot'; d.id='dot-'+k; progBar.appendChild(d);
});

function updateScoreBar(){
  scoreBar.textContent=`Score: ${correctTotal} / ${totalAnswered}`;
}

/* ══ CHARACTER ══ */
function setChar(mode){
  charMode=mode;
  document.getElementById('btn-el').classList.toggle('active',mode==='el');
  document.getElementById('btn-rob').classList.toggle('active',mode==='robot');
  elEl.style.display=mode==='el'?'':'none';
  robEl.style.display=mode==='robot'?'':'none';
  applyCharTransform(posX,posY,0);
}
function applyCharTransform(x,y,angle){
  const s=0.5;
  const el=charMode==='el'?elEl:robEl;
  el.setAttribute('transform',`translate(${x},${y}) rotate(${angle}) scale(${s})`);
}

/* ══ TRAIL ══ */
function addTrailPoint(x,y){trailPoints.push({x,y});if(trailPoints.length>70)trailPoints.shift();redrawTrail();}
function redrawTrail(){
  trailG.innerHTML='';const total=trailPoints.length;
  for(let i=1;i<total;i++){
    const frac=i/total;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',trailPoints[i-1].x);line.setAttribute('y1',trailPoints[i-1].y);
    line.setAttribute('x2',trailPoints[i].x);  line.setAttribute('y2',trailPoints[i].y);
    line.setAttribute('stroke','#a78bfa');
    line.setAttribute('stroke-width',frac*2);
    line.setAttribute('opacity',frac*0.4);
    line.setAttribute('stroke-linecap','round');
    trailG.appendChild(line);
  }
}
function clearTrail(){trailPoints=[];trailG.innerHTML='';}

/* ══ ANIMATE ══ */
function animateTo(tx,ty,cb){
  if(animating)return;animating=true;
  const sx=posX,sy=posY,dx=tx-sx,dy=ty-sy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const dur=Math.min(2000,Math.max(600,dist*4));
  const t0=performance.now();let lastT=0;
  const fEl=charMode==='el'?elFlame:robFlame;
  if(fEl)fEl.style.display='';
  function step(now){
    const t=Math.min(1,(now-t0)/dur);
    const ease=t<.5?2*t*t:-1+(4-2*t)*t;
    const arc=Math.sin(t*Math.PI)*Math.min(dist*.12,30);
    const len=Math.sqrt(dx*dx+dy*dy)||1;
    const cx=sx+dx*ease+(-dy/len)*arc*(1-Math.abs(ease*2-1));
    const cy=sy+dy*ease+(dx/len)*arc*(1-Math.abs(ease*2-1));
    posX=cx;posY=cy;
    const prev=Math.max(0,ease-.02);
    const vx=cx-(sx+dx*prev),vy=cy-(sy+dy*prev);
    applyCharTransform(cx,cy,Math.atan2(vy,vx)*180/Math.PI+90);
    if(now-lastT>30){addTrailPoint(cx,cy);lastT=now;}
    if(t<1)requestAnimationFrame(step);
    else{posX=tx;posY=ty;applyCharTransform(tx,ty,0);animating=false;if(fEl)fEl.style.display='none';if(cb)cb();}
  }
  requestAnimationFrame(step);
}

/* ══ SVG → CSS ══ */
function svgPct(sx,sy){
  const rect=mapSvg.getBoundingClientRect();
  const sc=Math.max(rect.width/800,rect.height/500);
  const ox=(rect.width-800*sc)/2,oy=(rect.height-500*sc)/2;
  return{left:(ox+sx*sc)+'px',top:(oy+sy*sc)+'px'};
}
function addStamp(key){
  const s=stages[key],pos=svgPct(s.x,s.y);
  const el=document.createElement('div');
  el.className='stamp';el.id='stamp-'+key;el.textContent='✓';
  el.style.left=pos.left;el.style.top=pos.top;wc.appendChild(el);
}
function markDot(key){const d=document.getElementById('dot-'+key);if(d)d.classList.add('done');}

/* ══ WIN CHECK ══ */
function checkAllDone(){
  if(visited.size<ORDER.length||!ORDER.every(k=>qIndex[k]>=10))return;
  setTimeout(()=>{
    panel.classList.remove('open');
    const pct=Math.round(correctTotal/TOTAL_Q*100);
    document.getElementById('end-score').textContent=correctTotal+'/'+TOTAL_Q;
    let stars,msg;
    if(pct>=90)     {stars='⭐⭐⭐';msg='Fremragende! Du behersker energiomregningerne på højt niveau.';}
    else if(pct>=65){stars='⭐⭐'; msg='Godt klaret! Du har styr på de fleste formler. Prøv igen for at forbedre scoren.';}
    else            {stars='⭐';   msg='God indsats! Gennemgå formlerne og prøv igen.';}
    document.getElementById('end-stars').textContent=stars;
    document.getElementById('end-msg').textContent=msg;
    endSc.classList.add('show');
  },700);
}

/* ══ RENDER QUESTION ══ */
function renderQuestion(key){
  const s=stages[key];
  const qi=qIndex[key];
  if(qi>=10) return `<div class="quiz-box" style="opacity:.4"><div class="quiz-q">✓ Alle 10 spørgsmål ved denne station besvaret — ${qCorrect[key]}/10 rigtige</div></div>`;

  const q=s.questions[qi];
  const num=qi+1;

  if(q.type==='open'){
    return `
      <div class="q-progress">Spørgsmål ${num}/10 · Beregning</div>
      <div class="quiz-box">
        <div class="quiz-type-label">📐 ÅBENT SVAR — beregn og indtast</div>
        <div class="quiz-q">${q.q}</div>
        ${q.hint?`<div class="step-hint">Hint: ${q.hint}</div>`:''}
        <div class="open-answer-wrap">
          <input class="open-input" id="open-inp" type="number" step="any" placeholder="Dit svar…" onkeydown="if(event.key==='Enter')submitOpen('${key}')">
          <div class="open-unit">${q.unit}</div>
          <button class="submit-btn" onclick="submitOpen('${key}')">Tjek ✓</button>
        </div>
        <div class="quiz-fb" id="qfb"></div>
      </div>`;
  }

  if(q.type==='rearr'){
    const optsHTML=q.opts.map((o,i)=>`<button class="qbtn" id="qo${i}" onclick="answerMC('${key}',${i},${q.c})">${o}</button>`).join('');
    return `
      <div class="q-progress">Spørgsmål ${num}/10 · Formelomformning</div>
      <div class="quiz-box">
        <div class="quiz-type-label">🔄 OMFORML FORMLEN — vælg det rigtige udtryk</div>
        <div class="quiz-q">${q.q}</div>
        <div class="rearrange-opts">${optsHTML}</div>
        <div class="quiz-fb" id="qfb"></div>
      </div>`;
  }

  // mc
  const optsHTML=q.opts.map((o,i)=>`<button class="qbtn" id="qo${i}" onclick="answerMC('${key}',${i},${q.c})">${o}</button>`).join('');
  return `
    <div class="q-progress">Spørgsmål ${num}/10 · Multiple choice</div>
    <div class="quiz-box">
      <div class="quiz-type-label">💡 VÆLG DET RIGTIGE SVAR</div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">${optsHTML}</div>
      <div class="quiz-fb" id="qfb"></div>
    </div>`;
}

/* ══ SHOW STAGE ══ */
function showStage(key){
  const s=stages[key];
  const isNew=!visited.has(key);
  if(isNew){visited.add(key);addStamp(key);markDot(key);}
  hint.style.opacity='0';
  scoreBar.classList.remove('hidden');

  const allDone=qIndex[key]>=10;
  const choicesHTML=s.choices.map(c=>`<button class="cbtn" onclick="goTo('${c.next}')">${c.label}</button>`).join('');

  const badgeStyle=`background:rgba(${s.colorRgb},0.1);color:${s.colorHex};border-color:rgba(${s.colorRgb},0.3);`;
  const cardStyle=`background:rgba(${s.colorRgb},0.07);border-color:rgba(${s.colorRgb},0.25);`;
  const varStyle=`color:rgba(${s.colorRgb},0.75);`;

  panel.innerHTML=`
    <div class="p-badge" style="${badgeStyle}">${s.badge}</div>
    <div class="p-title">${s.title}</div>
    <div class="formula-card" style="${cardStyle}">
      <div class="f-label" style="${varStyle}">Formel</div>
      <div class="formula-main">${s.formula.main}</div>
      <div class="formula-vars" style="${varStyle}">${s.formula.vars}</div>
    </div>
    <div class="p-desc">${s.desc}</div>
    ${renderQuestion(key)}
    <div class="choices${allDone?' show':''}" id="choices-wrap">${choicesHTML}</div>
  `;
  panel.classList.add('open');
  panel.scrollTop=0;
  if(!allDone) setTimeout(()=>{ const inp=document.getElementById('open-inp'); if(inp){ inp.focus(); }},200);
}

/* ══ SUBMIT OPEN ANSWER ══ */
function submitOpen(key){
  const inp=document.getElementById('open-inp');
  if(!inp)return;
  // accept comma or dot
  const raw=inp.value.replace(',','.');
  const val=parseFloat(raw);
  if(isNaN(val)){inp.style.borderColor='rgba(220,60,60,0.6)';return;}
  inp.disabled=true;
  document.querySelector('.submit-btn').disabled=true;

  const q=stages[key].questions[qIndex[key]];
  const fb=document.getElementById('qfb');
  const diff=Math.abs(val-q.answer);
  const relErr=Math.abs(diff/q.answer);

  if(diff<=q.tol || relErr<0.02){
    correctTotal++;qCorrect[key]++;
    fb.className='quiz-fb ok'; fb.textContent=`✅ Korrekt! ${q.fb}`;
    inp.style.borderColor='rgba(52,211,153,0.6)';
  } else if(relErr<0.10){
    fb.className='quiz-fb close'; fb.textContent=`🔶 Tæt på! Dit svar: ${val} — Facit: ${q.answer}. ${q.fb}`;
    inp.style.borderColor='rgba(245,158,11,0.6)';
  } else {
    fb.className='quiz-fb no'; fb.textContent=`❌ Forkert. Facit: ${q.answer} ${q.unit}. ${q.fb}`;
    inp.style.borderColor='rgba(220,60,60,0.5)';
  }
  fb.style.display='block';
  totalAnswered++; qIndex[key]++;
  updateScoreBar();
  setTimeout(()=>{
    const cw=document.getElementById('choices-wrap');
    if(cw)cw.classList.add('show');
    checkAllDone();
    // refresh question (show next) after short pause if not all done
    if(qIndex[key]<10) setTimeout(()=>refreshQuestion(key),1200);
  },1000);
}

/* ══ ANSWER MC / REARR ══ */
function answerMC(key,chosen,correct){
  document.querySelectorAll('.qbtn').forEach((b,i)=>{
    b.disabled=true;
    if(i===correct)b.classList.add('correct');
    else if(i===chosen&&chosen!==correct)b.classList.add('wrong');
  });
  const fb=document.getElementById('qfb');
  const q=stages[key].questions[qIndex[key]];
  if(chosen===correct){correctTotal++;qCorrect[key]++;fb.className='quiz-fb ok';fb.textContent='✅ '+q.fb;}
  else{fb.className='quiz-fb no';fb.textContent='❌ Ikke helt. '+q.fb;}
  fb.style.display='block';
  totalAnswered++; qIndex[key]++;
  updateScoreBar();
  setTimeout(()=>{
    const cw=document.getElementById('choices-wrap');
    if(cw)cw.classList.add('show');
    checkAllDone();
    if(qIndex[key]<10) setTimeout(()=>refreshQuestion(key),1200);
  },1000);
}

/* ══ REFRESH QUESTION INLINE ══ */
function refreshQuestion(key){
  const s=stages[key];
  const allDone=qIndex[key]>=10;
  // update just the quiz section and choices
  const qBox=document.querySelector('.q-progress');
  const quizBox=document.querySelector('.quiz-box');
  const cw=document.getElementById('choices-wrap');
  if(qBox&&quizBox){
    const newHTML=renderQuestion(key);
    const tmp=document.createElement('div'); tmp.innerHTML=newHTML;
    qBox.parentNode.replaceChild(tmp,qBox.parentNode.lastElementChild.previousElementSibling||qBox);
    // easier: just re-render the whole quiz zone
    const container=document.querySelector('.quiz-box');
    if(container){
      const parent=container.parentNode;
      // replace from q-progress to quiz-box with fresh render
      const fresh=document.createElement('div'); fresh.innerHTML=renderQuestion(key);
      while(fresh.firstChild)parent.insertBefore(fresh.firstChild,container);
      parent.removeChild(container);
      const oldProg=parent.querySelector('.q-progress');
      if(oldProg)parent.removeChild(oldProg);
    }
  }
  if(cw)cw.classList.toggle('show',allDone);
  // simpler approach: just rebuild the panel
  showStageRefresh(key);
}

function showStageRefresh(key){
  // rebuild panel without scrolling to top aggressively
  const s=stages[key];
  const allDone=qIndex[key]>=10;
  const choicesHTML=s.choices.map(c=>`<button class="cbtn" onclick="goTo('${c.next}')">${c.label}</button>`).join('');
  const badgeStyle=`background:rgba(${s.colorRgb},0.1);color:${s.colorHex};border-color:rgba(${s.colorRgb},0.3);`;
  const cardStyle=`background:rgba(${s.colorRgb},0.07);border-color:rgba(${s.colorRgb},0.25);`;
  const varStyle=`color:rgba(${s.colorRgb},0.75);`;
  const scrollPos=panel.scrollTop;
  panel.innerHTML=`
    <div class="p-badge" style="${badgeStyle}">${s.badge}</div>
    <div class="p-title">${s.title}</div>
    <div class="formula-card" style="${cardStyle}">
      <div class="f-label" style="${varStyle}">Formel</div>
      <div class="formula-main">${s.formula.main}</div>
      <div class="formula-vars" style="${varStyle}">${s.formula.vars}</div>
    </div>
    <div class="p-desc">${s.desc}</div>
    ${renderQuestion(key)}
    <div class="choices${allDone?' show':''}" id="choices-wrap">${choicesHTML}</div>
  `;
  panel.scrollTop=scrollPos;
  // focus open input if present
  setTimeout(()=>{ const inp=document.getElementById('open-inp'); if(inp)inp.focus(); },100);
}

/* ══ NAV ══ */
function goTo(key){
  panel.classList.remove('open'); clearTrail();
  setTimeout(()=>animateTo(stages[key].x,stages[key].y,()=>showStage(key)),220);
}

/* ══ RESTART ══ */
function restartGame(){
  visited.clear();correctTotal=0;totalAnswered=0;
  ORDER.forEach(k=>{qIndex[k]=0;qCorrect[k]=0;});
  document.querySelectorAll('.stamp').forEach(e=>e.remove());
  ORDER.forEach(k=>{const d=document.getElementById('dot-'+k);if(d)d.classList.remove('done');});
  endSc.classList.remove('show');panel.classList.remove('open');panel.innerHTML='';
  hint.style.opacity='1';clearTrail();
  scoreBar.classList.add('hidden');
  posX=80;posY=248;applyCharTransform(80,248,0);
  const fEl=charMode==='el'?elFlame:robFlame;if(fEl)fEl.style.display='none';
  setTimeout(()=>{animateTo(80,248,()=>showStage('kin'));setTimeout(()=>{hint.style.opacity='0';},3500);},350);
}

/* ══ HOTSPOTS ══ */
Object.entries(stages).forEach(([key,s])=>{
  const el=document.getElementById(s.hsId);if(!el)return;
  const h=()=>{if(animating)return;panel.classList.remove('open');clearTrail();setTimeout(()=>animateTo(s.x,s.y,()=>showStage(key)),120);};
  el.addEventListener('click',h);
  el.addEventListener('touchend',e=>{e.preventDefault();h();},{passive:false});
});

/* ══ RESIZE ══ */
window.addEventListener('resize',()=>{
  ORDER.forEach(k=>{
    const el=document.getElementById('stamp-'+k);
    if(!el||!visited.has(k))return;
    const pos=svgPct(stages[k].x,stages[k].y);
    el.style.left=pos.left;el.style.top=pos.top;
  });
});

/* ══ INIT ══ */
if(elFlame)elFlame.style.display='none';
if(robFlame)robFlame.style.display='none';
robEl.style.display='none';
scoreBar.classList.add('hidden');
applyCharTransform(80,248,0);
setTimeout(()=>{animateTo(80,248,()=>showStage('kin'));setTimeout(()=>{hint.style.opacity='0';},3500);},700);
