<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Syrer & Baser – Kemilaboratoriet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@700;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --acid:   #22dd88;   /* green — acid world */
  --base:   #44aaff;   /* blue  — base world  */
  --neutral:#f5c842;   /* gold  — neutral     */
  --bg:     #0d1a12;
  --panel:  rgba(8,20,14,0.96);
  --fmono: 'Space Mono', monospace;
  --fhead: 'Nunito', sans-serif;
  --fbody: 'Nunito Sans', sans-serif;
  --f-xs: clamp(10px,2.2vw,12px);
  --f-sm: clamp(12px,2.8vw,14px);
  --f-md: clamp(13px,3.2vw,15px);
  --f-lg: clamp(15px,4vw,20px);
  --f-xl: clamp(20px,5.5vw,30px);
}
html,body { width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--fbody);-webkit-tap-highlight-color:transparent;touch-action:manipulation; }
#wc { position:relative;width:100dvw;height:100dvh;overflow:hidden; }
#mapsvg { position:absolute;inset:0;width:100%;height:100%; }

/* bubbles */
@keyframes rise    { 0%{transform:translateY(0) scale(1);opacity:.7} 100%{transform:translateY(-80px) scale(1.3);opacity:0} }
@keyframes wobble  { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
@keyframes glow    { 0%,100%{opacity:.55}50%{opacity:1} }
@keyframes pulse   { 0%,100%{opacity:.4}50%{opacity:1} }
@keyframes drip    { 0%{transform:translateY(0);opacity:.9}80%{transform:translateY(18px);opacity:.9}100%{transform:translateY(22px);opacity:0} }
@keyframes twinkle { 0%,100%{opacity:.3}50%{opacity:.9} }

.hs { animation:pulse 2.2s ease-in-out infinite; }
.b1{animation:rise 2.4s ease-in infinite;} .b2{animation:rise 3.1s ease-in infinite;} .b3{animation:rise 2.8s ease-in infinite;}
.b4{animation:rise 3.6s ease-in infinite;} .b5{animation:rise 2.1s ease-in infinite;}
.drip1{animation:drip 2.2s ease-in infinite;} .drip2{animation:drip 3s ease-in infinite;}

/* ── CHAR TOGGLE ── */
#char-toggle {
  position:absolute;top:max(10px,env(safe-area-inset-top,10px));
  left:max(10px,env(safe-area-inset-left,10px));
  z-index:25;display:flex;gap:5px;
}
.ctbtn {
  font-family:var(--fmono);font-weight:700;font-size:clamp(9px,2vw,11px);
  background:rgba(8,20,14,0.88);color:rgba(255,255,255,0.5);
  border:1px solid rgba(34,221,136,0.25);border-radius:4px;
  padding:4px 10px;cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:.02em;
}
.ctbtn.active { background:rgba(34,221,136,0.15);color:var(--acid);border-color:var(--acid); }

/* ── HINT ── */
#hint {
  position:absolute;top:max(10px,env(safe-area-inset-top,10px));
  left:50%;transform:translateX(-50%);
  background:rgba(8,20,14,0.9);color:#fff;
  font-family:var(--fmono);font-size:var(--f-xs);
  padding:5px 14px;border-radius:3px;pointer-events:none;
  transition:opacity .8s;white-space:nowrap;z-index:20;
  max-width:90vw;text-align:center;border:1px solid rgba(34,221,136,0.2);
}
/* ── PROGRESS ── */
#progress-bar {
  position:absolute;top:max(10px,env(safe-area-inset-top,10px));
  right:max(10px,env(safe-area-inset-right,10px));
  display:flex;gap:4px;align-items:center;z-index:20;
}
.prog-dot {
  width:clamp(7px,1.8vw,10px);height:clamp(7px,1.8vw,10px);border-radius:50%;
  background:rgba(34,221,136,0.15);border:1.5px solid rgba(34,221,136,0.3);
  transition:background .3s,border-color .3s;
}
.prog-dot.done { background:var(--acid);border-color:var(--acid); }

/* ── PANEL ── */
#panel {
  position:absolute;bottom:0;left:0;right:0;background:var(--panel);
  border-top:1px solid rgba(34,221,136,0.15);border-radius:14px 14px 0 0;
  padding:14px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom,16px));
  transform:translateY(110%);transition:transform .38s cubic-bezier(.22,1,.36,1);
  z-index:30;max-height:68dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#panel.open { transform:translateY(0); }
#panel::before { content:'';display:block;width:36px;height:3px;background:rgba(34,221,136,0.25);border-radius:2px;margin:0 auto 12px; }

.p-badge {
  display:inline-block;font-family:var(--fmono);font-weight:700;font-size:var(--f-xs);
  letter-spacing:.06em;text-transform:uppercase;
  background:rgba(34,221,136,0.1);color:var(--acid);
  padding:2px 9px;border-radius:3px;border:1px solid rgba(34,221,136,0.25);margin-bottom:5px;
}
.p-badge.base { background:rgba(68,170,255,0.1);color:var(--base);border-color:rgba(68,170,255,0.3); }
.p-badge.neutral { background:rgba(245,200,66,0.1);color:var(--neutral);border-color:rgba(245,200,66,0.3); }
.p-title { font-family:var(--fmono);font-weight:700;font-size:var(--f-lg);color:#fff;margin-bottom:3px;line-height:1.2; }
.p-formula {
  font-family:var(--fmono);font-size:var(--f-md);color:var(--acid);
  margin-bottom:6px;letter-spacing:.04em;
}
.p-formula.base { color:var(--base); }
.p-formula.neutral { color:var(--neutral); }
.p-desc { font-size:var(--f-sm);color:rgba(255,255,255,0.75);line-height:1.55;margin-bottom:8px; }
.p-fact { font-size:var(--f-xs);color:rgba(255,255,255,0.42);line-height:1.5;padding:7px 0;border-top:1px solid rgba(34,221,136,0.1);border-bottom:1px solid rgba(34,221,136,0.1);margin-bottom:10px;font-family:var(--fbody); }
.p-fact b { color:rgba(34,221,136,0.9);font-weight:600; }

/* reaction display */
.reaction-box {
  background:rgba(34,221,136,0.06);border:1px solid rgba(34,221,136,0.18);
  border-radius:8px;padding:8px 12px;margin-bottom:10px;
  font-family:var(--fmono);font-size:clamp(10px,2.5vw,13px);color:rgba(255,255,255,0.85);
  line-height:1.7;text-align:center;
}
.reaction-box.base { border-color:rgba(68,170,255,0.2);background:rgba(68,170,255,0.06); }
.reaction-box.neutral { border-color:rgba(245,200,66,0.2);background:rgba(245,200,66,0.05); }

.q-progress { font-family:var(--fmono);font-size:var(--f-xs);color:rgba(34,221,136,0.4);margin-bottom:6px;letter-spacing:.04em; }

.quiz-box { background:rgba(255,255,255,0.04);border:1px solid rgba(34,221,136,0.12);border-radius:10px;padding:11px 12px;margin-bottom:10px; }
.quiz-q   { font-family:var(--fbody);font-weight:700;font-size:var(--f-sm);color:#fff;margin-bottom:9px;line-height:1.4; }
.quiz-opts { display:grid;grid-template-columns:1fr 1fr;gap:6px; }
.qbtn {
  font-family:var(--fmono);font-weight:700;font-size:var(--f-xs);
  background:rgba(34,221,136,0.06);color:rgba(255,255,255,0.85);
  border:1px solid rgba(34,221,136,0.18);border-radius:6px;
  padding:9px 6px;cursor:pointer;text-align:center;line-height:1.4;
  min-height:44px;display:flex;align-items:center;justify-content:center;
  transition:background .14s,transform .1s;
}
.qbtn:hover:not(:disabled) { background:rgba(34,221,136,0.18); }
.qbtn:active:not(:disabled) { transform:scale(0.95); }
.qbtn.correct { background:rgba(34,221,136,0.22);border-color:rgba(34,221,136,0.7); }
.qbtn.wrong   { background:rgba(220,60,60,0.2); border-color:rgba(220,60,60,0.6); }
.qbtn:disabled { cursor:default; }
.quiz-fb { font-size:var(--f-xs);margin-top:8px;padding:8px 10px;border-radius:6px;line-height:1.5;display:none;font-family:var(--fbody); }
.quiz-fb.ok { background:rgba(34,221,136,0.12);color:#7affbb; }
.quiz-fb.no { background:rgba(220,60,60,0.12); color:#ffbebe; }

.choices { display:none;flex-wrap:wrap;gap:7px; }
.choices.show { display:flex; }
.cbtn {
  font-family:var(--fmono);font-weight:700;font-size:var(--f-sm);
  background:rgba(34,221,136,0.08);color:#fff;
  border:1px solid rgba(34,221,136,0.25);border-radius:7px;
  padding:11px 12px;cursor:pointer;flex:1;min-width:120px;min-height:44px;
  text-align:center;transition:background .14s,transform .1s;
}
.cbtn:hover  { background:rgba(34,221,136,0.2); }
.cbtn:active { transform:scale(0.96); }

.stamp {
  position:absolute;width:clamp(14px,3.5vw,20px);height:clamp(14px,3.5vw,20px);
  border-radius:50%;background:var(--acid);border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(8px,2vw,11px);font-weight:700;color:#0d1a12;
  pointer-events:none;transform:translate(-50%,-50%) scale(0);
  animation:stampIn .4s cubic-bezier(.34,1.56,.64,1) forwards;z-index:25;
}
@keyframes stampIn { to{transform:translate(-50%,-50%) scale(1);} }

#endscreen {
  display:none;position:absolute;inset:0;background:rgba(8,16,12,0.97);
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:28px 20px;padding-bottom:max(28px,env(safe-area-inset-bottom,28px));
  z-index:50;overflow-y:auto;
}
#endscreen.show { display:flex; }
.end-emoji  { font-size:clamp(36px,9vw,56px);margin-bottom:10px; }
.end-title  { font-family:var(--fmono);font-weight:700;font-size:var(--f-xl);color:var(--acid);margin-bottom:8px; }
.end-sub    { font-size:var(--f-md);color:rgba(255,255,255,0.62);line-height:1.55;margin-bottom:14px;max-width:380px; }
.end-score  { font-family:var(--fmono);font-weight:700;font-size:clamp(44px,12vw,68px);color:var(--acid);line-height:1; }
.end-score-label { font-size:var(--f-xs);color:rgba(34,221,136,0.4);margin-bottom:6px;font-family:var(--fmono); }
.end-stars  { font-size:clamp(24px,6vw,36px);margin:4px 0 8px; }
.end-msg    { font-size:var(--f-sm);color:rgba(255,255,255,0.5);max-width:340px;line-height:1.6;margin-bottom:22px; }
.restart-btn {
  font-family:var(--fmono);font-weight:700;font-size:var(--f-md);
  background:var(--acid);color:#0d1a12;border:none;border-radius:6px;
  padding:14px 36px;cursor:pointer;min-height:52px;
  transition:background .14s,transform .1s;
}
.restart-btn:hover  { background:#44ffaa; }
.restart-btn:active { transform:scale(0.97); }
</style>
</head>
<body>
<div id="wc">

<!-- ══════════════════════════════════
     LABORATORY MAP SVG
     ══════════════════════════════════ -->
<svg id="mapsvg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="labFloor" cx="50%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#143020" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#0d1a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="acidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22dd88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22dd88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="baseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#44aaff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#44aaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neutralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f5c842" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ROOM: dark lab background -->
  <rect x="0" y="0" width="800" height="500" fill="#0a1410"/>
  <!-- Ceiling tiles -->
  <rect x="0"   y="0" width="200" height="70" fill="#0e1a14" rx="0"/>

  <!-- Ceiling strip lights -->
  <rect x="80"  y="0"  width="120" height="8" fill="#b8ffcc" opacity=".18" rx="2"/>
  <rect x="330" y="0"  width="140" height="8" fill="#b8ffcc" opacity=".18" rx="2"/>
  <rect x="570" y="0"  width="140" height="8" fill="#b8ffcc" opacity=".18" rx="2"/>
  <!-- light pools on floor -->
  <ellipse cx="140" cy="460" rx="110" ry="40" fill="#22dd88" opacity=".04"/>
  <ellipse cx="400" cy="460" rx="120" ry="40" fill="#22dd88" opacity=".04"/>
  <ellipse cx="660" cy="460" rx="110" ry="40" fill="#22dd88" opacity=".04"/>

  <!-- BACK WALL -->
  <rect x="0" y="70" width="800" height="220" fill="#0f1e16"/>
  <!-- Wall tiles -->
  <line x1="0" y1="140" x2="800" y2="140" stroke="#142018" stroke-width="1"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="#142018" stroke-width="1"/>

  <line x1="200" y1="70" x2="200" y2="290" stroke="#142018" stroke-width="1"/>
  <line x1="300" y1="70" x2="300" y2="290" stroke="#142018" stroke-width="1"/>
  <line x1="400" y1="70" x2="400" y2="290" stroke="#142018" stroke-width="1"/>
  <line x1="500" y1="70" x2="500" y2="290" stroke="#142018" stroke-width="1"/>
  <line x1="600" y1="70" x2="600" y2="290" stroke="#142018" stroke-width="1"/>
  <line x1="700" y1="70" x2="700" y2="290" stroke="#142018" stroke-width="1"/>

  <!-- SHELVES on back wall -->
  <rect x="20"  y="85"  width="220" height="7" fill="#1e3028" rx="2"/>
  <rect x="290" y="85"  width="230" height="7" fill="#1e3028" rx="2"/>
  <rect x="560" y="85"  width="220" height="7" fill="#1e3028" rx="2"/>
  <rect x="20"  y="155" width="220" height="7" fill="#1e3028" rx="2"/>
  <rect x="290" y="155" width="230" height="7" fill="#1e3028" rx="2"/>
  <rect x="560" y="155" width="220" height="7" fill="#1e3028" rx="2"/>

  <!-- SHELF ITEMS – various bottles & equipment -->
  <!-- Left shelf row 1 -->
  <rect x="35"  y="72" width="12" height="13" rx="2" fill="#c44"/>
  <rect x="55"  y="70" width="14" height="15" rx="3" fill="#44c" opacity=".8"/>
  <rect x="78"  y="73" width="10" height="12" rx="2" fill="#4a4" opacity=".9"/>
  <rect x="95"  y="68" width="18" height="17" rx="3" fill="#884" opacity=".8"/>
  <rect x="122" y="72" width="12" height="13" rx="2" fill="#c84" opacity=".85"/>
  <rect x="142" y="70" width="16" height="15" rx="3" fill="#48c" opacity=".8"/>
  <rect x="168" y="71" width="13" height="14" rx="2" fill="#4cc" opacity=".7"/>
  <rect x="188" y="73" width="11" height="12" rx="2" fill="#a44" opacity=".9"/>
  <rect x="207" y="69" width="15" height="16" rx="3" fill="#8c4" opacity=".8"/>
  <!-- Middle shelf row 1 -->
  <rect x="302" y="71" width="16" height="14" rx="3" fill="#22dd88" opacity=".6"/>
  <rect x="326" y="70" width="14" height="15" rx="3" fill="#44aaff" opacity=".6"/>
  <rect x="348" y="72" width="12" height="13" rx="2" fill="#f5c842" opacity=".6"/>

  <rect x="486" y="71" width="14" height="14" rx="3" fill="#44aaff" opacity=".5"/>
  <!-- Right shelf row 1 -->

  <rect x="594" y="70" width="16" height="15" rx="3" fill="#22dd88" opacity=".6"/>
  <rect x="618" y="73" width="10" height="12" rx="2" fill="#f5c842" opacity=".6"/>
  <rect x="636" y="69" width="18" height="16" rx="3" fill="#cc4422" opacity=".6"/>
  <rect x="662" y="72" width="12" height="13" rx="2" fill="#4488cc" opacity=".7"/>
  <rect x="680" y="70" width="14" height="15" rx="3" fill="#44cc88" opacity=".6"/>
  <rect x="702" y="71" width="16" height="14" rx="3" fill="#8844dd" opacity=".5"/>
  <rect x="726" y="73" width="12" height="12" rx="2" fill="#cc8844" opacity=".6"/>

  <!-- Row 2 left -->
  <rect x="40"  y="141" width="12" height="14" rx="2" fill="#22dd88" opacity=".5"/>

  <!-- Erlenmeyer flasks on shelf -->
  <path d="M165 152 L162 140 L160 140 L157 140 L155 152 L148 162 L172 162 Z" fill="#44dd88" opacity=".5"/>
  <rect x="158" y="138" width="7" height="4" rx="1" fill="#aaa" opacity=".4"/>

  <!-- MAIN WORKBENCH (horizontal, runs across) -->
  <rect x="0"   y="288" width="800" height="22" fill="#1a2e20" rx="0"/>
  <rect x="0"   y="308" width="800" height="6"  fill="#142018"/>
  <!-- bench surface highlight -->
  <rect x="0"   y="288" width="800" height="3"  fill="#2a4030" opacity=".8"/>

  <!-- FLOOR -->
  <rect x="0" y="314" width="800" height="186" fill="#0d1a12"/>
  <!-- floor tiles -->
  <line x1="0"   y1="360" x2="800" y2="360" stroke="#121e16" stroke-width="1.5"/>
  <line x1="0"   y1="420" x2="800" y2="420" stroke="#121e16" stroke-width="1.5"/>
  <line x1="0"   y1="480" x2="800" y2="480" stroke="#121e16" stroke-width="1.5"/>
  <line x1="100" y1="314" x2="100" y2="500" stroke="#121e16" stroke-width="1.5"/>

  <line x1="300" y1="314" x2="300" y2="500" stroke="#121e16" stroke-width="1.5"/>
  <line x1="400" y1="314" x2="400" y2="500" stroke="#121e16" stroke-width="1.5"/>
  <line x1="500" y1="314" x2="500" y2="500" stroke="#121e16" stroke-width="1.5"/>
  <line x1="600" y1="314" x2="600" y2="500" stroke="#121e16" stroke-width="1.5"/>
  <line x1="700" y1="314" x2="700" y2="500" stroke="#121e16" stroke-width="1.5"/>

  <!-- TRAIL -->
  <g id="trail"></g>

  <!-- ══════════════════════════════════
       STATION APPARATUS (illustrated)
       Each station has a unique glassware setup
       ══════════════════════════════════ -->

  <!-- STATION 1: HCl – Saltsyre (simple beaker, left) -->
  <!-- Glow -->
  <circle cx="90" cy="255" r="50" fill="url(#acidGlow)"/>
  <!-- Beaker -->
  <path d="M62 220 L62 274 Q62 278 66 278 L114 278 Q118 278 118 274 L118 220 Z" fill="none" stroke="#22dd88" stroke-width="1.5" opacity=".6"/>
  <rect x="63" y="220" width="54" height="5" rx="1" fill="#22dd88" opacity=".15"/>
  <!-- liquid -->
  <rect x="63" y="250" width="54" height="27" fill="#22dd88" opacity=".18" rx="0"/>
  <!-- liquid surface shimmer -->
  <line x1="63" y1="250" x2="117" y2="250" stroke="#22dd88" stroke-width="1" opacity=".5"/>
  <!-- Bubbles -->

/* ══ STATE ══ */
let visited=new Set(), qIndex={}, qCorrect={}, correctTotal=0, animating=false;
let charMode='molecule', posX=90, posY=255, trailPoints=[];
ORDER.forEach(k=>{qIndex[k]=0; qCorrect[k]=0;});

/* ══ ELEMENTS ══ */
const wc=document.getElementById('wc'), mapSvg=document.getElementById('mapsvg');
const molEl=document.getElementById('char-molecule'), bkrEl=document.getElementById('char-beaker');
const molFlame=document.getElementById('mol-flame'), bkrFlame=document.getElementById('bkr-flame');

ORDER.forEach(k=>{

});

/* ══ CHARACTER ══ */
function setChar(mode){
  charMode=mode;
  document.getElementById('btn-mol').classList.toggle('active',mode==='molecule');
  document.getElementById('btn-bkr').classList.toggle('active',mode==='beaker');
  molEl.style.display=mode==='molecule'?'':'none';
  bkrEl.style.display=mode==='beaker'?'':'none';
  applyCharTransform(posX,posY,0);
}
function applyCharTransform(x,y,angle){
  const scale=0.5;
  const el=charMode==='molecule'?molEl:bkrEl;
  el.setAttribute('transform',`translate(${x},${y}) rotate(${angle}) scale(${scale})`);
}

/* ══ TRAIL ══ */
function addTrailPoint(x,y){
  trailPoints.push({x,y}); if(trailPoints.length>70)trailPoints.shift(); redrawTrail();
}
function redrawTrail(){
  trailG.innerHTML=''; const total=trailPoints.length;
  for(let i=1;i<total;i++){
    const frac=i/total;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',trailPoints[i-1].x); line.setAttribute('y1',trailPoints[i-1].y);
    line.setAttribute('x2',trailPoints[i].x);   line.setAttribute('y2',trailPoints[i].y);
    line.setAttribute('stroke','#22dd88');
    line.setAttribute('stroke-width',frac*2.2);
    line.setAttribute('opacity',frac*0.45);
    line.setAttribute('stroke-linecap','round');
    trailG.appendChild(line);
  }
}
function clearTrail(){trailPoints=[];trailG.innerHTML='';}

/* ══ ANIMATE ══ */
function animateTo(tx,ty,cb){
  if(animating)return; animating=true;
  const sx=posX,sy=posY,dx=tx-sx,dy=ty-sy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const dur=Math.min(2000,Math.max(600,dist*4));
  const t0=performance.now(); let lastTrail=0;
  const fEl=charMode==='molecule'?molFlame:bkrFlame;
  if(fEl)fEl.style.display='';
  function step(now){
    const t=Math.min(1,(now-t0)/dur);
    const ease=t<0.5?2*t*t:-1+(4-2*t)*t;
    const arc=Math.sin(t*Math.PI)*Math.min(dist*.12,32);
    const len=Math.sqrt(dx*dx+dy*dy)||1;
    const cx=sx+dx*ease+(-dy/len)*arc*(1-Math.abs(ease*2-1));
    const cy=sy+dy*ease+(dx/len)*arc*(1-Math.abs(ease*2-1));
    posX=cx; posY=cy;
    const prev=Math.max(0,ease-.02);
    const vx=cx-(sx+dx*prev), vy=cy-(sy+dy*prev);
    const ang=Math.atan2(vy,vx)*180/Math.PI+90;
    applyCharTransform(cx,cy,ang);
    if(now-lastTrail>30){addTrailPoint(cx,cy);lastTrail=now;}
    if(t<1) requestAnimationFrame(step);
    else{
      posX=tx;posY=ty;applyCharTransform(tx,ty,0);animating=false;
      if(fEl)fEl.style.display='none'; if(cb)cb();
    }
  }
  requestAnimationFrame(step);
}

/* ══ SVG → CSS ══ */
function svgPct(svgX,svgY){
  const rect=mapSvg.getBoundingClientRect();
  const scale=Math.max(rect.width/800,rect.height/500);
  const offX=(rect.width-800*scale)/2, offY=(rect.height-500*scale)/2;
  return{left:(offX+svgX*scale)+'px',top:(offY+svgY*scale)+'px'};
}
function addStamp(key){
  const s=stages[key],pos=svgPct(s.x,s.y);
  const el=document.createElement('div');
  el.className='stamp';el.id='stamp-'+key;el.textContent='✓';
  el.style.left=pos.left;el.style.top=pos.top;wc.appendChild(el);
}
function markDot(key){const d=document.getElementById('dot-'+key);if(d)d.classList.add('done');}

/* ══ WIN CHECK ══ */
function checkAllDone(){
  const allV=visited.size>=ORDER.length;
  const allQ=ORDER.every(k=>qIndex[k]>=10);
  if(!allV||!allQ)return;
  setTimeout(()=>{
    panel.classList.remove('open');
    const pct=Math.round(correctTotal/TOTAL_Q*100);
    document.getElementById('end-score').textContent=correctTotal+'/'+TOTAL_Q;
    let stars,msg;
    if(pct===100)    {stars='⭐⭐⭐';msg='Perfekt! Du er en ægte kemiker og forstår alle reaktioner og ioner!';}
    else if(pct>=70) {stars='⭐⭐'; msg='Fremragende! Du har god forståelse af syrer og baser. Prøv igen for at slå din rekord!';}
    else             {stars='⭐';   msg='Godt forsøgt! Gentag eksperimentet og bliv endnu skarpere på kemien.';}
    document.getElementById('end-stars').textContent=stars;
    document.getElementById('end-msg').textContent=msg;
    endSc.classList.add('show');
  },700);
}

/* ══ SHOW STAGE ══ */
function showStage(key){
  const s=stages[key], isNew=!visited.has(key);
  if(isNew){visited.add(key);addStamp(key);markDot(key);}
  hint.style.opacity='0';
  const qi=qIndex[key], allDone=qi>=10;

  const typeClass=s.type==='acid'?'':'base' ? s.type : 'neutral';
  const badgeClass=s.type==='base'?'base':s.type==='neutral'?'neutral':'';
  const reactionClass=s.type==='base'?'base':s.type==='neutral'?'neutral':'';

  let quizSection='', choicesClass='choices show';
  if(!allDone){
    const q=s.questions[qi];
    const optsHTML=q.opts.map((o,i)=>`<button class="qbtn" id="qo${i}" onclick="answerQ('${key}',${i},${q.c})">${o}</button>`).join('');
    quizSection=`
      <div class="q-progress">Spørgsmål ${qi+1} af 10</div>
      <div class="quiz-box">
        <div class="quiz-q">⚗ ${q.q}</div>
        <div class="quiz-opts">${optsHTML}</div>
        <div class="quiz-fb" id="qfb"></div>
      </div>`;
    choicesClass='choices';
  } else {
    quizSection=`<div class="quiz-box" style="opacity:.38"><div class="quiz-q" style="font-size:var(--f-xs)">✓ Alle 10 spørgsmål besvaret — ${qCorrect[key]}/10 rigtige</div></div>`;
  }

  const choicesHTML=s.choices.map(c=>`<button class="cbtn" onclick="goTo('${c.next}')">${c.label}</button>`).join('');

  panel.innerHTML=`
    <div class="p-badge ${badgeClass}">${s.badge}</div>
    <div class="p-title">${s.title}</div>
    <div class="p-formula ${reactionClass}">${s.formula}</div>
    <div class="reaction-box ${reactionClass}">${s.reaction}</div>
    <div class="p-desc">${s.desc}</div>
    <div class="p-fact">${s.fact}</div>
    ${quizSection}
    <div class="${choicesClass}" id="choices-wrap">${choicesHTML}</div>
  `;
  panel.classList.add('open');
  panel.scrollTop=0;
}

/* ══ ANSWER ══ */
function answerQ(key,chosen,correct){
  document.querySelectorAll('.qbtn').forEach((b,i)=>{
    b.disabled=true;
    if(i===correct)b.classList.add('correct');
    else if(i===chosen&&chosen!==correct)b.classList.add('wrong');
  });
  const fb=document.getElementById('qfb');
  const q=stages[key].questions[qIndex[key]];
  if(chosen===correct){correctTotal++;qCorrect[key]++;fb.className='quiz-fb ok';fb.textContent='✅ '+q.fb;}
  else{fb.className='quiz-fb no';fb.textContent='❌ Ikke helt. '+q.fb;}
  fb.style.display='block';
  qIndex[key]++;
  setTimeout(()=>{const cw=document.getElementById('choices-wrap');if(cw)cw.classList.add('show');checkAllDone();},900);
}

/* ══ NAV ══ */
function goTo(key){
  panel.classList.remove('open'); clearTrail();
  setTimeout(()=>animateTo(stages[key].x,stages[key].y,()=>showStage(key)),220);
}

/* ══ RESTART ══ */
function restartGame(){
  visited.clear();correctTotal=0;
  ORDER.forEach(k=>{qIndex[k]=0;qCorrect[k]=0;});
  document.querySelectorAll('.stamp').forEach(e=>e.remove());
  ORDER.forEach(k=>{const d=document.getElementById('dot-'+k);if(d)d.classList.remove('done');});
  endSc.classList.remove('show');panel.classList.remove('open');panel.innerHTML='';
  hint.style.opacity='1';clearTrail();
  posX=90;posY=255;applyCharTransform(90,255,0);
  const fEl=charMode==='molecule'?molFlame:bkrFlame;
  if(fEl)fEl.style.display='none';
  setTimeout(()=>{animateTo(90,255,()=>showStage('hcl'));setTimeout(()=>{hint.style.opacity='0';},3500);},350);
}

/* ══ HOTSPOTS ══ */
Object.entries(stages).forEach(([key,s])=>{
  const el=document.getElementById(s.hsId);if(!el)return;
  const h=()=>{if(animating)return;panel.classList.remove('open');clearTrail();setTimeout(()=>animateTo(s.x,s.y,()=>showStage(key)),120);};
  el.addEventListener('click',h);
  el.addEventListener('touchend',e=>{e.preventDefault();h();},{passive:false});
});

/* ══ RESIZE ══ */
window.addEventListener('resize',()=>{
  ORDER.forEach(k=>{
    const el=document.getElementById('stamp-'+k);
    if(!el||!visited.has(k))return;
    const pos=svgPct(stages[k].x,stages[k].y);
    el.style.left=pos.left;el.style.top=pos.top;
  });
});

/* ══ INIT ══ */
if(molFlame)molFlame.style.display='none';
if(bkrFlame)bkrFlame.style.display='none';
bkrEl.style.display='none';
applyCharTransform(90,255,0);
setTimeout(()=>{animateTo(90,255,()=>showStage('hcl'));setTimeout(()=>{hint.style.opacity='0';},3500);},700);
</script>
</body>
