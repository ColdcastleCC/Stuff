<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energi Quiz – Fysik</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#0d0b26;--panel:#181444;--panel2:#201c54;--border:#3d3590;
  --white:#eeeaff;--muted:#9b91cc;
  --c1:#ff6b9d;--c1g:rgba(255,107,157,.35);
  --c2:#5af5a0;--c2g:rgba(90,245,160,.3);
  --c3:#ffaa3b;--c3g:rgba(255,170,59,.35);
  --green:#5af5a0;--red:#ff5070;--gold:#ffe566;--blue:#52d8ff;--purple:#c87aff;
  --acc:var(--c1);--accg:var(--c1g);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--sky);font-family:'Nunito Sans',sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;overflow-x:hidden;color:var(--white);padding:16px 8px 48px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 25%,rgba(120,60,255,.2) 0%,transparent 55%),radial-gradient(ellipse at 85% 75%,rgba(255,107,157,.12) 0%,transparent 50%);pointer-events:none;z-index:0;animation:bgP 9s ease-in-out infinite alternate;}
@keyframes bgP{from{opacity:.7}to{opacity:1}}
.star{position:fixed;border-radius:50%;background:#fff;pointer-events:none;z-index:0;animation:tw var(--d,3s) ease-in-out infinite alternate;}
@keyframes tw{from{opacity:var(--o,.6)}to{opacity:.04}}
.screen{display:none;position:relative;z-index:1;width:min(700px,100%);animation:popIn .32s cubic-bezier(.175,.885,.32,1.275);}
.screen.active{display:block;}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
.card{background:linear-gradient(155deg,var(--panel),var(--panel2));border-radius:22px;padding:34px 38px;box-shadow:0 0 0 2px var(--border),0 0 50px rgba(60,50,160,.5),0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);position:relative;overflow:hidden;margin-bottom:12px;}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.85;}

/* MASCOT */
.mascot{text-align:center;font-size:4rem;display:block;margin:4px 0;animation:mFloat 3s ease-in-out infinite;filter:drop-shadow(0 4px 16px var(--accg));}
@keyframes mFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
h1{font-family:'Nunito',sans-serif;font-size:clamp(2rem,6vw,3rem);font-weight:900;text-align:center;color:var(--white);text-shadow:0 0 30px var(--accg);}
h1 em{font-style:normal;color:var(--acc);}
h2{font-family:'Nunito',sans-serif;font-size:1.5rem;font-weight:900;color:var(--white);text-align:center;margin-bottom:14px;}
p{color:var(--muted);line-height:1.7;font-size:.95rem;}
.sub{display:block;text-align:center;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;opacity:.85;}
.divider{height:2px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:18px 0;}

/* TOPIC CARDS */
.topic-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0;}
.topic-card{border-radius:16px;padding:16px 20px;border:1.5px solid;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .18s cubic-bezier(.175,.885,.32,1.275);position:relative;}
.topic-card:hover{transform:translateY(-2px) scale(1.02);}
.topic-card.locked{opacity:.4;cursor:not-allowed;}
.topic-card.locked:hover{transform:none;}
.topic-card.done{opacity:.75;}
.topic-card .t-icon{font-size:2.2rem;flex-shrink:0;}
.topic-card .t-info h3{font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:800;}
.topic-card .t-info p{font-size:.82rem;color:var(--muted);margin-top:2px;}
.topic-card .t-badge{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:.75rem;font-weight:800;padding:4px 12px;border-radius:50px;}
.done-badge{background:rgba(90,245,160,.15);color:var(--green);border:1px solid rgba(90,245,160,.3);}
.lock-badge{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid rgba(255,255,255,.1);}
.open-badge{border:1px solid var(--acc);color:var(--acc);background:rgba(255,107,157,.08);}

/* BUTTONS */
.btn{display:inline-block;padding:12px 26px;border-radius:50px;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:800;cursor:pointer;border:none;transition:all .15s cubic-bezier(.175,.885,.32,1.275);letter-spacing:.03em;text-transform:uppercase;}
.btn:active{transform:scale(.93)!important;}
.btn-primary{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));color:#fff;box-shadow:0 5px 20px var(--accg);}
.btn-primary:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 26px var(--accg);}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--blue);border:1.5px solid var(--border);}
.btn-ghost:hover{background:rgba(82,216,255,.1);transform:translateY(-1px);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#d97706);color:#000;box-shadow:0 4px 16px rgba(255,230,102,.35);}
.btn-gold:hover{transform:translateY(-2px) scale(1.04);}
.action-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}

/* INPUT */
.input-group{margin:14px 0;}
.input-group label{display:block;font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:7px;}
.input-group input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;background:rgba(255,255,255,.05);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;color:var(--white);outline:none;transition:all .2s;}
.input-group input::placeholder{color:rgba(155,145,204,.4);}
.input-group input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accg);}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.hud-chip{background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:50px;padding:5px 14px;text-align:center;}
.hud-chip .lbl{font-size:.62rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block;}
.hud-chip .val{font-family:'Nunito',sans-serif;font-size:1.5rem;font-weight:900;color:var(--white);line-height:1.1;}
.hud-chip .val.hi{color:var(--acc);text-shadow:0 0 12px var(--accg);}

/* TIMER */
.timer-wrap{width:100%;height:7px;background:rgba(255,255,255,.08);border-radius:4px;margin-bottom:12px;overflow:hidden;}
.timer-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--acc));border-radius:4px;transition:width .12s linear;box-shadow:0 0 8px var(--accg);}
.timer-bar.urgent{background:linear-gradient(90deg,var(--red),#ff9f43);animation:tPulse .35s ease infinite alternate;}
@keyframes tPulse{from{opacity:1}to{opacity:.45}}

/* PROGRESS */
.prog-dots{display:flex;justify-content:center;gap:6px;margin:8px 0 12px;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.1);transition:all .3s cubic-bezier(.175,.885,.32,1.275);border:1.5px solid rgba(255,255,255,.05);}
.dot.done{background:var(--green);border-color:var(--green);box-shadow:0 0 7px rgba(90,245,160,.7);}
.dot.wrong-dot{background:var(--red);border-color:var(--red);box-shadow:0 0 7px rgba(255,80,112,.7);}
.dot.current{background:var(--acc);border-color:var(--acc);transform:scale(1.4);box-shadow:0 0 10px var(--accg);}

/* LEVEL / STREAK */
.lvl-badge{display:inline-block;background:rgba(255,255,255,.07);color:var(--acc);font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 13px;border-radius:50px;border:1.5px solid var(--acc);text-shadow:0 0 8px var(--accg);}
.streak-pill{display:inline-block;background:linear-gradient(135deg,var(--acc),var(--gold));color:#fff;font-family:'Nunito',sans-serif;font-size:.76rem;padding:3px 11px;border-radius:50px;font-weight:800;opacity:0;transition:opacity .25s;}
.streak-pill.show{opacity:1;animation:sPop .35s cubic-bezier(.175,.885,.32,1.275);}
@keyframes sPop{0%{transform:scale(.45)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* LIVES */
.lives{display:flex;gap:4px;}
.heart{font-size:1.1rem;transition:all .25s;}
.heart.lost{opacity:.14;filter:grayscale(1);}

/* QUESTION */
.q-box{background:rgba(255,255,255,.04);border:1.5px solid var(--acc);border-radius:16px;padding:20px 22px;margin:10px 0;box-shadow:0 0 20px var(--accg),inset 0 1px 0 rgba(255,255,255,.05);}
.q-number{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:8px;opacity:.8;}
.q-text{font-size:clamp(.98rem,2.6vw,1.18rem);font-weight:600;line-height:1.65;color:var(--white);}
.q-text strong{color:var(--acc);}

/* HINT */
.hint-bar{background:rgba(255,230,102,.07);border-left:2px solid var(--gold);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.82rem;color:rgba(255,230,102,.8);font-style:italic;margin-bottom:10px;line-height:1.5;}

/* MC */
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
@media(max-width:460px){.mc-grid{grid-template-columns:1fr;}}
.mc-btn{padding:13px 10px;border-radius:12px;border:1.5px solid var(--border);background:rgba(255,255,255,.03);font-family:'Nunito Sans',sans-serif;font-size:.95rem;font-weight:600;color:var(--white);cursor:pointer;transition:all .14s cubic-bezier(.175,.885,.32,1.275);text-align:left;padding-left:14px;line-height:1.35;}
.mc-btn:hover:not(:disabled){border-color:var(--acc);background:rgba(255,255,255,.07);transform:translateY(-2px);box-shadow:0 4px 14px var(--accg);}
.mc-btn.correct-ans{border-color:var(--green);background:rgba(90,245,160,.1);color:var(--green);}
.mc-btn.wrong-ans{border-color:var(--red);background:rgba(255,80,112,.1);color:var(--red);}
.mc-btn:disabled{cursor:default;}

/* TF */
.tf-row{display:flex;gap:10px;margin:12px 0;}
.tf-btn{flex:1;padding:15px;border-radius:12px;border:1.5px solid var(--border);background:rgba(255,255,255,.03);font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:800;color:var(--white);cursor:pointer;transition:all .14s;text-align:center;letter-spacing:.06em;}
.tf-btn.t-btn:hover:not(:disabled){border-color:var(--green);background:rgba(90,245,160,.07);color:var(--green);}
.tf-btn.f-btn:hover:not(:disabled){border-color:var(--red);background:rgba(255,80,112,.07);color:var(--red);}
.tf-btn.correct-ans{border-color:var(--green);background:rgba(90,245,160,.1);color:var(--green);}
.tf-btn.wrong-ans{border-color:var(--red);background:rgba(255,80,112,.1);color:var(--red);}
.tf-btn:disabled{cursor:default;}

/* FT */
.ft-input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;background:rgba(255,255,255,.04);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;color:var(--white);outline:none;transition:all .2s;margin:10px 0;text-align:center;}
.ft-input::placeholder{color:rgba(155,145,204,.4);}
.ft-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accg);}
.ft-input.correct-border{border-color:var(--green);background:rgba(90,245,160,.07);color:var(--green);}
.ft-input.wrong-border{border-color:var(--red);background:rgba(255,80,112,.07);color:var(--red);}

/* FEEDBACK */
.feedback{text-align:center;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:900;padding:12px;border-radius:12px;margin:9px 0;opacity:0;transition:opacity .18s;}
.feedback.show{opacity:1;}
.feedback.correct{color:var(--green);background:rgba(90,245,160,.1);border:1.5px solid rgba(90,245,160,.2);animation:fPop .28s cubic-bezier(.175,.885,.32,1.275);}
.feedback.wrong{color:var(--red);background:rgba(255,80,112,.1);border:1.5px solid rgba(255,80,112,.2);}
@keyframes fPop{0%{transform:scale(.88)}60%{transform:scale(1.05)}100%{transform:scale(1)}}

/* EXPLANATION */
.explanation{background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:.86rem;color:var(--muted);display:none;line-height:1.6;margin-top:7px;}
.explanation.show{display:block;}
.explanation strong{color:var(--white);}

/* SCORE SCREEN */
.big-score{font-family:'Nunito',sans-serif;font-size:3.8rem;font-weight:900;color:var(--acc);text-align:center;line-height:1;margin:8px 0;text-shadow:0 0 28px var(--accg);}
.score-details{display:flex;justify-content:center;gap:22px;margin:12px 0;flex-wrap:wrap;}
.score-detail .lbl{font-size:.65rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.score-detail .val{font-family:'Nunito',sans-serif;font-size:1.35rem;font-weight:900;color:var(--white);}

/* HS */
.hs-list{list-style:none;margin:10px 0;}
.hs-list li{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border);font-size:.9rem;border-radius:8px;transition:background .14s;}
.hs-list li:hover{background:rgba(255,255,255,.04);}
.hs-list li:first-child{background:rgba(255,230,102,.07);border:1px solid rgba(255,230,102,.18);margin-bottom:4px;}
.hs-rank{font-family:'Nunito',sans-serif;font-weight:900;color:var(--gold);width:26px;font-size:1rem;}
.hs-name{flex:1;font-weight:700;color:var(--white);}
.hs-pts{font-family:'Nunito',sans-serif;font-weight:900;color:var(--acc);}
.hs-topic{font-size:.7rem;color:var(--muted);margin-left:8px;}
.empty-hs{text-align:center;color:var(--muted);padding:20px;font-style:italic;}

#saved-profiles{margin:0 0 12px;}
.profile-btn{margin:3px;padding:5px 13px;border:1.5px solid var(--border);background:rgba(255,255,255,.04);border-radius:50px;cursor:pointer;font-family:Nunito,sans-serif;font-size:.85rem;font-weight:700;color:var(--white);transition:all .13s;}
.profile-btn:hover{background:rgba(82,216,255,.1);}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .36s ease;}
.confetti-piece{position:fixed;pointer-events:none;z-index:9999;animation:cFall var(--dur,1.1s) ease-in forwards;}
@keyframes cFall{0%{transform:translateY(-10px) rotate(0) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(540deg) scale(.4);opacity:0}}
.starburst{position:fixed;pointer-events:none;z-index:9999;font-size:1.4rem;animation:sBurst .65s ease-out forwards;}
@keyframes sBurst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.1);opacity:0}}

.topic-score-badge{display:inline-block;padding:3px 10px;border-radius:50px;font-size:.7rem;font-weight:800;}

@media(max-width:500px){.card{padding:22px 16px;}}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="screen-welcome" class="screen active">
  <div class="card">
    <span class="mascot">⚡</span>
    <span class="sub">Fysik · Energi</span>
    <h1><em>Energi</em>Quiz</h1>
    <p style="text-align:center;margin:10px 0 6px;">Svar på spørgsmål fra din fysikbog om energi, energiformer og energikilder!</p>

    <div class="divider"></div>
    <div class="input-group">
      <label>Dit navn</label>
      <input type="text" id="player-name" placeholder="Skriv dit navn…" maxlength="20" autocomplete="off">
    </div>
    <div id="saved-profiles"></div>
    <div class="divider"></div>

    <p style="font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:10px;">Vælg et emne — klare dem i rækkefølge for at låse op:</p>
    <div class="topic-grid" id="topic-grid"></div>

    <div class="divider"></div>
    <div class="action-row">
      <button class="btn btn-ghost" onclick="showScreen('screen-highscore')">🏆 Topscorer</button>
      <button class="btn btn-ghost" onclick="resetProgress()">🔄 Nulstil</button>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="card">
    <div class="hud">
      <div class="hud-chip">
        <span class="lbl">Point</span>
        <span class="val hi" id="q-score">0</span>
      </div>
      <div style="text-align:center;">
        <div id="q-lvl" class="lvl-badge">EMNE 1</div>
        <div style="margin-top:5px;"><span id="q-streak" class="streak-pill">🔥 ×2</span></div>
      </div>
      <div class="hud-chip" style="text-align:right;">
        <span class="lbl">Liv</span>
        <div class="lives" id="q-lives"></div>
      </div>
    </div>
    <div class="timer-wrap"><div class="timer-bar" id="q-timer"></div></div>
    <div class="prog-dots" id="q-dots"></div>

    <div id="q-hint" class="hint-bar" style="display:none;"></div>

    <div class="q-box">
      <div class="q-number" id="q-num">Spørgsmål 1 / 25</div>
      <div class="q-text" id="q-text"></div>
    </div>

    <!-- MC -->
    <div id="q-mc" class="mc-grid"></div>
    <!-- TF -->
    <div id="q-tf" class="tf-row" style="display:none;">
      <button class="tf-btn t-btn" onclick="submitTF(true)">✓ SANDT</button>
      <button class="tf-btn f-btn" onclick="submitTF(false)">✗ FALSK</button>
    </div>
    <!-- FT -->
    <div id="q-ft" style="display:none;">
      <input type="text" class="ft-input" id="q-ft-input" placeholder="Skriv dit svar…" autocomplete="off" spellcheck="false">
    </div>

    <div id="q-feedback" class="feedback"></div>
    <div id="q-explanation" class="explanation"></div>

    <div class="action-row" id="q-actions">
      <button class="btn btn-ghost" onclick="skipQ()">Spring over</button>
    </div>
  </div>
</div>

<!-- TOPIC RESULT -->
<div id="screen-topic-result" class="screen">
  <div class="card" style="text-align:center;">
    <span class="mascot" id="tr-mascot">⚡</span>
    <h2 id="tr-title">Emne klaret!</h2>
    <div class="big-score" id="tr-score">+800</div>
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:12px;font-weight:700;">point</p>
    <div class="score-details" id="tr-details"></div>
    <div class="divider"></div>
    <p id="tr-msg" style="font-weight:700;color:var(--muted);margin-bottom:12px;"></p>
    <div class="action-row">
      <button class="btn btn-primary" id="tr-next-btn">Fortsæt →</button>
      <button class="btn btn-ghost" onclick="showScreen('screen-welcome')">Menu</button>
    </div>
  </div>
</div>

<!-- FINAL RESULT -->
<div id="screen-final" class="screen">
  <div class="card" style="text-align:center;">
    <span style="font-size:5rem;display:block;margin:4px 0;animation:mFloat 3s ease-in-out infinite;filter:drop-shadow(0 4px 20px rgba(255,230,102,.5));">🏆</span>
    <h2>Alle emner klaret!</h2>
    <p id="fi-name" style="color:var(--muted);font-weight:700;margin-bottom:6px;"></p>
    <div class="big-score" id="fi-score">0</div>
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:14px;font-weight:700;">total point</p>
    <div class="score-details" id="fi-details"></div>
    <div id="fi-record" style="font-family:Nunito,sans-serif;font-size:1rem;color:var(--gold);font-weight:900;margin:10px 0;"></div>
    <div class="divider"></div>
    <div class="action-row">
      <button class="btn btn-gold" onclick="showScreen('screen-welcome')">Menu 🏠</button>
      <button class="btn btn-ghost" onclick="showScreen('screen-highscore')">🏆 Topscorer</button>
    </div>
  </div>
</div>

<!-- HIGHSCORE -->
<div id="screen-highscore" class="screen">
  <div class="card">
    <span style="font-size:3.5rem;display:block;text-align:center;margin-bottom:6px;filter:drop-shadow(0 0 16px rgba(255,230,102,.5));">🏆</span>
    <h2>Topscorer</h2>
    <ul class="hs-list" id="hs-list"></ul>
    <div class="divider"></div>
    <div class="action-row">
      <button class="btn btn-primary" onclick="showScreen('screen-welcome')">← Tilbage</button>
      <button class="btn btn-ghost" onclick="clearHS()">Nulstil</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// QUESTION DATA — 25 per topic
// ═══════════════════════════════════════════════════
const TOPICS = [
{
  id:1, name:'Energi & Måleenheder', icon:'📏', color:'--c1', glow:'--c1g',
  mascot:'📐', hint:'Tænk på fysikkens grundbegreber, SI-enheder og energiens måleenhed joule.',
  questions:[

const SK='energyq_save', HK='energyq_hs';
function loadSave(){try{return JSON.parse(localStorage.getItem(SK))||{name:'',done:[],scores:{}};}catch(e){return{name:'',done:[],scores:{}};}}
function writeSave(s){localStorage.setItem(SK,JSON.stringify(s));}
function getHS(){try{return JSON.parse(localStorage.getItem(HK))||[];}catch(e){return[];}}
function saveHS(hs){localStorage.setItem(HK,JSON.stringify(hs));}
function addHS(name,score,topic){const hs=getHS();hs.push({name,score,topic,date:new Date().toLocaleDateString('da-DK')});hs.sort((a,b)=>b.score-a.score);saveHS(hs.slice(0,12));}
function clearHS(){if(confirm('Nulstil topscorer?')){localStorage.removeItem(HK);renderHS();}}
function renderHS(){
  const hs=getHS();const list=document.getElementById('hs-list');
  if(!hs.length){list.innerHTML='<li><div class="empty-hs">Ingen scores endnu!</div></li>';return;}
  const m=['🥇','🥈','🥉'];
  list.innerHTML=hs.map((h,i)=>`<li><span class="hs-rank">${m[i]||(i+1)+'.'}</span><span class="hs-name">${h.name}</span><span class="hs-topic">${h.topic}</span><span class="hs-pts">${h.score.toLocaleString('da')}</span></li>`).join('');
}

let SAVE=loadSave();

// ═══════════════════════════════════════════════════
// PROFILES
// ═══════════════════════════════════════════════════
function getProfiles(){try{return JSON.parse(localStorage.getItem('energyq_profiles'))||[];}catch(e){return[];}}
function saveProfile(n){let ps=getProfiles();ps=[n,...ps.filter(p=>p!==n)].slice(0,5);localStorage.setItem('energyq_profiles',JSON.stringify(ps));}
function renderProfiles(){
  const ps=getProfiles();const el=document.getElementById('saved-profiles');
  if(!ps.length){el.innerHTML='';return;}
  el.innerHTML='<div style="font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;">Tidligere</div>'+
    ps.map(p=>`<button class="profile-btn" onclick="selP('${p}')">${p}</button>`).join('');
}
function selP(n){
  document.getElementById('player-name').value=n;
  SAVE.name=n;
  const prev=JSON.parse(localStorage.getItem(SK+'_'+n)||'null');
  if(prev){SAVE=prev;SAVE.name=n;}
  buildTopicGrid();
}

// ═══════════════════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  if(id==='screen-welcome'){renderProfiles();buildTopicGrid();}
  if(id==='screen-highscore')renderHS();
}

// ═══════════════════════════════════════════════════
// TOPIC GRID
// ═══════════════════════════════════════════════════
const TOPIC_COLORS=[
  {border:'rgba(255,107,157,.5)',bg:'rgba(255,107,157,.08)',acc:'#ff6b9d'},
  {border:'rgba(90,245,160,.5)',bg:'rgba(90,245,160,.08)',acc:'#5af5a0'},
  {border:'rgba(255,170,59,.5)',bg:'rgba(255,170,59,.08)',acc:'#ffaa3b'},
];

function buildTopicGrid(){
  const nameEl=document.getElementById('player-name');
  if(nameEl.value.trim()) SAVE.name=nameEl.value.trim();
  const grid=document.getElementById('topic-grid');
  grid.innerHTML='';
  TOPICS.forEach((topic,i)=>{
    const done=SAVE.done.includes(topic.id);
    const unlocked=i===0||SAVE.done.includes(TOPICS[i-1].id);
    const col=TOPIC_COLORS[i];
    const div=document.createElement('div');
    div.className='topic-card'+(done?' done':'')+((!unlocked&&!done)?' locked':'');
    div.style.borderColor=col.border;
    div.style.background=done?col.bg:'transparent';
    const pts=SAVE.scores[topic.id]||0;
    div.innerHTML=`
      <span class="t-icon">${topic.icon}</span>
      <div class="t-info">
        <h3 style="color:${col.acc};">${topic.name}</h3>
        <p>${topic.questions.length} spørgsmål${pts?' · '+pts.toLocaleString('da')+' point':''}</p>
      </div>
      ${done?`<span class="t-badge done-badge">✓ Klaret</span>`:!unlocked?`<span class="t-badge lock-badge">🔒 Låst</span>`:`<span class="t-badge open-badge" style="border-color:${col.acc};color:${col.acc};">Start →</span>`}`;
    if(unlocked||done) div.onclick=()=>startQuiz(topic.id);
    grid.appendChild(div);
  });
  // Apply first available color
  const nextIdx=TOPICS.findIndex(t=>!SAVE.done.includes(t.id));
  const ci=nextIdx>=0?nextIdx:TOPICS.length-1;
  applyTopicColor(ci);
}

function applyTopicColor(idx){
  const col=TOPIC_COLORS[idx]||TOPIC_COLORS[0];
  document.documentElement.style.setProperty('--acc',col.acc);
  document.documentElement.style.setProperty('--accg',col.border.replace('.5','.35'));
}

// ═══════════════════════════════════════════════════
// QUIZ STATE
// ═══════════════════════════════════════════════════
let QS={topicId:0,questions:[],qIdx:0,score:0,lives:3,streak:0,correct:0,wrong:0,answered:false,timer:null,timeLeft:35};

function startQuiz(topicId){
  const topicIdx=TOPICS.findIndex(t=>t.id===topicId);
  const topic=TOPICS[topicIdx];
  applyTopicColor(topicIdx);

  // Shuffle questions
  const qs=[...topic.questions].sort(()=>Math.random()-.5);
  QS={topicId,questions:qs,qIdx:0,score:0,lives:3,streak:0,correct:0,wrong:0,answered:false,timer:null,timeLeft:35};

  document.getElementById('q-lvl').textContent=`EMNE ${topicId}: ${topic.name.toUpperCase()}`;
  document.getElementById('q-hint').textContent=topic.hint;
  showScreen('screen-quiz');
  loadQuestion();
}

function loadQuestion(){
  clearInterval(QS.timer);
  QS.answered=false;
  const q=QS.questions[QS.qIdx];
  const total=QS.questions.length;

  document.getElementById('q-score').textContent=QS.score.toLocaleString('da');
  document.getElementById('q-num').textContent=`Spørgsmål ${QS.qIdx+1} / ${total}`;
  document.getElementById('q-text').innerHTML=q.q;
  document.getElementById('q-feedback').className='feedback';
  document.getElementById('q-explanation').className='explanation';
  document.getElementById('q-hint').style.display=QS.qIdx===0?'block':'none';

  renderLives();
  renderDots(total,QS.qIdx);
  updateStreak();

  // Areas
  const mc=document.getElementById('q-mc');
  const tf=document.getElementById('q-tf');
  const ft=document.getElementById('q-ft');
  const fti=document.getElementById('q-ft-input');
  const ar=document.getElementById('q-actions');
  mc.style.display='none';tf.style.display='none';ft.style.display='none';

  if(q.t==='mc'){
    mc.style.display='grid';
    const opts=[...q.opts].sort(()=>Math.random()-.5);
    mc.innerHTML=opts.map(o=>`<button class="mc-btn" onclick="submitMC(this,'${o.replace(/'/g,"&#39;").replace(/"/g,"&quot;")}')">${o}</button>`).join('');
    ar.innerHTML=`<button class="btn btn-ghost" onclick="skipQ()">Spring over</button>`;
  } else if(q.t==='tf'){
    tf.style.display='flex';
    tf.querySelectorAll('button').forEach(b=>b.disabled=false);
    ar.innerHTML=`<button class="btn btn-ghost" onclick="skipQ()">Spring over</button>`;
  } else {
    ft.style.display='block';
    fti.value='';fti.className='ft-input';fti.disabled=false;fti.focus();
    ar.innerHTML=`<button class="btn btn-primary" onclick="submitFT()">Tjek ✔</button><button class="btn btn-ghost" onclick="skipQ()">Spring over</button>`;
    fti.onkeydown=e=>{if(e.key==='Enter')submitFT();};
  }

  // Timer
  QS.timeLeft=35;updateTimer();
  QS.timer=setInterval(()=>{QS.timeLeft-=.1;updateTimer();if(QS.timeLeft<=0){clearInterval(QS.timer);timeOut();}},100);
}

// ═══════════════════════════════════════════════════
// ANSWER HANDLERS
// ═══════════════════════════════════════════════════
function submitMC(btn,val){
  if(QS.answered)return;
  clearInterval(QS.timer);QS.answered=true;
  const q=QS.questions[QS.qIdx];
  const ok=(val===q.a);
  document.querySelectorAll('#q-mc .mc-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.a)b.classList.add('correct-ans');
    else if(b===btn&&!ok)b.classList.add('wrong-ans');
  });
  resolve(ok);
}
function submitTF(val){
  if(QS.answered)return;
  clearInterval(QS.timer);QS.answered=true;
  const q=QS.questions[QS.qIdx];
  const ok=(val===q.a);
  document.querySelectorAll('#q-tf .tf-btn').forEach(b=>b.disabled=true);
  document.querySelector(val?'#q-tf .t-btn':'#q-tf .f-btn').classList.add(ok?'correct-ans':'wrong-ans');
  if(!ok)document.querySelector(q.a?'#q-tf .t-btn':'#q-tf .f-btn').classList.add('correct-ans');
  resolve(ok);
}
function submitFT(){
  if(QS.answered)return;
  clearInterval(QS.timer);
  const q=QS.questions[QS.qIdx];
  const fti=document.getElementById('q-ft-input');
  const val=fti.value.trim().toLowerCase();
  const ok=(q.accept||[q.a.toLowerCase()]).map(a=>a.toLowerCase()).includes(val)||q.a.toLowerCase()===val;
  fti.disabled=true;fti.className='ft-input '+(ok?'correct-border':'wrong-border');
  if(!ok)fti.value=q.a;
  QS.answered=true;resolve(ok);
}
function skipQ(){
  if(QS.answered)return;
  clearInterval(QS.timer);QS.answered=true;
  revealQ();
  QS.streak=0;QS.wrong++;if(QS.lives>0)QS.lives--;
  setFB(false,'⏭ Sprunget over');showEx();
  renderLives();updateStreak();markDot(false);
  if(QS.lives<=0){setTimeout(()=>endQuiz(false),2000);return;}
  setTimeout(advance,2400);
}
function timeOut(){
  if(QS.answered)return;QS.answered=true;
  revealQ();
  QS.streak=0;QS.wrong++;if(QS.lives>0)QS.lives--;
  setFB(false,'⏰ Tid udløbet!');showEx();
  renderLives();updateStreak();markDot(false);
  if(QS.lives<=0){setTimeout(()=>endQuiz(false),2000);return;}
  setTimeout(advance,2400);
}
function revealQ(){
  const q=QS.questions[QS.qIdx];
  if(q.t==='mc'){document.querySelectorAll('#q-mc .mc-btn').forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add('correct-ans');});}
  else if(q.t==='tf'){document.querySelectorAll('#q-tf .tf-btn').forEach(b=>b.disabled=true);document.querySelector(q.a?'#q-tf .t-btn':'#q-tf .f-btn').classList.add('correct-ans');}
  else{const fti=document.getElementById('q-ft-input');fti.value=q.a;fti.disabled=true;fti.className='ft-input wrong-border';}
}
function resolve(ok){
  const q=QS.questions[QS.qIdx];
  showEx();
  if(ok){
    QS.streak++;QS.correct++;
    const mult=Math.min(Math.floor(QS.streak/3)+1,5);
    const pts=Math.floor(40*mult+(QS.timeLeft*1.5));
    QS.score+=pts;
    setFB(true,correctMsg(QS.streak));confetti();burst();
  } else {
    QS.streak=0;QS.wrong++;if(QS.lives>0)QS.lives--;
    setFB(false,wrongMsg());
    document.getElementById('q-box')||document.getElementById('q-text').closest('.q-box');
    document.querySelector('.q-box').classList.add('shake');
    setTimeout(()=>document.querySelector('.q-box').classList.remove('shake'),380);
    renderLives();
  }
  document.getElementById('q-score').textContent=QS.score.toLocaleString('da');
  updateStreak();markDot(ok);
  if(QS.lives<=0){setTimeout(()=>endQuiz(false),2200);return;}
  setTimeout(advance,2500);
}
function setFB(ok,msg){const el=document.getElementById('q-feedback');el.className='feedback '+(ok?'correct':'wrong')+' show';el.textContent=msg;}
function showEx(){const q=QS.questions[QS.qIdx];const el=document.getElementById('q-explanation');el.className='explanation show';el.innerHTML=`<strong>Forklaring:</strong> ${q.ex}`;}
function advance(){QS.qIdx++;if(QS.qIdx>=QS.questions.length)endQuiz(true);else loadQuestion();}
function markDot(ok){const d=document.getElementById('q-dots').children;if(d[QS.qIdx])d[QS.qIdx].className='dot '+(ok?'done':'wrong-dot');}

// ═══════════════════════════════════════════════════
// END QUIZ
// ═══════════════════════════════════════════════════
function endQuiz(completed){
  clearInterval(QS.timer);
  const topicIdx=TOPICS.findIndex(t=>t.id===QS.topicId);
  const topic=TOPICS[topicIdx];
  applyTopicColor(topicIdx);

  const nameVal=document.getElementById('player-name').value.trim()||SAVE.name;

  // Save progress if completed
  if(completed){
    if(!SAVE.done.includes(QS.topicId))SAVE.done.push(QS.topicId);
    SAVE.scores[QS.topicId]=(SAVE.scores[QS.topicId]||0)+QS.score;
    SAVE.name=nameVal;
    writeSave(SAVE);
    if(nameVal)localStorage.setItem(SK+'_'+nameVal,JSON.stringify(SAVE));
    addHS(nameVal,QS.score,topic.name);
    saveProfile(nameVal);
  }

  const acc=Math.round(QS.correct/QS.questions.length*100);
  const stars=acc>=90?'⭐⭐⭐':acc>=70?'⭐⭐':'⭐';

  document.getElementById('tr-mascot').textContent=topic.mascot;
  document.getElementById('tr-title').textContent=completed?`${topic.name} klaret! ${stars}`:'Quiz afsluttet';
  document.getElementById('tr-score').textContent='+'+QS.score.toLocaleString('da');
  document.getElementById('tr-details').innerHTML=`
    <div class="score-detail"><div class="lbl">Rigtige</div><div class="val">${QS.correct}/${QS.questions.length}</div></div>
    <div class="score-detail"><div class="lbl">Præcision</div><div class="val">${acc}%</div></div>`;

  const allDone=SAVE.done.length>=TOPICS.length;
  const nextTopic=TOPICS[topicIdx+1];

  if(!completed){
    document.getElementById('tr-msg').textContent='Du løb tør for liv. Prøv igen!';
    document.getElementById('tr-next-btn').textContent='Prøv igen →';
    document.getElementById('tr-next-btn').onclick=()=>startQuiz(QS.topicId);
  } else if(allDone){
    document.getElementById('tr-msg').textContent='🏆 Du har klaret alle emner!';
    document.getElementById('tr-next-btn').textContent='Se endresultat 🏆';
    document.getElementById('tr-next-btn').onclick=showFinalResult;
  } else if(nextTopic){
    document.getElementById('tr-msg').textContent=`✅ Næste emne: ${nextTopic.name}`;
    document.getElementById('tr-next-btn').textContent=`Start: ${nextTopic.name} →`;
    document.getElementById('tr-next-btn').onclick=()=>startQuiz(nextTopic.id);
  } else {
    document.getElementById('tr-next-btn').textContent='Menu';
    document.getElementById('tr-next-btn').onclick=()=>showScreen('screen-welcome');
  }

  if(completed)confetti(true);
  showScreen('screen-topic-result');
}

function showFinalResult(){
  const totalScore=Object.values(SAVE.scores).reduce((a,b)=>a+b,0);
  const name=SAVE.name||document.getElementById('player-name').value.trim();
  document.getElementById('fi-name').textContent=name?`Tillykke, ${name}!`:'';
  document.getElementById('fi-score').textContent=totalScore.toLocaleString('da');
  document.getElementById('fi-details').innerHTML=TOPICS.map(t=>`<div class="score-detail"><div class="lbl">${t.name}</div><div class="val">${(SAVE.scores[t.id]||0).toLocaleString('da')} pt</div></div>`).join('');
  const hs=getHS();const rank=hs.findIndex(h=>h.name===name);
  document.getElementById('fi-record').textContent=rank===0?'🏆 Ny rekord!':rank>0?`#${rank+1} på topscorer-listen`:'';
  confetti(true);showScreen('screen-final');
}

// ═══════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════
function renderLives(){document.getElementById('q-lives').innerHTML=[1,2,3].map(i=>`<span class="heart${i>QS.lives?' lost':''}">❤️</span>`).join('');}
function renderDots(total,current){
  document.getElementById('q-dots').innerHTML=[...Array(total)].map((_,i)=>{let c='dot';if(i<current)c+=' done';else if(i===current)c+=' current';return`<div class="${c}"></div>`;}).join('');
}
function updateTimer(){
  const pct=Math.max(0,(QS.timeLeft/35)*100);
  const bar=document.getElementById('q-timer');bar.style.width=pct+'%';bar.className='timer-bar'+(pct<22?' urgent':'');
}
function updateStreak(){
  const el=document.getElementById('q-streak');
  if(QS.streak>=3){const m=Math.min(Math.floor(QS.streak/3)+1,5);el.textContent=`🔥 ×${m}`;el.className='streak-pill show';}
  else el.className='streak-pill';
}
function correctMsg(s){
  if(s>=9)return'🌟 Du er for sej!';
  if(s>=6)return'💥 Ustoppelig!';
  if(s>=3)return'⚡ Du er for sej!';
  return['✅ Korrekt!','✅ Rigtigt!','✅ Præcist!','✅ Godt klaret!'][Math.floor(Math.random()*4)];
}
function wrongMsg(){return['❌ Ikke helt rigtigt','❌ Desværre forkert','❌ Prøv igen!','❌ Næsten!'][Math.floor(Math.random()*4)];}

// ═══════════════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════════════
function resetProgress(){
  if(!confirm('Nulstil al fremskridt?'))return;
  const n=SAVE.name;SAVE={name:n,done:[],scores:{}};writeSave(SAVE);
  if(n)localStorage.removeItem(SK+'_'+n);
  buildTopicGrid();
}

// ═══════════════════════════════════════════════════
// FX
// ═══════════════════════════════════════════════════
function confetti(big=false){
  const cols=['#ff6b9d','#5af5a0','#ffaa3b','#52d8ff','#c87aff','#ffe566'];
  for(let i=0;i<(big?70:22);i++){
    const el=document.createElement('div');el.className='confetti-piece';const sz=5+Math.random()*8;
    el.style.cssText=`left:${10+Math.random()*80}vw;top:-10px;background:${cols[Math.floor(Math.random()*cols.length)]};width:${sz}px;height:${sz}px;border-radius:${Math.random()>.4?'50%':'2px'};--dur:${.85+Math.random()*.85}s;animation-delay:${Math.random()*.65}s;`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),2200);
  }
}
function burst(){
  const icons=['⭐','✨','💫','🌟','⚡'];
  for(let i=0;i<5;i++){
    const el=document.createElement('div');el.className='starburst';
    const a=(i/5)*Math.PI*2;const d=70+Math.random()*55;
    el.textContent=icons[Math.floor(Math.random()*icons.length)];
    el.style.cssText=`left:50vw;top:50vh;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;animation-delay:${i*.05}s;`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),900);
  }
}
function makeStars(){
  for(let i=0;i<80;i++){
    const s=document.createElement('div');s.className='star';const sz=Math.random()*2+.3;
    s.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;width:${sz}px;height:${sz}px;--d:${2+Math.random()*4}s;--o:${.1+Math.random()*.65};animation-delay:${Math.random()*5}s;`;
    document.body.appendChild(s);
  }
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
window.addEventListener('load',()=>{
  makeStars();SAVE=loadSave();
  if(SAVE.name)document.getElementById('player-name').value=SAVE.name;
  renderProfiles();buildTopicGrid();renderHS();

  document.getElementById('player-name').addEventListener('input',e=>{
    const n=e.target.value.trim();
    if(n){
      const prev=JSON.parse(localStorage.getItem(SK+'_'+n)||'null');
      if(prev){SAVE=prev;SAVE.name=n;}
      else{SAVE.name=n;}
      buildTopicGrid();
    }
  });
  document.getElementById('player-name').addEventListener('keydown',e=>{
    if(e.key==='Enter'){const n=document.getElementById('player-name').value.trim();if(n){SAVE.name=n;saveProfile(n);buildTopicGrid();}}
  });
});
</script>
