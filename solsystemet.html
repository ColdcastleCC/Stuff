<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --accent:#f5c842; --panel-bg:rgba(4,8,28,0.96);
    --fh:'Nunito',sans-serif; --fb:'Nunito Sans',sans-serif;
    --f-xs:clamp(10px,2.2vw,12px); --f-sm:clamp(12px,2.8vw,14px);
    --f-md:clamp(13px,3.2vw,16px); --f-lg:clamp(16px,4.5vw,22px);
    --f-xl:clamp(20px,6vw,32px);
  }
  html,body { width:100%;height:100%;overflow:hidden;background:#04081c;font-family:var(--fb);-webkit-tap-highlight-color:transparent;touch-action:manipulation; }
  #wc { position:relative;width:100dvw;height:100dvh;overflow:hidden; }
  #mapsvg { position:absolute;inset:0;width:100%;height:100%; }

  #char-toggle {
    position:absolute;top:max(10px,env(safe-area-inset-top,10px));
    left:max(10px,env(safe-area-inset-left,10px));
    z-index:25;display:flex;gap:5px;
  }
  .ctbtn {
    font-family:var(--fh);font-weight:700;font-size:clamp(9px,2vw,11px);
    background:rgba(4,8,28,0.85);color:rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.18);border-radius:20px;
    padding:4px 10px;cursor:pointer;transition:all .2s;white-space:nowrap;
  }
  .ctbtn.active { background:rgba(245,200,66,0.18);color:var(--accent);border-color:rgba(245,200,66,0.6); }

  #hint {
    position:absolute;top:max(10px,env(safe-area-inset-top,10px));
    left:50%;transform:translateX(-50%);
    background:rgba(4,8,28,0.85);color:#fff;
    font-family:var(--fh);font-weight:700;font-size:var(--f-xs);
    padding:5px 14px;border-radius:30px;pointer-events:none;
    transition:opacity 0.8s;white-space:nowrap;z-index:20;
    max-width:90vw;text-align:center;border:1px solid rgba(255,255,255,0.1);
  }
  #progress-bar {
    position:absolute;top:max(10px,env(safe-area-inset-top,10px));
    right:max(10px,env(safe-area-inset-right,10px));
    display:flex;gap:4px;align-items:center;z-index:20;
  }
  .prog-dot {
    width:clamp(7px,1.8vw,10px);height:clamp(7px,1.8vw,10px);
    border-radius:50%;background:rgba(255,255,255,0.15);
    border:1.5px solid rgba(255,255,255,0.32);transition:background .3s,border-color .3s;
  }
  .prog-dot.done { background:var(--accent);border-color:var(--accent); }

  #panel {
    position:absolute;bottom:0;left:0;right:0;background:var(--panel-bg);
    border-top:1px solid rgba(255,255,255,0.1);border-radius:18px 18px 0 0;
    padding:14px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom,16px));
    transform:translateY(110%);transition:transform 0.38s cubic-bezier(.22,1,.36,1);
    z-index:30;max-height:68dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #panel.open { transform:translateY(0); }
  #panel::before { content:'';display:block;width:36px;height:4px;background:rgba(255,255,255,0.18);border-radius:2px;margin:0 auto 12px; }

  .p-badge { display:inline-block;font-family:var(--fh);font-weight:700;font-size:var(--f-xs);letter-spacing:.07em;text-transform:uppercase;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.62);padding:2px 9px;border-radius:20px;border:1px solid rgba(255,255,255,0.16);margin-bottom:5px; }
  .p-title { font-family:var(--fh);font-weight:900;font-size:var(--f-lg);color:#fff;margin-bottom:4px;line-height:1.2; }
  .p-desc  { font-size:var(--f-sm);color:rgba(255,255,255,0.78);line-height:1.5;margin-bottom:8px; }
  .p-fact  { font-size:var(--f-xs);color:rgba(255,255,255,0.46);line-height:1.5;padding:7px 0;border-top:1px solid rgba(255,255,255,0.08);border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:10px; }
  .p-fact b { color:rgba(255,255,255,0.82);font-weight:600; }

  /* Quiz progress indicator */
  .q-progress { font-family:var(--fh);font-weight:700;font-size:var(--f-xs);color:rgba(255,255,255,0.35);margin-bottom:6px; }

  .quiz-box { background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.11);border-radius:12px;padding:11px 12px;margin-bottom:10px; }
  .quiz-q   { font-family:var(--fh);font-weight:700;font-size:var(--f-sm);color:#fff;margin-bottom:9px;line-height:1.4; }
  .quiz-opts { display:grid;grid-template-columns:1fr 1fr;gap:6px; }
  .qbtn {
    font-family:var(--fh);font-weight:700;font-size:var(--f-xs);
    background:rgba(255,255,255,0.07);color:#fff;
    border:1px solid rgba(255,255,255,0.16);border-radius:8px;
    padding:9px 6px;cursor:pointer;text-align:center;line-height:1.3;
    min-height:44px;display:flex;align-items:center;justify-content:center;
    transition:background .14s,transform .1s;
  }
  .qbtn:hover:not(:disabled) { background:rgba(255,255,255,0.18); }
  .qbtn:active:not(:disabled) { transform:scale(0.95); }
  .qbtn.correct { background:rgba(50,200,100,0.28);border-color:rgba(50,200,100,0.65); }
  .qbtn.wrong   { background:rgba(220,60,60,0.28); border-color:rgba(220,60,60,0.6); }
  .qbtn:disabled { cursor:default; }
  .quiz-fb { font-size:var(--f-xs);margin-top:8px;padding:8px 10px;border-radius:8px;line-height:1.45;display:none; }
  .quiz-fb.ok { background:rgba(50,200,100,0.15);color:#8affc0; }
  .quiz-fb.no { background:rgba(220,60,60,0.15); color:#ffbebe; }

  .choices { display:none;flex-wrap:wrap;gap:7px; }
  .choices.show { display:flex; }
  .cbtn { font-family:var(--fh);font-weight:700;font-size:var(--f-sm);background:rgba(255,255,255,0.09);color:#fff;border:1px solid rgba(255,255,255,0.22);border-radius:9px;padding:11px 12px;cursor:pointer;flex:1;min-width:120px;min-height:44px;text-align:center;transition:background .14s,transform .1s; }
  .cbtn:hover  { background:rgba(255,255,255,0.2); }
  .cbtn:active { transform:scale(0.96); }

  .stamp { position:absolute;width:clamp(14px,3.5vw,20px);height:clamp(14px,3.5vw,20px);border-radius:50%;background:var(--accent);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,2vw,11px);font-weight:700;color:#04081c;pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:stampIn .4s cubic-bezier(.34,1.56,.64,1) forwards;z-index:25; }
  @keyframes stampIn { to { transform:translate(-50%,-50%) scale(1); } }

  #endscreen { display:none;position:absolute;inset:0;background:rgba(4,8,28,0.97);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;padding-bottom:max(28px,env(safe-area-inset-bottom,28px));z-index:50;overflow-y:auto; }
  #endscreen.show { display:flex; }
  .end-emoji  { font-size:clamp(36px,9vw,58px);margin-bottom:10px; }
  .end-title  { font-family:var(--fh);font-weight:900;font-size:var(--f-xl);color:#fff;margin-bottom:8px; }
  .end-sub    { font-size:var(--f-md);color:rgba(255,255,255,0.65);line-height:1.55;margin-bottom:14px;max-width:380px; }
  .end-score  { font-family:var(--fh);font-weight:900;font-size:clamp(44px,12vw,68px);color:var(--accent);line-height:1; }
  .end-score-label { font-size:var(--f-xs);color:rgba(255,255,255,0.38);margin-bottom:6px; }
  .end-stars  { font-size:clamp(24px,6vw,36px);margin:4px 0 8px; }
  .end-msg    { font-size:var(--f-sm);color:rgba(255,255,255,0.55);max-width:340px;line-height:1.6;margin-bottom:22px; }
  .restart-btn { font-family:var(--fh);font-weight:900;font-size:var(--f-md);background:var(--accent);color:#04081c;border:none;border-radius:12px;padding:14px 36px;cursor:pointer;min-height:52px;transition:background .14s,transform .1s; }
  .restart-btn:hover  { background:#ffe070; }
  .restart-btn:active { transform:scale(0.97); }

  @keyframes pulse   { 0%,100%{opacity:.42}50%{opacity:1} }
  @keyframes twinkle { 0%,100%{opacity:.18}50%{opacity:1} }
  .hs { animation:pulse 2.4s ease-in-out infinite; }
  .s1{animation:twinkle 2.1s ease-in-out infinite;}
  .s2{animation:twinkle 3.4s ease-in-out infinite;}
  .s3{animation:twinkle 1.7s ease-in-out infinite;}
  .s4{animation:twinkle 4.2s ease-in-out infinite;}
  .s5{animation:twinkle 2.8s ease-in-out infinite;}
</style>
</head>

      {q:'Hvad er tykkelsen af Saturns ringe?',opts:['Nogle hundrede meter','10 km','100 km','1.000 km'],c:0,fb:'Saturns ringe er kun nogle få hundrede meter tykke, men millioner af km brede!'},
      {q:'Hvad er et Saturndøgn i jordanske timer?',opts:['10 timer og 33 min','24 timer','48 timer','100 timer'],c:0,fb:'Saturn roterer meget hurtigt — et Saturndøgn varer kun ca. 10 timer og 33 minutter.'},
      {q:'Hvem opdagede Saturns ringe?',opts:['Newton','Galileo Galilei','Huygens','Cassini'],c:1,fb:'Galileo opdagede Saturns ringe i 1610, men det var Huygens der forstod hvad de var.'},
      {q:'Hvad hedder Saturns månede der ligner en "Dødsstjerne"?',opts:['Titan','Enceladus','Mimas','Rhea'],c:2,fb:'Mimas har et gigantisk krater der gør den forvekslelig med Dødsstjernen fra Star Wars.'},
    ],
    choices:[{label:'Videre til Uranus →',next:'uranus'}]
  },

  uranus: {
    x:248,y:174,hsId:'hs-uranus',badge:'Planet 7',title:'Uranus',
    desc:'Uranus er enestående: dens akse er vippet 98°, så den næsten ligger på siden. En pol kan have 42 år med sollys.',
    fact:'<b>Uranus</b> er en isgigant. Metanen giver den sin blågrønne farve. Den har 28 måner og 13 ringe.',
    questions:[
      {q:'Hvorfor er Uranus blågrøn?',opts:['Den er lavet af havvand','Metan absorberer rødt lys','Den reflekterer havet','Grønne planter'],c:1,fb:'Metan i Uranus\' atmosfære absorberer rødt lys og reflekterer blåt og grønt lys.'},
      {q:'Hvor mange grader er Uranus\' akse vippet?',opts:['23 grader','45 grader','73 grader','98 grader'],c:3,fb:'Uranus\' rotationsakse er vippet 98° — den ligger næsten fuldstændigt på siden!'},
      {q:'Hvad er Uranus\' omløbstid om Solen?',opts:['29 år','49 år','84 år','165 år'],c:2,fb:'Uranus bruger 84 jordanske år om at kredse rundt om Solen.'},
      {q:'Hvad er Uranus primært lavet af?',opts:['Gas som Jupiter','Sten og metal','Is: vand, metan og ammoniak','Flydende jern'],c:2,fb:'Uranus er en isgigant — dens indre er primært iskoldt vand, metan og ammoniak.'},
      {q:'Hvilken rumrumsonde besøgte Uranus?',opts:['Voyager 1','Voyager 2','Cassini','Pioneer 11'],c:1,fb:'Voyager 2 er den eneste sonde, der har besøgt Uranus — det skete i 1986.'},
      {q:'Hvad er et specielt træk ved Uranus\' magnetfelt?',opts:['Det er ekstremt svagt','Det er meget stærkt','Det er stærkt skævt i forhold til rotationsaksen','Det er identisk med Jordens'],c:2,fb:'Uranus\' magnetfelt er kraftigt forskudt og skævt i forhold til planetens rotationsakse.'},
      {q:'Hvad hedder Uranus\' største måne?',opts:['Titania','Oberon','Ariel','Miranda'],c:0,fb:'Titania er Uranus\' største måne, opkaldt efter en figur fra Shakespeares "En Skærsommernatsdrøm".'},
      {q:'Hvad er vindhastigheden i Uranus\' atmosfære?',opts:['Op til 100 km/t','Op til 250 km/t','Op til 900 km/t','Op til 2.100 km/t'],c:2,fb:'Vindene på Uranus kan nå op til ca. 900 km/t.'},
      {q:'Hvad er Uranus\' diameter sammenlignet med Jordens?',opts:['2 gange større','4 gange større','10 gange større','20 gange større'],c:1,fb:'Uranus er ca. 4 gange bredere end Jorden i diameter.'},
      {q:'Hvad er årstiderne på Uranus ekstremt på grund af?',opts:['Dens afstand til Solen','Dens tippede akse','Dens manglende atmosfære','Dens ringe'],c:1,fb:'Pga. den tippede akse oplever Uranus ekstreme årstider — polerne kan have 42 år i mørke.'},
    ],
    choices:[{label:'Videre til Neptun →',next:'neptune'}]
  },

  neptune: {
    x:120,y:210,hsId:'hs-neptune',badge:'Planet 8',title:'Neptun',
    desc:'Neptun er den fjerneste og blåeste planet med de kraftigste vinde i solsystemet — op til 2.100 km/t!',
    fact:'<b>Neptun</b>: et år varer 165 jordår. Siden opdagelsen i 1846 har den kun nået ét kredsløb. Triton kredser baglæns.',
    questions:[
      {q:'Hvad er Neptuns vindshastighed?',opts:['Op til 200 km/t','Op til 500 km/t','Op til 1.000 km/t','Op til 2.100 km/t'],c:3,fb:'Neptun har de kraftigste vinde i solsystemet — op til 2.100 km/t!'},
      {q:'Hvad er Neptuns omløbstid om Solen?',opts:['84 år','100 år','165 år','248 år'],c:2,fb:'Neptun bruger 165 jordanske år om at kredse rundt om Solen.'},
      {q:'Hvor lang tid bruger sollys på at nå Neptun?',opts:['8 minutter','1 time','Over 4 timer','1 dag'],c:2,fb:'Lyset fra Solen bruger over 4 timer på rejsen til Neptun.'},
      {q:'Hvad hedder Neptuns største måne?',opts:['Proteus','Nereid','Triton','Larissa'],c:2,fb:'Triton er Neptuns største måne — og den kredser baglæns om planeten.'},
      {q:'Hvad er unikt ved Neptuns måne Triton?',opts:['Den er meget stor','Den er lavet af guld','Den kredser baglæns','Den har en tyk atmosfære'],c:2,fb:'Triton kredser i modsat retning af Neptuns rotation — det er meget sjældent.'},
      {q:'Hvad er Neptuns farve?',opts:['Rød','Grøn','Blå','Gul'],c:2,fb:'Neptun er intenst blå — endnu mere end Uranus — pga. metan i dens atmosfære.'},
      {q:'Hvornår blev Neptun opdaget?',opts:['1776','1846','1930','1989'],c:1,fb:'Neptun blev opdaget i 1846 — baseret på matematiske beregninger af uregelmæssigheder i Uranus\' bane.'},
      {q:'Hvilken sonde har besøgt Neptun?',opts:['Voyager 1','Pioneer 10','Voyager 2','Cassini'],c:2,fb:'Voyager 2 er den eneste sonde, der har besøgt Neptun — det skete i 1989.'},
      {q:'Hvad er et Neptundøgn i jordanske timer?',opts:['10 timer','16 timer','24 timer','48 timer'],c:1,fb:'Et Neptundøgn varer ca. 16 timer — lidt kortere end et jorddøgn.'},
      {q:'Hvad er Neptun klassificeret som?',opts:['Stjernen','En gaskæmpe','En isgigant','En dvergplanet'],c:2,fb:'Neptun er en isgigant (ligesom Uranus), da den indeholder store mængder is og er anderledes end Jupiter og Saturn.'},
    ],
    choices:[{label:'🚀 Tilbage til Solen',next:'sun'}]
  }
};

const ORDER = ['sun','mercury','venus','earth','mars','jupiter','saturn','uranus','neptune'];
const TOTAL_Q = ORDER.length * 10; // 90

/* ══ STATE ══ */
let visited     = new Set();
let qIndex      = {}; // key → current question index (0–9)
let qCorrect    = {}; // key → count correct
let correctTotal= 0;
let animating   = false;
let charMode    = 'rocket';
let posX=400, posY=280;
let trailPoints = [];

ORDER.forEach(k=>{ qIndex[k]=0; qCorrect[k]=0; });

/* ══ ELEMENTS ══ */
const wc      = document.getElementById('wc');
const mapSvg  = document.getElementById('mapsvg');
const rocketEl= document.getElementById('char-rocket');
const astroEl = document.getElementById('char-astronaut');
const panel   = document.getElementById('panel');
const hint    = document.getElementById('hint');
const endSc   = document.getElementById('endscreen');
const progBar = document.getElementById('progress-bar');
const trailG  = document.getElementById('trail');
const flameR  = document.getElementById('rocket-flame');
const flameA  = document.getElementById('astro-flame');

ORDER.forEach(k=>{
  const d=document.createElement('div');
  d.className='prog-dot'; d.id='dot-'+k; progBar.appendChild(d);
});

/* ══ CHARACTER ══ */
function setChar(mode){
  charMode=mode;
  document.getElementById('btn-rocket').classList.toggle('active',mode==='rocket');
  document.getElementById('btn-astronaut').classList.toggle('active',mode==='astronaut');
  rocketEl.style.display = mode==='rocket'?'':'none';
  astroEl.style.display  = mode==='astronaut'?'':'none';
  applyCharTransform(posX,posY,0);
}

function applyCharTransform(x,y,angle){
  const scale = charMode==='rocket' ? 0.55 : 0.5;
  const el = charMode==='rocket' ? rocketEl : astroEl;
  el.setAttribute('transform',`translate(${x},${y}) rotate(${angle}) scale(${scale})`);
}

/* ══ TRAIL ══ */
function addTrailPoint(x,y){
  trailPoints.push({x,y});
  if(trailPoints.length>80)trailPoints.shift();
  redrawTrail();
}
function redrawTrail(){
  trailG.innerHTML='';
  const total=trailPoints.length;
  for(let i=1;i<total;i++){
    const frac=i/total;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',trailPoints[i-1].x); line.setAttribute('y1',trailPoints[i-1].y);
    line.setAttribute('x2',trailPoints[i].x);   line.setAttribute('y2',trailPoints[i].y);
    line.setAttribute('stroke',charMode==='rocket'?'#ff9900':'#88ddff');
    line.setAttribute('stroke-width',frac*2.5);
    line.setAttribute('opacity',frac*0.5);
    line.setAttribute('stroke-linecap','round');
    trailG.appendChild(line);
  }
}
function clearTrail(){ trailPoints=[]; trailG.innerHTML=''; }

/* ══ ANIMATE ══ */
function animateTo(tx,ty,cb){
  if(animating)return; animating=true;
  const sx=posX,sy=posY,dx=tx-sx,dy=ty-sy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const dur=Math.min(2200,Math.max(700,dist*4));
  const t0=performance.now(); let lastTrail=0;
  if(flameR)flameR.style.display=''; if(flameA)flameA.style.display='';
  function step(now){
    const t=Math.min(1,(now-t0)/dur);
    const ease=t<0.5?2*t*t:-1+(4-2*t)*t;
    const arc=Math.sin(t*Math.PI)*Math.min(dist*0.15,38);
    const len=Math.sqrt(dx*dx+dy*dy)||1;
    const px2=-dy/len*arc, py2=dx/len*arc;
    const blend=1-Math.abs(ease*2-1);
    const cx=sx+dx*ease+px2*blend, cy=sy+dy*ease+py2*blend;
    posX=cx; posY=cy;
    const prev_ease=Math.max(0,ease-0.02);
    const vx=cx-(sx+dx*prev_ease), vy=cy-(sy+dy*prev_ease);
    const dynAngle=Math.atan2(vy,vx)*180/Math.PI+90;
    applyCharTransform(cx,cy,dynAngle);
    if(now-lastTrail>28){ addTrailPoint(cx,cy); lastTrail=now; }
    if(t<1) requestAnimationFrame(step);
    else {
      posX=tx; posY=ty; applyCharTransform(tx,ty,0); animating=false;
      if(flameR)flameR.style.display='none'; if(flameA)flameA.style.display='none';
      if(cb)cb();
    }
  }
  requestAnimationFrame(step);
}

/* ══ STAMP ══ */
function svgPct(svgX,svgY){
  const rect=mapSvg.getBoundingClientRect();
  const scale=Math.max(rect.width/800,rect.height/500);
  const offX=(rect.width-800*scale)/2, offY=(rect.height-500*scale)/2;
  return{left:(offX+svgX*scale)+'px',top:(offY+svgY*scale)+'px'};
}
function addStamp(key){
  const s=stages[key],pos=svgPct(s.x,s.y);
  const el=document.createElement('div');
  el.className='stamp'; el.id='stamp-'+key; el.textContent='✓';
  el.style.left=pos.left; el.style.top=pos.top; wc.appendChild(el);
}
function markDot(key){ const d=document.getElementById('dot-'+key); if(d)d.classList.add('done'); }

/* ══ WIN CHECK ══ */
function checkAllDone(){
  const allVisited=visited.size>=ORDER.length;
  const allAnswered=ORDER.every(k=>qIndex[k]>=10);
  if(!allVisited||!allAnswered)return;
  setTimeout(()=>{
    panel.classList.remove('open');
    const pct=Math.round(correctTotal/TOTAL_Q*100);
    document.getElementById('end-score').textContent=correctTotal+'/'+TOTAL_Q;
    let stars,msg;
    if(pct===100)    {stars='⭐⭐⭐';msg='Perfekt score! Du er en ægte rumforsker og kender alle hemmelighederne om solsystemet!';}
    else if(pct>=70) {stars='⭐⭐'; msg='Fremragende! Du ved rigtig meget om solsystemet. Prøv igen for at slå din rekord!';}
    else             {stars='⭐';   msg='God indsats! Prøv igen og bliv endnu klogere på planeterne og Solen.';}
    document.getElementById('end-stars').textContent=stars;
    document.getElementById('end-msg').textContent=msg;
    endSc.classList.add('show');
  },700);
}

/* ══ SHOW STAGE ══ */
function showStage(key){
  const s=stages[key];
  const isNew=!visited.has(key);
  if(isNew){ visited.add(key); addStamp(key); markDot(key); }
  hint.style.opacity='0';

  const qi=qIndex[key]; // which question to show (0–9)
  const allDone=(qi>=10);
  const s_choices=s.choices.map(c=>`<button class="cbtn" onclick="goTo('${c.next}')">${c.label}</button>`).join('');

  let quizSection='', choicesClass='choices show';
  if(!allDone){
    const q=s.questions[qi];
    const optsHTML=q.opts.map((o,i)=>`<button class="qbtn" id="qo${i}" onclick="answerQ('${key}',${i},${q.c})">${o}</button>`).join('');
    quizSection=`
      <div class="q-progress">Spørgsmål ${qi+1} af 10</div>
      <div class="quiz-box">
        <div class="quiz-q">🧠 ${q.q}</div>
        <div class="quiz-opts">${optsHTML}</div>
        <div class="quiz-fb" id="qfb"></div>
      </div>`;
    choicesClass='choices'; // hidden until answered
  } else {
    quizSection=`<div class="quiz-box" style="opacity:.4"><div class="quiz-q" style="font-size:var(--f-xs)">✓ Alle 10 spørgsmål besvaret — ${qCorrect[key]}/10 rigtige</div></div>`;
  }

  panel.innerHTML=`
    <div class="p-badge">${s.badge}</div>
    <div class="p-title">${s.title}</div>
    <div class="p-desc">${s.desc}</div>
    <div class="p-fact">${s.fact}</div>
    ${quizSection}
    <div class="${choicesClass}" id="choices-wrap">${s_choices}</div>
  `;
  panel.classList.add('open');
  panel.scrollTop=0;
}

/* ══ ANSWER QUESTION ══ */
function answerQ(key,chosen,correct){
  document.querySelectorAll('.qbtn').forEach((b,i)=>{
    b.disabled=true;
    if(i===correct)b.classList.add('correct');
    else if(i===chosen&&chosen!==correct)b.classList.add('wrong');
  });
  const fb=document.getElementById('qfb');
  const q=stages[key].questions[qIndex[key]];
  if(chosen===correct){
    correctTotal++; qCorrect[key]++;
    fb.className='quiz-fb ok'; fb.textContent='✅ '+q.fb;
  } else {
    fb.className='quiz-fb no'; fb.textContent='❌ Ikke helt. '+q.fb;
  }
  fb.style.display='block';
  qIndex[key]++;
  setTimeout(()=>{
    const cw=document.getElementById('choices-wrap');
    if(cw)cw.classList.add('show');
    checkAllDone();
  },900);
}

/* ══ GO TO ══ */
function goTo(key){
  panel.classList.remove('open');
  clearTrail();
  setTimeout(()=>animateTo(stages[key].x,stages[key].y,()=>showStage(key)),220);
}

/* ══ RESTART ══ */
function restartGame(){
  visited.clear(); correctTotal=0;
  ORDER.forEach(k=>{ qIndex[k]=0; qCorrect[k]=0; });
  document.querySelectorAll('.stamp').forEach(e=>e.remove());
  ORDER.forEach(k=>{ const d=document.getElementById('dot-'+k); if(d)d.classList.remove('done'); });
  endSc.classList.remove('show'); panel.classList.remove('open'); panel.innerHTML='';
  hint.style.opacity='1'; clearTrail();
  posX=400; posY=280; applyCharTransform(400,280,0);
  if(flameR)flameR.style.display='none'; if(flameA)flameA.style.display='none';
  setTimeout(()=>{ animateTo(400,280,()=>showStage('sun')); setTimeout(()=>{hint.style.opacity='0';},3500); },350);
}

/* ══ HOTSPOTS ══ */
Object.entries(stages).forEach(([key,s])=>{
  const el=document.getElementById(s.hsId); if(!el)return;
  const h=()=>{ if(animating)return; panel.classList.remove('open'); clearTrail(); setTimeout(()=>animateTo(s.x,s.y,()=>showStage(key)),120); };
  el.addEventListener('click',h);
  el.addEventListener('touchend',e=>{e.preventDefault();h();},{passive:false});
});

/* ══ RESIZE ══ */
window.addEventListener('resize',()=>{
  ORDER.forEach(k=>{
    const el=document.getElementById('stamp-'+k);
    if(!el||!visited.has(k))return;
    const pos=svgPct(stages[k].x,stages[k].y);
    el.style.left=pos.left; el.style.top=pos.top;
  });
});

/* ══ INIT ══ */
if(flameR)flameR.style.display='none'; if(flameA)flameA.style.display='none';
astroEl.style.display='none';
applyCharTransform(400,280,0);
setTimeout(()=>{ animateTo(400,280,()=>showStage('sun')); setTimeout(()=>{hint.style.opacity='0';},3500); },700);
</script>
