<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transport & Økonomi Træner — 10. klasse</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e1117;--panel:#161b27;--card:#1c2333;--border:#2a3344;
  --green:#00e676;--green2:#69f0ae;--yellow:#ffeb3b;--orange:#ff9800;
  --red:#f44336;--blue:#42a5f5;
  --white:#e8eaf0;--muted:#8892a4;--muted2:#545e6f;
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fm:'JetBrains Mono',monospace;
  --xs:clamp(10px,2.2vw,12px);--sm:clamp(12px,2.7vw,14px);--md:clamp(14px,3.2vw,16px);
  --lg:clamp(18px,4.2vw,22px);--xl:clamp(24px,5.5vw,32px);--xxl:clamp(32px,8vw,52px);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--fb);-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;color:var(--white);}
.scr{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;overflow-y:auto;}
.scr.on{display:flex;}

/* HOME */
#s-home{background:linear-gradient(160deg,#0e1117 0%,#111827 100%);align-items:center;justify-content:flex-start;padding:20px 14px 50px;}
.home-hero{width:100%;max-width:520px;margin:0 auto 22px;text-align:center;}
.hero-eye{font-family:var(--fm);font-size:var(--xs);color:var(--green);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;}
.hero-h{font-family:var(--fh);font-weight:900;font-style:italic;font-size:var(--xxl);color:var(--white);line-height:.95;letter-spacing:-.01em;margin-bottom:6px;}
.hero-h .acc{color:var(--green);}
.hero-sub{font-size:var(--sm);color:var(--muted);line-height:1.65;max-width:380px;margin:0 auto 20px;}
.xp-wrap{background:rgba(255,255,255,.07);border-radius:4px;height:8px;width:100%;max-width:300px;margin:0 auto 6px;overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:4px;transition:width .5s;}
.xp-lbl{font-family:var(--fm);font-size:var(--xs);color:var(--muted);margin-bottom:20px;}
.mgrid{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px;}
.mcard{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:15px 17px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;}
.mcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green);transform:scaleY(0);transition:transform .15s;transform-origin:bottom;}
.mcard:hover:not(.locked)::before{transform:scaleY(1);}
.mcard:hover:not(.locked){border-color:rgba(0,230,118,.3);background:rgba(0,230,118,.04);}
.mcard.locked{opacity:.4;cursor:default;}
.mcard.done{border-color:rgba(0,230,118,.25);background:rgba(0,230,118,.03);}
.mcard.done::before{transform:scaleY(1);}
.mc-icon{font-size:clamp(24px,6vw,34px);flex-shrink:0;line-height:1;}
.mc-info{flex:1;min-width:0;}
.mc-num{font-family:var(--fm);font-size:var(--xs);color:var(--green);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;}
.mc-title{font-family:var(--fh);font-weight:700;font-size:var(--lg);color:var(--white);margin-bottom:2px;}
.mc-desc{font-size:var(--xs);color:var(--muted);line-height:1.4;}
.mc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.tag{font-family:var(--fm);font-size:clamp(7px,1.6vw,9px);border:1px solid var(--border);border-radius:3px;padding:2px 8px;color:var(--muted2);}
.mc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.mc-xp{font-family:var(--fm);font-size:var(--xs);color:var(--yellow);}
.mc-status{font-size:16px;}

/* MISSION */
#s-mission{background:var(--bg);}
.mtop{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);border-bottom:1px solid var(--border);padding:8px 14px;flex-shrink:0;padding-top:max(8px,env(safe-area-inset-top,8px));backdrop-filter:blur(10px);}
.bk{font-family:var(--fm);font-size:var(--xs);color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:5px;padding:6px 12px;cursor:pointer;}
.bk:hover{color:var(--white);}
.mtop-title{font-family:var(--fh);font-weight:700;font-size:var(--md);color:var(--white);flex:1;text-align:center;}
.mtop-ctr{font-family:var(--fm);font-size:var(--xs);color:var(--muted);}
.sprog{display:flex;gap:5px;padding:8px 14px;background:rgba(0,0,0,.3);flex-shrink:0;flex-wrap:wrap;}
.sp{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);transition:all .3s;}
.sp.ok{background:var(--green);}
.sp.cur{background:rgba(0,230,118,.4);animation:bl .8s ease-in-out infinite alternate;}
@keyframes bl{from{opacity:.5}to{opacity:1}}
.qscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 30px;}
.qarea{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}

/* Cards */
.ctx-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
.ctx-head{font-family:var(--fm);font-size:var(--xs);color:var(--green);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.ctx-body{font-size:var(--sm);color:var(--white);line-height:1.7;}
.ctx-body b{color:var(--green2);}
.ctx-body code{font-family:var(--fm);background:rgba(0,230,118,.08);color:var(--green2);padding:1px 6px;border-radius:3px;font-size:var(--xs);}
.dtbl{width:100%;border-collapse:collapse;margin-top:10px;font-family:var(--fm);font-size:var(--xs);}
.dtbl th{background:rgba(0,230,118,.08);color:var(--green);text-align:left;padding:6px 10px;border-bottom:1px solid rgba(0,230,118,.2);}
.dtbl td{padding:5px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--white);}
.dtbl .hi{background:rgba(0,230,118,.1);color:var(--green2);font-weight:700;}
.qq-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;}
.qq-num{font-family:var(--fm);font-size:var(--xs);color:var(--muted);margin-bottom:6px;}
.qq-text{font-family:var(--fh);font-weight:700;font-size:var(--lg);color:var(--white);line-height:1.35;margin-bottom:10px;}
.qq-hint{font-size:var(--xs);color:var(--muted);font-style:italic;margin-bottom:10px;line-height:1.5;}

/* MC */
.mc-opts{display:flex;flex-direction:column;gap:8px;}
.mco{border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.03);padding:12px 15px;cursor:pointer;font-size:var(--sm);color:rgba(255,255,255,.85);text-align:left;transition:all .13s;display:flex;align-items:flex-start;gap:10px;line-height:1.4;}
.mco:hover:not(:disabled){border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.06);}
.mco.ok{background:rgba(0,230,118,.12);border-color:rgba(0,230,118,.5);color:var(--green2);}
.mco.no{background:rgba(244,67,54,.08);border-color:rgba(244,67,54,.4);color:#ff8a80;}
.mco:disabled{cursor:default;}
.mco-k{font-family:var(--fm);font-size:var(--xs);color:var(--muted2);min-width:18px;flex-shrink:0;padding-top:1px;}

/* Num */
.nrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.nlbl{font-family:var(--fm);font-size:var(--sm);color:var(--muted);}
.ninp{font-family:var(--fm);font-weight:700;font-size:var(--xl);width:clamp(110px,28vw,170px);background:rgba(0,230,118,.06);border:2px solid rgba(0,230,118,.3);border-radius:7px;color:var(--green2);text-align:center;padding:10px 8px;outline:none;-webkit-appearance:none;transition:all .18s;}
.ninp:focus{border-color:var(--green);background:rgba(0,230,118,.1);box-shadow:0 0 16px rgba(0,230,118,.15);}
.ninp.ok{border-color:var(--green);}
.ninp.no{border-color:var(--red);animation:sh .3s ease;}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Feedback */
.fb{border-radius:10px;padding:14px 16px;display:none;}
.fb.ok{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.25);display:block;}
.fb.no{background:rgba(244,67,54,.07);border:1px solid rgba(244,67,54,.2);display:block;}
.fb-verdict{font-family:var(--fh);font-weight:700;font-size:var(--lg);margin-bottom:8px;}
.fb-verdict.ok{color:var(--green);}
.fb-verdict.no{color:var(--red);}
.fb-exp{font-size:var(--sm);color:rgba(255,255,255,.82);line-height:1.7;margin-bottom:10px;}
.fb-exp b{color:var(--white);}
.fb-exp code{font-family:var(--fm);background:rgba(0,230,118,.1);color:var(--green2);padding:1px 6px;border-radius:3px;}
.why{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:8px;}
.why-h{font-family:var(--fm);font-size:var(--xs);color:var(--yellow);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.why-b{font-size:var(--sm);color:rgba(255,255,255,.72);line-height:1.7;}
.why-b b{color:var(--white);}

.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.chkbtn{font-family:var(--fh);font-weight:700;font-size:var(--md);letter-spacing:.04em;background:var(--green);color:#001a0d;border:none;border-radius:8px;padding:12px 36px;cursor:pointer;transition:all .13s;}
.chkbtn:hover{background:var(--green2);}
.chkbtn:disabled{opacity:.3;cursor:default;}
.nxtbtn{font-family:var(--fh);font-weight:700;font-size:var(--md);letter-spacing:.04em;background:rgba(255,255,255,.08);color:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px 32px;cursor:pointer;display:none;transition:all .13s;}
.nxtbtn.on{display:inline-block;}
.nxtbtn:hover{background:rgba(255,255,255,.14);}

/* DONE */
#s-done{background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:24px;}
.dtrophy{font-size:clamp(60px,15vw,90px);margin-bottom:14px;animation:bonce 1.2s ease infinite alternate;}
@keyframes bonce{from{transform:translateY(0) scale(1)}to{transform:translateY(-10px) scale(1.05)}}
.done-h{font-family:var(--fh);font-weight:900;font-style:italic;font-size:var(--xxl);color:var(--white);margin-bottom:6px;line-height:.95;}
.done-h .acc{color:var(--green);}
.done-sc{font-family:var(--fm);font-size:var(--xl);color:var(--yellow);margin-bottom:12px;}
.done-msg{font-size:var(--md);color:var(--muted);max-width:380px;line-height:1.65;margin-bottom:26px;}
.done-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.dbtn{font-family:var(--fh);font-weight:700;font-size:var(--md);border:none;border-radius:8px;padding:13px 36px;cursor:pointer;letter-spacing:.04em;}
.dbtn.p{background:var(--green);color:#001a0d;}
.dbtn.s{background:rgba(255,255,255,.08);color:var(--white);border:1px solid var(--border);}
</style>
</head>
<body>

<div class="scr on" id="s-home">
  <div class="home-hero">
    <div class="hero-eye">🚗 10. klasse · Eksamensforberedelse</div>
    <h1 class="hero-h">TRANSPORT &<br><span class="acc">ØKONOMI</span></h1>
    <p class="hero-sub">Træn de matematiske færdigheder du skal bruge når du sammenligner udgifter, beregner renter og laver budgetter til eksamen.</p>
    <div class="xp-wrap"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
    <div class="xp-lbl" id="xp-lbl">0 XP — Begynder</div>
  </div>
  <div class="mgrid" id="mgrid"></div>
</div>

<div class="scr" id="s-mission">
  <div class="mtop">
    <button class="bk" onclick="goHome()">← Hjem</button>
    <div class="mtop-title" id="mtop-title">–</div>
    <div class="mtop-ctr" id="mtop-ctr">1/1</div>
  </div>
  <div class="sprog" id="sprog"></div>
  <div class="qscroll">
    <div class="qarea" id="qarea"></div>
  </div>
</div>

<div class="scr" id="s-done">
  <div class="dtrophy">🏆</div>
  <h2 class="done-h">MISSION<br><span class="acc">KLARET!</span></h2>
  <div class="done-sc" id="done-sc">–</div>
  <p class="done-msg" id="done-msg">–</p>
  <div class="done-btns">
    <button class="dbtn p" onclick="goHome()">← Vælg ny mission</button>
    <button class="dbtn s" onclick="retryMission()">↺ Prøv igen</button>
  </div>
</div>

<script>
const r2=x=>Math.round(x*100)/100;
const r0=x=>Math.round(x);

/* ═══════════════════════════════════════════════
   MISSIONER
═══════════════════════════════════════════════ */
const MISSIONS = [

/* ── MISSION 1: Brændstofomkostning pr. km ── */
{
  id:0, icon:'⛽', title:'Drivmiddelomkostning pr. km', xp:150,
  desc:'Beregn hvad det koster at køre 1 km med forskelligt brændstof og hastighed',
  tags:['Forbrug pr. km','Pris pr. enhed','Hastighed','Procent'],
  steps:[
    {
      type:'num',
      ctx:`<div class="ctx-head">⛽ Scenario — To køretøjer</div>
        <div class="ctx-body">Du skal beregne driftsomkostninger for to scootere.<br><br>
        <table class="dtbl">
          <tr><th>Drivmiddel</th><th>Pris pr. enhed</th><th>Forbrug pr. 100 km</th></tr>
          <tr><td>Benzin</td><td><b>14,50 kr./liter</b></td><td><b>4,20 liter</b></td></tr>
          <tr><td>El</td><td><b>2,10 kr./kWh</b></td><td><b>8,50 kWh</b></td></tr>
        </table><br>
        Hvad koster det at køre <b>100 km</b> på benzin?</div>`,
      q:'Hvad koster 100 km på benzin? (afrund til 2 decimaler)',
      hint:'Pris = forbrug × pris pr. enhed = 4,20 liter × 14,50 kr./liter',
      label:'100 km koster:', unit:'kr.',
      correct:r2(4.20*14.50), tol:0.05,
      fb:{v:`Korrekt! 4,20 × 14,50 = ${r2(4.20*14.50)} kr. ✓`,
        e:`Pris pr. 100 km = forbrug × pris pr. enhed = 4,20 L × 14,50 kr./L = <b>${r2(4.20*14.50)} kr.</b>`,
        w:'<b>Sådan beregner man brændstofomkostning:</b><br>Formlen er simpel: <code>pris = forbrug pr. 100 km × pris pr. enhed</code>. Det giver prisen for 100 km. For at finde prisen pr. km dividerer man med 100. Til eksamen skal du altid <b>vise mellemregningerne</b> — skriv enheder med (liter, kr./liter) så det er klart hvad du ganger med hvad.'}
    },
    {
      type:'num',
      ctx:`<div class="ctx-head">⚡ Pris pr. km — El</div>
        <div class="ctx-body">El: <b>2,10 kr./kWh</b> · Forbrug: <b>8,50 kWh/100 km</b><br><br>
        Vi vil finde prisen pr. <b>enkelt kilometer</b> (ikke pr. 100 km).</div>`,
      q:'Hvad koster det at køre 1 km på el? (i kr., afrund til 4 decimaler)',
      hint:'Pris pr. 100 km = 8,50 × 2,10. Divider med 100 for at få pris pr. km.',
      label:'1 km koster:', unit:'kr.',
      correct:r2(8.50*2.10/100*10000)/10000, tol:0.0005,
      fb:{v:`Korrekt! ≈ ${r2(8.50*2.10/100*10000)/10000} kr./km ✓`,
        e:`Pris/100km = 8,50 × 2,10 = ${r2(8.50*2.10)} kr. → pr. km: ${r2(8.50*2.10)} ÷ 100 = <b>${r2(8.50*2.10/100*10000)/10000} kr./km</b>`,
        w:'<b>Pris pr. km — den vigtige sammenligningsenhed:</b><br>Når vi vil sammenligne to køretøjer er prisen pr. km den nøgletal vi bruger. Det giver os mulighed for at gange med <b>det faktiske antal km</b> vi kører om året og få den samlede driftsudgift. Husk at km-prisen er meget lille (brøkdel af en krone) — brug gerne 4 decimaler for præcision, og vis den i øre (× 100) for at gøre den overskuelig.'}
    },
    {
      type:'mc',
      ctx:`<div class="ctx-head">🔢 Sammenlign pr. km</div>
        <div class="ctx-body">Beregnet pr. km (ved normal hastighed):<br>
        Benzin: <code>${r2(4.20*14.50)} kr./100km = ${r2(4.20*14.50/100*100)/100} kr./km</code><br>
        El: <code>${r2(8.50*2.10)} kr./100km = ${r2(8.50*2.10/100*100)/100} kr./km</code></div>`,
      q:'Hvad er den korrekte konklusion?',
      opts:[
        'El er dyrere pr. km end benzin',
        `El er billigere pr. km — ${r2(8.50*2.10/100*100)/100} kr. mod ${r2(4.20*14.50/100*100)/100} kr.`,
        'De er præcis lige dyre pr. km',
        'Man kan ikke sammenligne de to'
      ],
      correct:1,
      fb:{v:'Korrekt! El er billigere pr. km ✓',
        e:`El: ${r2(8.50*2.10/100*100)/100} kr./km · Benzin: ${r2(4.20*14.50/100*100)/100} kr./km → El er ${r2((4.20*14.50-8.50*2.10)/100*100)/100} kr./km billigere.`,
        w:'<b>Pris pr. km er udgangspunktet — men ikke hele billedet:</b><br>At el er billigere pr. km er kun ét aspekt. For at finde ud af om det <b>samlet set</b> kan betale sig at skifte til el, skal vi også medregne anskaffelsespris, forsikring, service og eventuelle lånomkostninger. Det er det samlede budget over fx 5 år der er afgørende — ikke kun drivmiddelomkostningen.'}
    },
    {
      type:'num',
      ctx:`<div class="ctx-head">📈 Forbruget stiger ved høj hastighed</div>
        <div class="ctx-body">Ved høj hastighed stiger forbruget:<br>
        <b>Benzinforbruget stiger 18%</b> fra lav til høj hastighed.<br>
        Normal benzinforbrug ved lav hastighed: <b>4,20 liter/100km</b></div>`,
      q:'Hvad er benzinforbruget pr. 100 km ved høj hastighed? (1 decimal)',
      hint:'Nyt forbrug = gammelt forbrug × (1 + 0,18) = 4,20 × 1,18',
      label:'Forbrug:', unit:'liter/100km',
      correct:r2(4.20*1.18*10)/10, tol:0.05,
      fb:{v:`Korrekt! 4,20 × 1,18 = ${r2(4.20*1.18*10)/10} liter/100km ✓`,
        e:`Nyt forbrug = 4,20 × 1,18 = <b>${r2(4.20*1.18*10)/10} liter/100km</b><br>Meromkostning pr. 100 km: ${r2((4.20*1.18-4.20)*14.50*100)/100} kr. ekstra`,
        w:'<b>Procentvis stigning i forbrug:</b><br>Formlen for en procentvis stigning er: <code>nyt = gammelt × (1 + p/100)</code>. En stigning på 18% giver faktoren 1,18. Dette er den samme formel som bruges til renteberegning og vækst! Til eksamen er det vigtigt at <b>argumentere for hvornår den høje hastighed er relevant</b> — kører man primært på motorvej eller landevej? Det ændrer konklusionen.'}
    },
  ]
},

/* ── MISSION 2: Sammensatte ruteomkostninger ── */
{
  id:1, icon:'🗺️', title:'Ruter & Samlede Transportudgifter', xp:200,
  desc:'Beregn og sammenlign den samlede årlige udgift for to forskellige ruter',
  tags:['Årsudgift','Rute','Km-pris','Antal dage'],
  steps:[
    {
      type:'num',
      ctx:`<div class="ctx-head">🗺️ To ruter til arbejde</div>
        <div class="ctx-body">En medarbejder kører til arbejde <b>210 dage om året</b>.<br><br>
        <table class="dtbl">
          <tr><th>Rute</th><th>Distance</th><th>Primær hastighed</th></tr>
          <tr><td><b>Rute A — Motorvej</b></td><td><b>62 km</b></td><td>110 km/t</td></tr>
          <tr><td><b>Rute B — Landevej</b></td><td><b>54 km</b></td><td>80 km/t</td></tr>
        </table><br>
        Benzinpris: <b>16,20 kr./liter</b> · Forbrug ved 80 km/t: <b>5,00 liter/100km</b><br>
        <b>Benzinforbruget stiger 22%</b> fra 80 til 110 km/t.<br><br>
        Hvad koster en enkelt tur på <b>Rute A</b> i brændstof?</div>`,
      q:'Hvad koster én tur på Rute A (motorvej, 62 km) i benzin? (1 decimal)',
      hint:'Forbrug 110 km/t = 5,00 × 1,22. Pris = (forbrug/100) × 62 × 16,20',
      label:'Én tur:', unit:'kr.',
      correct:r2(5.00*1.22/100*62*16.20*10)/10, tol:0.2,
      fb:{v:`Korrekt! ≈ ${r2(5.00*1.22/100*62*16.20*10)/10} kr. ✓`,

      correct:1,
      fb:{v:`Korrekt! Breakeven ved ${r0(7000/0.64)} km/år ✓`,

        w:'<b>Breakeven-analyse — ligningsløsning:</b><br>Opstil en ligning hvor de to samlede udgifter sættes lig hinanden: <code>Fast_A + km-pris_A × km = Fast_B + km-pris_B × km</code>. Isolér km-leddet ved at samle km på én side. Dette er en lineær ligning med én ubekendt — præcis som i algebraundervisningen! Til eksamen skal du <b>vise alle mellemregninger</b> og konkludere: "Kører man mere end ${r0(7000/0.64)} km/år, er Option A billigst."'}

      hint:'18.000 − 8.000 = (0,95 − 0,22) · km → 10.000 = 0,73 · km → km = ?',
      label:'Breakeven:', unit:'km/år',
      correct:Math.round(10000/0.73/100)*100, tol:50,
      fb:{v:`Korrekt! ≈ ${Math.round(10000/0.73/100)*100} km/år ✓`,
        e:`10.000 = 0,73 · km → km = 10.000 ÷ 0,73 = ${r2(10000/0.73)} ≈ <b>${Math.round(10000/0.73/100)*100} km/år</b>`,
        w:'<b>Fortolkning af breakeven:</b><br>"Kører man under ${Math.round(10000/0.73/100)*100} km/år, er Option Y billigst (lavere faste udgifter). Kører man mere end ${Math.round(10000/0.73/100)*100} km/år, er Option X billigst (lavere km-pris dominerer)." Denne formulering viser at du kan <b>fortolke dit matematiske resultat</b> i kontekst — det er højt vurderet til eksamen.'}
    },
    {
      type:'mc',
      ctx:`<div class="ctx-head">📊 Grafisk fortolkning</div>
        <div class="ctx-body">To lineære funktioner (samlede udgifter):<br>
        f(km) = 18.000 + 0,22·km  (Option X — stejl linje starter højt)<br>
        g(km) = 8.000 + 0,95·km   (Option Y — stiger hurtigere)<br><br>
        Linjerne skærer hinanden ved breakeven-punktet ≈ ${Math.round(10000/0.73/100)*100} km/år.</div>`,
      q:'Hvad viser det grafisk når Option Y\'s linje er stejlere end Option X\'s?',
      opts:[
        'Option Y er altid billigst',
        'Option Y har højere km-pris (hældningskoefficient) — udgiften stiger hurtigere pr. ekstra km',
        'Option X skærer y-aksen lavest og er altid billigst',
        'De to linjer løber parallelt og skærer aldrig hinanden'
      ],
      correct:1,
      fb:{v:'Korrekt! Hældningen er km-prisen ✓',
        e:'En stejlere linje = højere hældningskoefficient = højere km-pris. Jo flere km man kører, jo mere slår det ud.',
        w:'<b>Lineære funktioner i en transportanalyse:</b><br>Samlede udgifter = <b>skæring med y-aksen</b> (faste udgifter) + <b>hældning</b> × km (variable udgifter pr. km). Den lineære model er nyttig fordi vi kan tegne grafen, aflæse skæringspunktet (breakeven) og se tydeligt hvornår en option er billigst. Til eksamen: tegn de to linjer og marker breakeven-punktet — det er en stærk visuel argumentation.'}
    },
    {
      type:'mc',
      ctx:`<div class="ctx-head">🎓 Samlet analyse — hvad skal man med i overvejelsen?</div>
        <div class="ctx-body">Du skal nu sammenfatte en analyse af hvornår Option X (høj fast udgift, billig pr. km) kan betale sig frem for Option Y.<br><br>
        Breakeven: <b>${Math.round(10000/0.73/100)*100} km/år</b><br>
        Familien kører aktuelt <b>16.000 km/år</b></div>`,
      q:'Hvilke faktorer BØR med i den samlede vurdering? (vælg det mest fyldestgørende svar)',
      opts:[
        'Kun breakeven-punktet er relevant',
        'Breakeven, fremtidig kørselsmønster, om antal km kan ændre sig, og tidshorisont for investering',
        'Kun det første år er relevant — derefter er alt uvist',
        'Kun forsikring og service — brændstof er uvæsentligt'
      ],
      correct:1,
      fb:{v:'Excellent helhedsforståelse! 🏆',
        e:`16.000 km > ${Math.round(10000/0.73/100)*100} km breakeven → Option X er billigst ved dette kørselsniveau. Men hvad nu hvis kørselsmønstret ændrer sig?`,
        w:'<b>Den komplette eksamenssvar-struktur for en sammenligningsanalyse:</b><br>1. <b>Beregn km-priser</b> for begge alternativer<br>2. <b>Opstil fulde årsbudgetter</b> (faste + variable)<br>3. <b>Find breakeven-punkt</b> (sæt lig hinanden, løs for km)<br>4. <b>Sammenlign</b> med det faktiske kørselsmønster<br>5. <b>Diskutér usikkerheder:</b> Priser på brændstof kan ændre sig. Kørselsmønstret kan ændre sig. Tidshorisonten for lånet udløber. Ferie og ekstraordinær kørsel.<br><br>En elev der inddrager alle disse punkter viser modellerings- og ræsonnementskompetence på højt niveau.'}

];

/* ═══════════════════════════════════════════
   SAVE / XP
═══════════════════════════════════════════ */
const SKEY='transoek_v2';
function ldSD(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch{return{};}}
function svSD(){localStorage.setItem(SKEY,JSON.stringify(SD));}
let SD=ldSD();
if(!SD.xp)SD.xp=0;if(!SD.done)SD.done=[];

function xpLv(){
  const x=SD.xp;
  if(x<150)return{l:'Begynder',n:150};if(x<350)return{l:'Studerende',n:350};
  if(x<700)return{l:'Analytiker',n:700};if(x<1200)return{l:'Ekspert',n:1200};
  return{l:'Økonomi-Mester',n:null};
}

/* HOME */
function buildHome(){
  const lv=xpLv();
  const tot=MISSIONS.reduce((s,m)=>s+m.xp,0);
  const pct=Math.min(100,Math.round(SD.xp/tot*100));
  document.getElementById('xp-fill').style.width=pct+'%';
  document.getElementById('xp-lbl').textContent=`${SD.xp} XP — ${lv.l}`;
  const g=document.getElementById('mgrid');g.innerHTML='';
  MISSIONS.forEach((m,i)=>{
    const done=SD.done.includes(m.id);
    const locked=i>0&&!SD.done.includes(MISSIONS[i-1].id);
    const d=document.createElement('div');
    d.className=`mcard${done?' done':locked?' locked':''}`;
    d.innerHTML=`<div class="mc-icon">${m.icon}</div>
      <div class="mc-info">
        <div class="mc-num">Mission ${i+1} · ${m.steps.length} opgaver</div>
        <div class="mc-title">${m.title}</div>
        <div class="mc-desc">${m.desc}</div>
        <div class="mc-tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="mc-right"><div class="mc-xp">+${m.xp} XP</div><div class="mc-status">${done?'✅':locked?'🔒':''}</div></div>`;
    if(!locked)d.onclick=()=>startMission(m.id);
    g.appendChild(d);
  });
}
function goHome(){curStep=0;show('s-home');buildHome();}

/* MISSION ENGINE */
let curMId=null,curStep=0,stepRes=[];
function startMission(id){
  curMId=id;curStep=0;stepRes=[];
  const m=MISSIONS.find(x=>x.id===id);
  document.getElementById('mtop-title').textContent=`${m.icon} ${m.title}`;
  buildProg(m);renderStep();show('s-mission');
}
function buildProg(m){
  const p=document.getElementById('sprog');p.innerHTML='';
  m.steps.forEach((_,i)=>{const d=document.createElement('div');d.className='sp';d.id=`sp${i}`;p.appendChild(d);});
  updProg();
}
function updProg(){
  const m=MISSIONS.find(x=>x.id===curMId);
  m.steps.forEach((_,i)=>{
    const d=document.getElementById(`sp${i}`);if(!d)return;
    d.className='sp';
    if(i<curStep)d.classList.add('ok');
    if(i===curStep)d.classList.add('cur');
  });
}
function renderStep(){
  selMC=null;
  const m=MISSIONS.find(x=>x.id===curMId);
  const s=m.steps[curStep];
  const total=m.steps.length;
  document.getElementById('mtop-ctr').textContent=`${curStep+1}/${total}`;
  const area=document.getElementById('qarea');area.innerHTML='';
  const ctxEl=document.createElement('div');ctxEl.className='ctx-card';ctxEl.innerHTML=s.ctx;area.appendChild(ctxEl);
  const qqEl=document.createElement('div');qqEl.className='qq-card';
  let inp='';
  if(s.type==='mc'){
    inp=`<div class="mc-opts">${s.opts.map((o,i)=>`<button class="mco" id="mco${i}" onclick="pickMC(${i})"><span class="mco-k">${String.fromCharCode(65+i)}.</span><span>${o}</span></button>`).join('')}</div>`;
  } else {
    inp=`<div class="nrow"><span class="nlbl">${s.label||'Svar ='}</span><input class="ninp" id="ninp" type="number" step="any" inputmode="decimal" placeholder="?" autocomplete="off"><span class="nlbl">${s.unit||''}</span></div>`;
  }
  qqEl.innerHTML=`<div class="qq-num">Opgave ${curStep+1} af ${total}</div>
    <div class="qq-text">${s.q}</div>
    ${s.hint?`<div class="qq-hint">💡 ${s.hint}</div>`:''}${inp}`;
  area.appendChild(qqEl);
  const fbEl=document.createElement('div');fbEl.className='fb';fbEl.id='fbel';area.appendChild(fbEl);
  const br=document.createElement('div');br.className='btn-row';
  br.innerHTML=`<button class="chkbtn" id="chkbtn" onclick="checkStep()">Tjek svar ✓</button>
    <button class="nxtbtn" id="nxtbtn" onclick="nextStep()">${curStep<total-1?'Næste opgave →':'Afslut mission →'}</button>`;
  area.appendChild(br);
  updProg();
  if(s.type==='num'){
    const ni=document.getElementById('ninp');
    setTimeout(()=>ni?.focus(),80);
    ni?.addEventListener('keydown',e=>{if(e.key==='Enter')checkStep();});
  }
}
let selMC=null;
function pickMC(i){
  if(document.getElementById('mco0')?.disabled)return;
  selMC=i;
  document.querySelectorAll('.mco').forEach((b,j)=>{
    b.style.background=j===i?'rgba(0,230,118,.1)':'';
    b.style.borderColor=j===i?'rgba(0,230,118,.4)':'';
  });
}
function checkStep(){
  const m=MISSIONS.find(x=>x.id===curMId);
  const s=m.steps[curStep];
  let ok=false;
  if(s.type==='mc'){
    if(selMC===null)return;
    ok=selMC===s.correct;
    document.querySelectorAll('.mco').forEach((b,i)=>{
      b.disabled=true;b.style.background='';b.style.borderColor='';
      if(i===s.correct)b.classList.add('ok');
      else if(i===selMC&&!ok)b.classList.add('no');
    });
    selMC=null;
  } else {
    const ni=document.getElementById('ninp');
    const v=parseFloat(ni?.value?.replace(',','.'));
    if(isNaN(v)){ni?.classList.add('no');setTimeout(()=>ni?.classList.remove('no'),400);return;}
    ok=Math.abs(v-s.correct)<=s.tol;
    ni.disabled=true;
    ni.classList.add(ok?'ok':'no');
  }
  stepRes.push(ok);
  renderFB(s,ok);
  document.getElementById('chkbtn').disabled=true;
  document.getElementById('nxtbtn').classList.add('on');
}
function renderFB(s,ok){
  const fb=document.getElementById('fbel');if(!fb)return;
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=`
    <div class="fb-verdict ${ok?'ok':'no'}">${ok?'✅ '+s.fb.v:'❌ Ikke helt — men her er forklaringen:'}</div>
    <div class="fb-exp">${s.fb.e}</div>
    <div class="why">
      <div class="why-h">🎓 Hvorfor gør man det sådan?</div>
      <div class="why-b">${s.fb.w}</div>
    </div>`;
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function nextStep(){
  const m=MISSIONS.find(x=>x.id===curMId);
  curStep++;
  if(curStep>=m.steps.length){endMission();}
  else{selMC=null;renderStep();document.querySelector('.qscroll')?.scrollTo(0,0);}
}
function endMission(){
  const m=MISSIONS.find(x=>x.id===curMId);
  const ok=stepRes.filter(Boolean).length,tot=stepRes.length;
  const earned=Math.round(m.xp*(ok/tot));
  SD.xp+=earned;
  if(!SD.done.includes(m.id)&&ok>=Math.ceil(tot*.6))SD.done.push(m.id);
  svSD();
  document.getElementById('done-sc').textContent=`${ok}/${tot} korrekte · +${earned} XP`;
  document.getElementById('done-msg').textContent=ok===tot?'Perfekt score! Du behersker dette emne fuldt ud.':ok>=Math.ceil(tot*.6)?'Godt klaret! Kig forklaringerne igennem igen.':'Bliv ved — prøv igen og læs forklaringerne grundigt.';
  show('s-done');
}
function retryMission(){if(curMId!==null)startMission(curMId);}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}
buildHome();
</script>
